<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parts Review — UI Library</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="masthead"><div><p class="eyebrow">UI LIBRARY / LOCAL WORKSPACE</p><h1>Parts Review<span>パーツの選定と比較</span></h1></div><div class="io"><button id="export" disabled>↓ approvals.json をエクスポート</button><label class="import">↑ インポート<input id="import" type="file" accept="application/json,.json" disabled></label></div></header>
<main>
<div class="toolbar"><div class="filters"><label>Section<select id="section" disabled><option value="">すべてのsection</option></select></label><label>Status<select id="status" disabled><option value="">すべての状態</option><option value="pending">未レビュー</option><option value="approved">承認</option><option value="rejected">却下</option><option value="hold">保留</option></select></label></div><label class="compare-toggle"><input id="compare" type="checkbox">比較ビュー（元画像 / 再現画像）</label></div>
<p id="summary" class="summary"></p><p id="notice" role="status" aria-live="polite">データを読み込んでいます…</p><div id="cards" class="cards"></div>
</main>
<footer>ローカルレビュー · 状態とメモはこのブラウザに保存されます。</footer>
</body></html>
