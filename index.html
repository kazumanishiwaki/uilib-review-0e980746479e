<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ボタンデザインライブラリ</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="page-header"><div><p class="eyebrow">BUTTON DESIGN LIBRARY</p><h1>ボタンを集める、見つける。</h1><p class="subtitle">かたちやスタイルで絞り込んで、気になるデザインをチェック。</p></div><div class="actions"><button id="export">評価を書き出す</button><label class="button" for="import">評価を読み込む</label><input id="import" type="file" accept="application/json,.json" hidden></div></header>
  <details class="filters" open>
    <summary>絞り込み <span id="count" aria-live="polite">読み込み中…</span></summary>
    <div class="filter-body"><div id="chips"></div><div class="selects"><label>サイト<select id="site"><option value="">すべてのサイト</option></select></label><label>評価<select id="status"><option value="">すべての評価</option><option value="unreviewed">未評価</option><option value="ok">OK</option><option value="ng">NG</option><option value="hold">保留</option></select></label><button id="reset">絞り込みをリセット</button></div></div>
  </details>
  <main><p id="notice" role="status"></p><div id="gallery" class="grid" aria-label="ボタン一覧"></div><p id="empty" hidden>条件に合うボタンがありません。</p></main>
  <dialog id="detail" aria-labelledby="detail-title"><div class="modal-head"><div><p class="eyebrow">BUTTON DETAIL</p><h2 id="detail-title"></h2></div><button id="close" aria-label="詳細を閉じる">✕</button></div><div id="detail-content"></div><div class="review" role="group" aria-label="このボタンの評価"><button data-status="ok">OK</button><button data-status="ng">NG</button><button data-status="hold">保留</button></div></dialog>
</body>
</html>
