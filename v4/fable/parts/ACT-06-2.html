<style>
.p-ACT-06-2{position:relative}.p-ACT-06-2 .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3);margin:0;padding:var(--space-3);list-style:none;background-color:var(--color-surface);border-radius:var(--radius-lg)}.p-ACT-06-2 .card{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2);padding:var(--space-4);background-color:var(--color-surface-raised);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--shadow-xs);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;transition:box-shadow var(--duration-fast) var(--ease-standard),transform var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard)}.p-ACT-06-2 .card:hover{box-shadow:var(--shadow-md);transform:translateY(calc(var(--space-0-5) * -1))}.p-ACT-06-2 .card:focus-visible{box-shadow:var(--focus-ring)}.p-ACT-06-2 .card.is-dragging{position:relative;z-index:var(--z-raised);border-color:var(--color-brand);box-shadow:var(--shadow-lg);transform:scale(1.03);cursor:grabbing}.p-ACT-06-2 .tag{padding:var(--space-0-5) var(--space-2);background-color:var(--color-surface-strong);color:var(--color-text-muted);border-radius:var(--radius-xs);font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);line-height:var(--line-height-snug);letter-spacing:var(--letter-spacing-wide)}.p-ACT-06-2 .title{font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);line-height:var(--line-height-snug)}
</style>
<div class="p-ACT-06-2"><ul class="grid"><li class="card" tabindex="0" aria-roledescription="並べ替えできるカード"><span class="tag">企画</span><span class="title">要件を整理する</span></li><li class="card" tabindex="0" aria-roledescription="並べ替えできるカード"><span class="tag">設計</span><span class="title">画面の構成を決める</span></li><li class="card" tabindex="0" aria-roledescription="並べ替えできるカード"><span class="tag">実装</span><span class="title">一覧画面を作る</span></li><li class="card" tabindex="0" aria-roledescription="並べ替えできるカード"><span class="tag">実装</span><span class="title">入力フォームを作る</span></li><li class="card" tabindex="0" aria-roledescription="並べ替えできるカード"><span class="tag">検証</span><span class="title">動作を確認する</span></li><li class="card" tabindex="0" aria-roledescription="並べ替えできるカード"><span class="tag">公開</span><span class="title">リリースの準備</span></li></ul></div>
<script>
(function(){document.querySelectorAll('.p-ACT-06-2').forEach(function(root){var grid=root.querySelector('.grid'),card=null;function move(e){if(!card)return;var el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest('.card');if(!t||t===card||t.parentNode!==grid)return;if(card.compareDocumentPosition(t)&4){grid.insertBefore(card,t.nextSibling);}else{grid.insertBefore(card,t);}}function up(){if(card){card.classList.remove('is-dragging');card=null;}window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);}grid.addEventListener('pointerdown',function(e){var c=e.target.closest('.card');if(!c)return;card=c;c.classList.add('is-dragging');window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);});grid.addEventListener('keydown',function(e){var c=e.target.closest('.card');if(!c)return;var k=e.key;if(k==='ArrowLeft'||k==='ArrowUp'){if(c.previousElementSibling){grid.insertBefore(c,c.previousElementSibling);c.focus();}}else if(k==='ArrowRight'||k==='ArrowDown'){if(c.nextElementSibling){grid.insertBefore(c.nextElementSibling,c);}}else{return;}e.preventDefault();});});})();
</script>
