<!-- ACT-02-1 -->
<style>
.p-ACT-02-1{display:flex;justify-content:center;padding:var(--space-6) var(--space-4)}.p-ACT-02-1 .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-width:calc(var(--space-16) * 2.5);min-height:var(--size-control-md);padding:var(--space-2) var(--space-4);background-color:var(--color-brand);color:var(--color-on-brand);border:var(--border-width-thin) solid var(--color-brand);border-radius:var(--radius-md);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold);line-height:var(--line-height-snug);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard),color var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard)}.p-ACT-02-1 .btn svg{width:var(--size-icon-sm);height:var(--size-icon-sm);fill:none;stroke:currentColor;stroke-width:var(--border-width-medium)}.p-ACT-02-1 .btn .ico-check{display:none}.p-ACT-02-1 .btn:hover{background-color:var(--color-brand-hover);border-color:var(--color-brand-hover)}.p-ACT-02-1 .btn:active{background-color:var(--color-brand-active)}.p-ACT-02-1 .btn[aria-pressed=true]{background-color:var(--color-bg);color:var(--color-text);border-color:var(--color-border-strong)}.p-ACT-02-1 .btn[aria-pressed=true] .ico-check{display:block;color:var(--color-success)}.p-ACT-02-1 .btn[aria-pressed=true] .ico-plus{display:none}.p-ACT-02-1 .btn[aria-pressed=true]:hover{background-color:var(--color-surface-strong)}
</style>
<div class="p-ACT-02-1"><button type="button" class="btn" aria-pressed="false"><svg class="ico-plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><svg class="ico-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span class="label">フォローする</span></button></div>
<script>
(function(){document.querySelectorAll('.p-ACT-02-1 .btn').forEach(function(b){b.addEventListener('click',function(){var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.querySelector('.label').textContent=on?'フォロー中':'フォローする';});});})();
</script>
