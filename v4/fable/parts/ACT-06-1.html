<style>
.p-ACT-06-1{position:relative}.p-ACT-06-1 .list{display:flex;flex-direction:column;gap:var(--space-2);margin:0;padding:0;list-style:none}.p-ACT-06-1 .item{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-4) var(--space-1) var(--space-1);background-color:var(--color-bg);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-md);transition:background-color var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard),box-shadow var(--duration-fast) var(--ease-standard)}.p-ACT-06-1 .item.is-dragging{position:relative;z-index:var(--z-raised);background-color:var(--color-brand-subtle);border-color:var(--color-brand);box-shadow:var(--shadow-md);-webkit-user-select:none;user-select:none}.p-ACT-06-1 .handle{flex:none;display:grid;place-items:center;width:var(--size-touch-min);height:var(--size-touch-min);padding:0;background-color:transparent;color:var(--color-text-muted);border:0;border-radius:var(--radius-sm);cursor:grab;touch-action:none;transition:background-color var(--duration-fast) var(--ease-standard),color var(--duration-fast) var(--ease-standard)}.p-ACT-06-1 .handle svg{width:var(--size-icon-md);height:var(--size-icon-md);fill:currentColor}.p-ACT-06-1 .handle:hover{background-color:var(--color-surface-strong);color:var(--color-text)}.p-ACT-06-1 .item.is-dragging .handle{background-color:transparent;color:var(--color-brand);cursor:grabbing}.p-ACT-06-1 .name{flex:1;min-width:0;font-size:var(--font-size-md);font-weight:var(--font-weight-medium);line-height:var(--line-height-snug)}.p-ACT-06-1 .meta{font-size:var(--font-size-sm);color:var(--color-text-muted);font-variant-numeric:tabular-nums}.p-ACT-06-1 .live{position:absolute;width:var(--border-width-thin);height:var(--border-width-thin);overflow:hidden;clip-path:inset(50%);white-space:nowrap}

<div class="p-ACT-06-1"><ul class="list"><li class="item"><button type="button" class="handle" aria-label="並べ替え（上下キーで移動）"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg></button><span class="name">受信トレイ</span><span class="meta">12</span></li><li class="item"><button type="button" class="handle" aria-label="並べ替え（上下キーで移動）"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg></button><span class="name">下書き</span><span class="meta">3</span></li><li class="item"><button type="button" class="handle" aria-label="並べ替え（上下キーで移動）"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg></button><span class="name">送信済み</span><span class="meta">48</span></li><li class="item"><button type="button" class="handle" aria-label="並べ替え（上下キーで移動）"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg></button><span class="name">アーカイブ</span><span class="meta">7</span></li></ul><span class="live" aria-live="polite"></span></div>
<script>
(function(){document.querySelectorAll('.p-ACT-06-1').forEach(function(root){var list=root.querySelector('.list'),live=root.querySelector('.live'),item=null;function say(el){live.textContent=el.querySelector('.name').textContent+'を'+(Array.prototype.indexOf.call(list.children,el)+1)+'番目に移動しました';}function up(el){var p=el.previousElementSibling;if(p){list.insertBefore(p,el.nextSibling);return true;}return false;}function down(el){var n=el.nextElementSibling;if(n){list.insertBefore(n,el);return true;}return false;}list.addEventListener('pointerdown',function(e){var h=e.target.closest('.handle');if(!h)return;item=h.parentNode;item.classList.add('is-dragging');h.setPointerCapture(e.pointerId);});list.addEventListener('pointermove',function(e){if(!item)return;var p=item.previousElementSibling,n=item.nextElementSibling,r;if(p){r=p.getBoundingClientRect();if(e.clientY<r.top+r.height/2){up(item);return;}}if(n){r=n.getBoundingClientRect();if(e.clientY>r.top+r.height/2){down(item);}}});function end(){if(!item)return;item.classList.remove('is-dragging');say(item);item=null;}list.addEventListener('pointerup',end);list.addEventListener('pointercancel',end);list.addEventListener('keydown',function(e){var h=e.target.closest('.handle');if(!h)return;var ok;if(e.key==='ArrowUp'){ok=up(h.parentNode);}else if(e.key==='ArrowDown'){ok=down(h.parentNode);}else{return;}e.preventDefault();if(ok)say(h.parentNode);});});})();
</script>
