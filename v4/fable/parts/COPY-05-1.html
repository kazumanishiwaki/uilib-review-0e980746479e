<section class="p-COPY-05-1"><h3 class="ttl">アンケートを始める前に</h3><p class="txt">質問は全部で5問、目安は10分です。</p><div class="note"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 5.5V10l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><div><p class="main">20分間操作がないと、入力した回答を削除します。</p><p class="sub">席を離れるときは「一時保存」を押してください。保存した回答は7日間残ります。</p></div></div><button type="button" class="btn">回答を始める</button></section>
