<style>
.p-ACT-07-1{--split:50%;position:relative;display:flex;height:calc(var(--space-16) * 3.5);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;background-color:var(--color-bg)}.p-ACT-07-1.is-dragging{cursor:col-resize;-webkit-user-select:none;user-select:none}.p-ACT-07-1 .pane{display:flex;flex-direction:column;gap:var(--space-3);min-width:0;padding:var(--space-4);overflow:hidden}.p-ACT-07-1 .pane-a{flex:none;width:var(--split);background-color:var(--color-surface)}.p-ACT-07-1 .pane-b{flex:1}.p-ACT-07-1 .pane-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2);font-size:var(--font-size-xs);color:var(--color-text-muted);line-height:var(--line-height-snug);letter-spacing:var(--letter-spacing-wide);white-space:nowrap}.p-ACT-07-1 .val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:var(--letter-spacing-tight)}.p-ACT-07-1 .code{margin:0;font-family:var(--font-mono);font-size:var(--font-size-sm);line-height:var(--line-height-normal);white-space:pre}.p-ACT-07-1 .preview h4{margin:0 0 var(--space-2);font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);line-height:var(--line-height-tight);white-space:nowrap}.p-ACT-07-1 .preview p{margin:0;font-size:var(--font-size-sm);line-height:var(--line-height-normal);white-space:nowrap}.p-ACT-07-1 .sep{flex:none;position:relative;width:var(--space-3);background-color:var(--color-surface-strong);border-left:var(--border-width-thin) solid var(--color-border);border-right:var(--border-width-thin) solid var(--color-border);cursor:col-resize;touch-action:none;transition:background-color var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard)}.p-ACT-07-1 .sep::after{content:'';position:absolute;top:50%;left:50%;width:var(--border-width-medium);height:var(--space-8);transform:translate(-50%,-50%);border-radius:var(--radius-full);background-color:var(--color-border-strong);transition:background-color var(--duration-fast) var(--ease-standard)}.p-ACT-07-1 .sep:hover,.p-ACT-07-1.is-dragging .sep{background-color:var(--color-brand-subtle);border-color:var(--color-brand-border)}.p-ACT-07-1 .sep:hover::after,.p-ACT-07-1.is-dragging .sep::after{background-color:var(--color-brand)}.p-ACT-07-1 .sep:focus-visible{box-shadow:inset 0 0 0 var(--focus-ring-width) var(--color-focus)}
</style>
<div class="p-ACT-07-1"><div class="pane pane-a"><div class="pane-head"><span>エディタ</span><span class="val val-a">50%</span></div><pre class="code"># 見出し
本文を書く</pre></div><div class="sep" role="separator" tabindex="0" aria-orientation="vertical" aria-label="エディタとプレビューの境目" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50"></div><div class="pane pane-b"><div class="pane-head"><span>プレビュー</span><span class="val val-b">50%</span></div><div class="preview"><h4>見出し</h4><p>本文を書く</p></div></div></div>
<script>
(function(){document.querySelectorAll('.p-ACT-07-1').forEach(function(root){var sep=root.querySelector('.sep'),a=root.querySelector('.val-a'),b=root.querySelector('.val-b'),v=50,on=false;function set(n){v=Math.max(20,Math.min(80,Math.round(n)));root.style.setProperty('--split',v+'%');sep.setAttribute('aria-valuenow',v);a.textContent=v+'%';b.textContent=(100-v)+'%';}sep.addEventListener('pointerdown',function(e){on=true;sep.setPointerCapture(e.pointerId);root.classList.add('is-dragging');});sep.addEventListener('pointermove',function(e){if(!on)return;var r=root.getBoundingClientRect();set((e.clientX-r.left)/r.width*100);});function end(){on=false;root.classList.remove('is-dragging');}sep.addEventListener('pointerup',end);sep.addEventListener('pointercancel',end);sep.addEventListener('keydown',function(e){var k=e.key;if(k==='ArrowLeft'){set(v-2);}else if(k==='ArrowRight'){set(v+2);}else if(k==='Home'){set(20);}else if(k==='End'){set(80);}else{return;}e.preventDefault();});set(50);});})();
</script>
