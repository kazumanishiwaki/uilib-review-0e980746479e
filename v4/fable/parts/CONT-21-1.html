<section class="p-CONT-21-1" data-filter='all'><header><h3>通知<span class='badge'>未読 <b class='cnt'>3</b></span></h3><div class='flt' role='group' aria-label='絞り込み'><button type='button' data-f='all' aria-pressed='true'>すべて</button><button type='button' data-f='unread' aria-pressed='false'>未読のみ</button></div></header><div class='bar'><label><input type='checkbox' class='all'>すべて選択</label><button type='button' class='read' disabled>選択を既読にする</button></div><h4>今日</h4><ul><li class='is-unread'><input type='checkbox' aria-label='選択'><span class='dot' aria-hidden='true'></span><p>大野さんが見積書にコメントしました</p><time>10:42</time></li><li class='is-unread'><input type='checkbox' aria-label='選択'><span class='dot' aria-hidden='true'></span><p>出張申請が承認されました</p><time>09:50</time></li><li><input type='checkbox' aria-label='選択'><span class='dot' aria-hidden='true'></span><p>週次レポートが作成されました</p><time>08:00</time></li></ul><h4>昨日</h4><ul><li class='is-unread'><input type='checkbox' aria-label='選択'><span class='dot' aria-hidden='true'></span><p>林さんが契約書を更新しました</p><time>17:20</time></li><li><input type='checkbox' aria-label='選択'><span class='dot' aria-hidden='true'></span><p>パスワードを変更しました</p><time>11:03</time></li></ul></section>
<script>
(function(){document.querySelectorAll('.p-CONT-21-1').forEach(function(r){var cbs=[].slice.call(r.querySelectorAll('li input')),all=r.querySelector('.all'),btn=r.querySelector('.read'),cnt=r.querySelector('.cnt'),fs=[].slice.call(r.querySelectorAll('.flt button'));function sync(){var n=cbs.filter(function(c){return c.checked;}).length;btn.disabled=n===0;all.checked=n===cbs.length;all.indeterminate=n>0&&n<cbs.length;cnt.textContent=r.querySelectorAll('li.is-unread').length;}cbs.forEach(function(c){c.addEventListener('change',sync);});all.addEventListener('change',function(){cbs.forEach(function(c){c.checked=all.checked;});sync();});btn.addEventListener('click',function(){cbs.forEach(function(c){if(c.checked){c.closest('li').classList.remove('is-unread');c.checked=false;}});sync();});fs.forEach(function(b){b.addEventListener('click',function(){fs.forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});r.setAttribute('data-filter',b.getAttribute('data-f'));});});});})();
