<!-- NAV-01-1 -->
<style>
.p-NAV-01-1{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-4);min-height:var(--size-control-xl);padding:var(--space-2) var(--space-4);border-bottom:var(--border-width-thin) solid var(--color-border);background:var(--color-surface-raised)}.p-NAV-01-1 .logo{border-radius:var(--radius-sm);color:var(--color-text);font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);line-height:var(--line-height-snug);text-decoration:none}.p-NAV-01-1 .status{display:inline-flex;align-items:center;gap:var(--space-2);margin:0 auto;padding:var(--space-1) var(--space-3);border:var(--border-width-thin) solid var(--color-success-border);border-radius:var(--radius-full);background:var(--color-success-subtle);color:var(--color-success);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);line-height:var(--line-height-snug);transition:background-color var(--duration-fast) var(--ease-standard),color var(--duration-fast) var(--ease-standard)}.p-NAV-01-1 .status[data-state='closed']{border-color:var(--color-border);background:var(--color-surface-strong);color:var(--color-text-muted)}.p-NAV-01-1 .dot{width:var(--space-2);height:var(--space-2);border-radius:var(--radius-full);background:currentColor}.p-NAV-01-1 .clock{padding-left:var(--space-2);border-left:var(--border-width-thin) solid currentColor;color:var(--color-text);font-variant-numeric:tabular-nums;letter-spacing:var(--letter-spacing-tight)}.p-NAV-01-1 .links{display:flex;gap:var(--space-1)}.p-NAV-01-1 .links a{display:inline-flex;align-items:center;min-height:var(--size-touch-min);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text);font-size:var(--font-size-sm);text-decoration:none;transition:background-color var(--duration-fast) var(--ease-standard)}.p-NAV-01-1 .links a:hover{background:var(--color-surface-strong)}
</style>
<header class='p-NAV-01-1'><a class='logo' href='#0'>しずか窓口</a><p class='status' data-state='open'><span class='dot' aria-hidden='true'></span><span class='label'>受付中</span><time class='clock' datetime='10:00'>10:00</time></p><nav class='links' aria-label='主要'><a href='#0'>サービス</a><a href='#0'>よくある質問</a><a href='#0'>お問い合わせ</a></nav></header>
<script>
(function(){document.querySelectorAll('.p-NAV-01-1').forEach(function(r){var s=r.querySelector('.status'),l=r.querySelector('.label'),c=r.querySelector('.clock');function p(n){return (n<10?'0':'')+n}function tick(){var d=new Date(),h=d.getHours(),t=p(h)+':'+p(d.getMinutes()),o=h>=9&&h<18;c.textContent=t;c.setAttribute('datetime',t);s.setAttribute('data-state',o?'open':'closed');l.textContent=o?'受付中':'受付時間外'}tick();setInterval(tick,30000)})})();
</script>
