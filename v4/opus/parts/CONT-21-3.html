<div class="p-CONT-21-3"><div class="box"><div class="hd"><h3 class="t">通知</h3><span class="pend" aria-live="polite">対応待ち <b class="pn">3</b>件</span></div><ul class="list"><li class="row"><span class="av a2" aria-hidden="true">佐</span><div class="body"><p class="msg"><b>佐藤 美咲</b>さんが「営業部」チームへの参加を申請しました</p><p class="meta">参加申請 ・ 5分前</p><div class="acts"><button type="button" class="btn ok" data-kind="ok" data-done="承認しました">承認</button><button type="button" class="btn ng" data-kind="ng" data-done="却下しました">却下</button></div><p class="result" hidden><span class="rt"></span><button type="button" class="undo">取り消す</button></p></div></li><li class="row"><span class="av a3" aria-hidden="true">鈴</span><div class="body"><p class="msg"><b>鈴木 一郎</b>さんから「新製品プロジェクト」に招待されました</p><p class="meta">招待 ・ 1時間前</p><div class="acts"><button type="button" class="btn ok" data-kind="ok" data-done="参加しました">参加する</button><button type="button" class="btn ng" data-kind="ng" data-done="辞退しました">辞退</button></div><p class="result" hidden><span class="rt"></span><button type="button" class="undo">取り消す</button></p></div></li><li class="row"><span class="av a4" aria-hidden="true">高</span><div class="body"><p class="msg"><b>高橋</b>さんが「提案書」にコメントしました</p><p class="meta">コメント ・ 2時間前</p></div></li><li class="row"><span class="av a1" aria-hidden="true">山</span><div class="body"><p class="msg"><b>山本 健太</b>さんの経費精算（¥3,200）の承認依頼</p><p class="meta">経費 ・ 昨日</p><div class="acts"><button type="button" class="btn ok" data-kind="ok" data-done="承認しました">承認</button><button type="button" class="btn ng" data-kind="ng" data-done="差し戻しました">差し戻し</button></div><p class="result" hidden><span class="rt"></span><button type="button" class="undo">取り消す</button></p></div></li></ul></div></div>
<script>
(function(){document.querySelectorAll('.p-CONT-21-3').forEach(function(root){var pn=root.querySelector('.pn'),all=[].slice.call(root.querySelectorAll('.acts'));function count(){pn.textContent=all.filter(function(a){return !a.hidden;}).length;}root.querySelectorAll('.row').forEach(function(row){var acts=row.querySelector('.acts');if(!acts)return;var res=row.querySelector('.result'),rt=row.querySelector('.rt'),undo=row.querySelector('.undo');acts.querySelectorAll('.btn').forEach(function(b){b.addEventListener('click',function(){acts.hidden=true;res.hidden=false;res.classList.toggle('is-ng',b.getAttribute('data-kind')==='ng');rt.textContent=b.getAttribute('data-done');row.classList.add('is-done');count();undo.focus();});});undo.addEventListener('click',function(){res.hidden=true;acts.hidden=false;row.classList.remove('is-done');count();acts.querySelector('.btn').focus();});});count();});})();
