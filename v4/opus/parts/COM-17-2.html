<div class='p-COM-17-2'><h3 class='h'>メール配信設定</h3><p class='addr'>k***@example.jp</p><div class='now'><p class='cap'>現在の設定</p><p class='val'><span>種類：<b class='types'>セール・キャンペーン、新着商品</b></span><span>頻度：<b class='freq'>週1回まとめて</b></span></p></div><form class='form'><fieldset class='grp'><legend>受け取るメール</legend><div class='rows'><label class='row'><input type='checkbox' name='c172-t' value='セール・キャンペーン' checked><span><span class='nm'>セール・キャンペーン</span><span class='ds'>月2〜4通</span></span></label><label class='row'><input type='checkbox' name='c172-t' value='新着商品' checked><span><span class='nm'>新着商品</span><span class='ds'>週1通ほど</span></span></label><label class='row'><input type='checkbox' name='c172-t' value='再入荷のお知らせ'><span><span class='nm'>再入荷のお知らせ</span><span class='ds'>お気に入りの商品が入荷したとき</span></span></label><label class='row'><input type='checkbox' checked disabled><span><span class='nm'>注文・配送の連絡</span><span class='ds'>取引に必要なため停止できません</span></span></label></div></fieldset><fieldset class='grp'><legend>頻度</legend><div class='seg'><label><input type='radio' name='c172-f' value='届くたびに'>届くたびに</label><label><input type='radio' name='c172-f' value='週1回まとめて' checked>週1回まとめて</label><label><input type='radio' name='c172-f' value='月1回まとめて'>月1回まとめて</label></div></fieldset><div class='acts'><button type='submit' class='btn pri'>設定を保存</button><p class='msg' role='status'></p></div><div class='end'><button type='button' class='all'>販促メールをすべて停止</button></div></form></div>
