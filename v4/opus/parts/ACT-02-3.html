<style>

<div class='p-ACT-02-3'><button type='button' class='p-ACT-02-3__btn' aria-pressed='false'><svg class='p-ACT-02-3__icon' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linejoin='round' aria-hidden='true'><path d='M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z'/></svg><span class='p-ACT-02-3__sr'>いいね</span><span class='p-ACT-02-3__count'>128</span></button></div>
