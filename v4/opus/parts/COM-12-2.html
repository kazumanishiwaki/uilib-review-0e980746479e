<div class='p-COM-12-2'><section class='cal' aria-labelledby='c1202-t'><div class='chead'><h3 id='c1202-t' class='title'>2026年11月のお届け</h3><p class='legend'><span><span class='key cur' aria-hidden='true'></span>お届け予定</span><span><span class='key sel' aria-hidden='true'></span>選択中</span></p></div><table class='grid'><caption class='vh'>日付を選ぶと、お届け日を変更できます。矢印キーで日付を移動できます。</caption><thead><tr><th scope='col' abbr='日曜'>日</th><th scope='col' abbr='月曜'>月</th><th scope='col' abbr='火曜'>火</th><th scope='col' abbr='水曜'>水</th><th scope='col' abbr='木曜'>木</th><th scope='col' abbr='金曜'>金</th><th scope='col' abbr='土曜'>土</th></tr></thead><tbody data-body></tbody></table><p class='info' data-info></p><p class='hint'>11月13日〜27日の間で選び直せます</p><button type='button' class='btn' data-apply aria-disabled='true'>この日に変更</button><p class='vh' role='status' data-status></p></section></div>
<script>
(function(){var r=document.querySelector('.p-COM-12-2');if(!r)return;var body=r.querySelector('[data-body]'),info=r.querySelector('[data-info]'),apply=r.querySelector('[data-apply]'),st=r.querySelector('[data-status]'),W='日月火水木金土',cur=20,sel=20,MIN=13,MAX=27,TODAY=11,DAYS=30,btns=[],start=new Date(2026,10,1).getDay(),tr;function lab(d){return '11月'+d+'日（'+W[new Date(2026,10,d).getDay()]+'）';}for(var i=0;i<start+DAYS;i++){if(i%7===0){tr=document.createElement('tr');body.appendChild(tr);}var td=document.createElement('td');tr.appendChild(td);if(i<start)continue;var d=i-start+1,b=document.createElement('button');b.type='button';b.className='day';b.textContent=d;b.dataset.d=d;if(d<MIN||d>MAX)b.setAttribute('aria-disabled','true');if(d===TODAY)b.classList.add('today');td.appendChild(b);btns[d]=b;}while(tr.children.length<7)tr.appendChild(document.createElement('td'));function render(){btns.forEach(function(b,d){var c=d===cur,s=d===sel,off=b.getAttribute('aria-disabled')==='true';b.classList.toggle('is-cur',c);b.setAttribute('aria-pressed',s?'true':'false');b.tabIndex=s?0:-1;b.setAttribute('aria-label',lab(d)+(c?' お届け予定':'')+(d===TODAY?' 今日':'')+(off?' 選択できません':''));});info.textContent=sel===cur?'お届け予定: '+lab(cur):'変更後: '+lab(cur)+' → '+lab(sel);apply.setAttribute('aria-disabled',sel===cur?'true':'false');}body.addEventListener('click',function(e){var b=e.target.closest('.day');if(!b||b.getAttribute('aria-disabled')==='true')return;sel=+b.dataset.d;render();b.focus();});var MOVE={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7};body.addEventListener('keydown',function(e){var b=e.target.closest('.day');if(!b||!(e.key in MOVE))return;var n=+b.dataset.d+MOVE[e.key];if(!btns[n])return;e.preventDefault();b.tabIndex=-1;btns[n].tabIndex=0;btns[n].focus();});apply.addEventListener('click',function(){if(apply.getAttribute('aria-disabled')==='true')return;cur=sel;render();st.textContent='お届け日を'+lab(cur)+'に変更しました';});render();})();
</script>
