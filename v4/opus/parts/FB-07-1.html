<!-- FB-07-1 -->
<style>
.p-FB-07-1{padding:var(--space-5);background:var(--color-bg);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-lg);font-family:var(--font-sans);font-size:var(--font-size-md);line-height:var(--line-height-normal);letter-spacing:var(--letter-spacing-normal);color:var(--color-text)}.p-FB-07-1 .top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3)}.p-FB-07-1 .label{font-size:var(--font-size-sm);font-weight:var(--font-weight-medium)}.p-FB-07-1 .pct{font-size:var(--font-size-sm);font-weight:var(--font-weight-bold);font-variant-numeric:tabular-nums;letter-spacing:var(--letter-spacing-tight)}.p-FB-07-1 .track{height:var(--space-2);margin:var(--space-2) 0 var(--space-3);background:var(--color-surface-strong);border-radius:var(--radius-full);overflow:hidden}.p-FB-07-1 .fill{display:block;height:100%;background:var(--color-brand);border-radius:var(--radius-full);transition:width var(--duration-normal) var(--ease-standard),background-color var(--duration-normal) var(--ease-standard)}.p-FB-07-1.is-done .fill{background:var(--color-success)}.p-FB-07-1 .foot{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}.p-FB-07-1 .meta{font-size:var(--font-size-xs);font-variant-numeric:tabular-nums;color:var(--color-text-muted)}.p-FB-07-1 .btn{min-height:var(--size-control-sm);padding:0 var(--space-3);background:var(--color-bg);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-md);font-size:var(--font-size-sm);cursor:pointer}.p-FB-07-1 .btn:not(:disabled):hover{background:var(--color-surface-strong)}
</style>
<div class="p-FB-07-1"><div class="top"><span class="label" id="p-FB-07-1-l">資料.zip をアップロード中</span><span class="pct" aria-hidden="true">40%</span></div><div class="track" role="progressbar" aria-labelledby="p-FB-07-1-l" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40"><span class="fill" style="width:40%"></span></div><div class="foot"><span class="meta">8.0MB / 20MB</span><button type="button" class="btn" data-start>アップロードを開始</button></div></div>
<script>
(function(){document.querySelectorAll('.p-FB-07-1').forEach(function(r){var tr=r.querySelector('.track'),f=r.querySelector('.fill'),p=r.querySelector('.pct'),l=r.querySelector('.label'),m=r.querySelector('.meta'),b=r.querySelector('[data-start]'),id;function set(v){f.style.width=v+'%';p.textContent=v+'%';tr.setAttribute('aria-valuenow',v);m.textContent=(20*v/100).toFixed(1)+'MB / 20MB';}b.addEventListener('click',function(){clearInterval(id);var v=0;r.classList.remove('is-done');l.textContent='資料.zip をアップロード中';b.disabled=true;set(0);id=setInterval(function(){v=Math.min(100,v+4+Math.round(Math.random()*8));set(v);if(v>=100){clearInterval(id);r.classList.add('is-done');l.textContent='資料.zip のアップロード完了';b.disabled=false;b.textContent='もう一度';}},220);});});})();
</script>
