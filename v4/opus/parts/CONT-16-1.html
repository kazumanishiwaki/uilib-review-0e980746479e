-1) 0 0;font-size:var(--font-size-sm)}.p-CONT-16-1 .rp{margin-top:var(--space-1);padding:var(--space-1) 0;border:0;background:transparent;color:var(--color-text-muted);font-size:var(--font-size-xs);font-weight:var(--font-weight-bold);cursor:pointer;transition:color var(--duration-fast) var(--ease-standard)}.p-CONT-16-1 .rp:hover{color:var(--color-text-link)}.p-CONT-16-1 .fm{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:var(--space-2);padding-top:var(--space-4);border-top:var(--border-width-thin) solid var(--color-border)}.p-CONT-16-1 .rt{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin:0;padding:var(--space-1) var(--space-3);border-radius:var(--radius-sm);background:var(--color-brand-subtle);font-size:var(--font-size-xs);color:var(--color-brand)}.p-CONT-16-1 .rt[hidden]{display:none}.p-CONT-16-1 .cx{padding:0;border:0;background:transparent;color:var(--color-text-link);font-size:var(--font-size-xs);text-decoration:underline;cursor:pointer}.p-CONT-16-1 .ta{width:100%;min-height:var(--size-control-lg);padding:var(--space-2) var(--space-3);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-bg);font-size:var(--font-size-sm);line-height:var(--line-height-snug);resize:vertical}.p-CONT-16-1 .sb{min-height:var(--size-control-md);padding:0 var(--space-5);border:0;border-radius:var(--radius-md);background:var(--color-brand);color:var(--color-on-brand);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-CONT-16-1 .sb:hover{background:var(--color-brand-hover)}

<div class='p-CONT-16-1'><p class='hd'>コメント <span class='cn'>4</span>件</p><ol class='ls'><li class='cm'><span class='av' aria-hidden='true'>田</span><div class='bd'><p class='mt'><b class='nm'>田中</b><span class='no'>#1</span><time>2時間前</time></p><p class='tx'>写真がとても見やすいです。続きも楽しみにしています。</p><button type='button' class='rp' data-to='田中' data-no='1'>返信</button></div></li><li class='cm'><span class='av' aria-hidden='true'>鈴</span><div class='bd'><p class='mt'><b class='nm'>鈴木</b><span class='no'>#2</span><time>1時間前</time></p><p class='to'>@田中 さんへ（#1）</p><p class='tx'>同感です。2枚目の構図がいいですね。</p><button type='button' class='rp' data-to='鈴木' data-no='2'>返信</button></div></li><li class='cm au'><span class='av' aria-hidden='true'>筆</span><div class='bd'><p class='mt'><b class='nm'>小川</b><span class='bg'>著者</span><span class='no'>#3</span><time>45分前</time></p><blockquote class='qt'><span class='qn'>#1 田中</span>写真がとても見やすいです。</blockquote><p class='tx'>ありがとうございます。来週続きを書きます。</p><button type='button' class='rp' data-to='小川' data-no='3'>返信</button></div></li><li class='cm'><span class='av' aria-hidden='true'>中</span><div class='bd'><p class='mt'><b class='nm'>中村</b><span class='no'>#4</span><time>10分前</time></p><p class='tx'>撮影に使った機材も知りたいです。</p><button type='button' class='rp' data-to='中村' data-no='4'>返信</button></div></li></ol><form class='fm'><p class='rt' hidden><span class='rtt'></span><button type='button' class='cx'>取り消す</button></p><textarea class='ta' rows='2' placeholder='コメントを書く' aria-label='コメント'></textarea><button type='submit' class='sb'>投稿</button></form></div>
<script>
(function(){document.querySelectorAll('.p-CONT-16-1').forEach(function(r){var ls=r.querySelector('.ls'),fm=r.querySelector('.fm'),ta=r.querySelector('.ta'),rt=r.querySelector('.rt'),rtt=r.querySelector('.rtt'),cn=r.querySelector('.cn'),to=null;function clear(){to=null;rt.hidden=true}ls.addEventListener('click',function(e){var b=e.target.closest('.rp');if(!b)return;to={name:b.getAttribute('data-to'),no:b.getAttribute('data-no')};rtt.textContent='#'+to.no+' '+to.name+' さんへ返信';rt.hidden=false;ta.focus()});r.querySelector('.cx').addEventListener('click',function(){clear();ta.focus()});fm.addEventListener('submit',function(e){e.preventDefault();var v=ta.value.trim();if(!v){ta.focus();return}var n=ls.children.length+1,li=ls.querySelector('.cm').cloneNode(true),tx=li.querySelector('.tx'),b=li.querySelector('.rp');li.querySelector('.av').textContent='あ';li.querySelector('.nm').textContent='あなた';li.querySelector('.no').textContent='#'+n;li.querySelector('time').textContent='たった今';tx.textContent=v;b.setAttribute('data-to','あなた');b.setAttribute('data-no',n);if(to){var p=document.createElement('p');p.className='to';p.textContent='@'+to.name+' さんへ（#'+to.no+'）';tx.parentNode.insertBefore(p,tx)}ls.appendChild(li);cn.textContent=n;ta.value='';clear()})})})();
</script>
