<style>
.p-COM-03-3 .block{max-width:calc(var(--space-16) * 7);display:grid;gap:var(--space-2)}.p-COM-03-3 .name{margin:0;font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);line-height:var(--line-height-snug)}.p-COM-03-3 .price{margin:0;font-size:var(--font-size-xl);font-weight:var(--font-weight-bold);line-height:var(--line-height-snug);color:var(--color-text-muted)}.p-COM-03-3 .tax{margin-left:var(--space-1);font-size:var(--font-size-xs);font-weight:var(--font-weight-regular)}.p-COM-03-3 .stock{display:flex;align-items:center;gap:var(--space-2);margin:0;font-size:var(--font-size-sm);color:var(--color-text-muted)}.p-COM-03-3 .badge{padding:0 var(--space-2);border:var(--border-width-thin) solid var(--color-danger-border);border-radius:var(--radius-xs);background:var(--color-danger-subtle);color:var(--color-danger);font-size:var(--font-size-xs);font-weight:var(--font-weight-bold);line-height:var(--line-height-snug)}.p-COM-03-3 .notify{margin-top:var(--space-2);padding:var(--space-4);border-radius:var(--radius-md);background:var(--color-surface)}.p-COM-03-3 .lbl{display:block;margin-bottom:var(--space-2);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold)}.p-COM-03-3 .field{display:flex;flex-wrap:wrap;gap:var(--space-2)}.p-COM-03-3 .input{flex:1 1 calc(var(--space-16) * 3);min-height:var(--size-control-lg);padding:0 var(--space-3);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-bg)}.p-COM-03-3 .input[aria-invalid=true]{border-color:var(--color-danger)}.p-COM-03-3 .btn{flex:1 1 auto;min-height:var(--size-control-lg);padding:0 var(--space-5);border:0;border-radius:var(--radius-md);background:var(--color-brand);color:var(--color-on-brand);font-weight:var(--font-weight-medium);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-COM-03-3 .btn:hover{background:var(--color-brand-hover)}.p-COM-03-3 .msg{margin:var(--space-2) 0 0;font-size:var(--font-size-sm);line-height:var(--line-height-snug)}.p-COM-03-3 .msg:empty{display:none}.p-COM-03-3 .msg.is-err{color:var(--color-danger)}.p-COM-03-3 .msg.is-ok{padding:var(--space-3);border-radius:var(--radius-sm);background:var(--color-success-subtle);color:var(--color-success)}.p-COM-03-3 [hidden]{display:none !important}

<div class='p-COM-03-3'><section class='block' aria-labelledby='c0303-t'><h3 id='c0303-t' class='name'>ハンドドリップ用ケトル</h3><p class='price'>¥6,600<span class='tax'>税込</span></p><p class='stock'><span class='badge'>在庫切れ</span>入荷時期は未定です</p><form class='notify' novalidate><label for='c0303-mail' class='lbl'>再入荷をメールでお知らせします</label><div class='field'><input id='c0303-mail' type='email' class='input' autocomplete='email' placeholder='mail@example.jp' aria-describedby='c0303-msg' required><button type='submit' class='btn'>通知を受け取る</button></div><p id='c0303-msg' class='msg' aria-live='polite'></p></form></section></div>
<script>
(function(){var r=document.querySelector('.p-COM-03-3');if(!r)return;var f=r.querySelector('form'),i=f.querySelector('input'),m=r.querySelector('#c0303-msg'),fl=f.querySelector('.field');f.addEventListener('submit',function(e){e.preventDefault();var v=i.value.trim();if(!v||!i.checkValidity()){i.setAttribute('aria-invalid','true');m.className='msg is-err';m.textContent=v?'メールアドレスの形式を確認してください':'メールアドレスを入力してください';i.focus();return;}i.removeAttribute('aria-invalid');fl.hidden=true;m.className='msg is-ok';m.textContent='通知の登録を受け付けました。入荷したら '+v+' にお知らせします。';m.tabIndex=-1;m.focus();});})();
</script>
