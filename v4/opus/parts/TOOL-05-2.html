<style>

hover{background:var(--color-brand-hover)}.p-TOOL-05-2 .sr{position:absolute;width:var(--border-width-thin);height:var(--border-width-thin);overflow:hidden;clip-path:inset(50%);white-space:nowrap}

<div class='p-TOOL-05-2'><div class='bg'><div class='tr'><span class='pn'>位置</span><div class='lane'><span class='bar' aria-hidden='true'></span><button type='button' class='kf' data-i='0' style='left:10%' aria-pressed='false'></button><button type='button' class='kf' data-i='1' style='left:50%' aria-pressed='false'></button><button type='button' class='kf' data-i='2' style='left:90%' aria-pressed='false'></button></div></div><div class='act'><button type='button' class='btn ed' disabled>速度を数値で編集…</button><p class='info'>キーフレームを選んでください（ダブルクリックでも開きます）</p></div></div><div class='scrim' hidden></div><div class='dlg' role='dialog' aria-modal='true' aria-labelledby='t0502' hidden><h3 id='t0502' class='dt'>キーフレーム速度</h3><form class='fm' novalidate><fieldset><legend>入る速度</legend><label class='nf'><span>速度</span><input type='number' name='is' step='0.1'><span class='u'>px/秒</span></label><label class='nf'><span>影響</span><input type='number' name='ii' min='0.1' max='100' step='0.1'><span class='u'>%</span></label></fieldset><fieldset class='out'><legend>出る速度</legend><label class='nf'><span>速度</span><input type='number' name='os' step='0.1'><span class='u'>px/秒</span></label><label class='nf'><span>影響</span><input type='number' name='oi' min='0.1' max='100' step='0.1'><span class='u'>%</span></label></fieldset><label class='ck'><input type='checkbox' name='lk'>出る速度を入る速度に合わせる</label><p class='err' role='alert'></p><div class='btns'><button type='button' class='btn cn'>キャンセル</button><button type='submit' class='go'>OK</button></div></form></div><p class='sr' role='status' aria-live='polite'></p></div>
<script>
(function(){var r=document.querySelector('.p-TOOL-05-2');if(!r)return;var bg=r.querySelector('.bg'),kfs=r.querySelectorAll('.kf'),ed=r.querySelector('.ed'),info=r.querySelector('.info'),scrim=r.querySelector('.scrim'),dlg=r.querySelector('.dlg'),fm=r.querySelector('.fm'),err=r.querySelector('.err'),st=r.querySelector('.sr'),D=16.7,K=[{t:'0秒',is:0,ii:D,os:0,oi:D},{t:'1秒',is:120,ii:D,os:120,oi:D},{t:'2秒',is:0,ii:D,os:0,oi:D}],sel=-1;function ez(k){return k.ii!==D||k.oi!==D}function desc(k){return k.t+'：入 '+k.is+'px/秒・'+k.ii+'% ／ 出 '+k.os+'px/秒・'+k.oi+'%'}function paint(){kfs.forEach(function(b,i){var k=K[i];b.classList.toggle('ez',ez(k));b.setAttribute('aria-pressed',String(i===sel));b.setAttribute('aria-label','キーフレーム '+k.t+'（'+(ez(k)?'イーズ':'リニア')+'）')});ed.disabled=sel<0;info.textContent=sel<0?'キーフレームを選んでください（ダブルクリックでも開きます）':desc(K[sel])}function F(n){return fm.elements[n]}function link(){var on=F('lk').checked;fm.querySelector('.out').disabled=on;if(on){F('os').value=F('is').value;F('oi').value=F('ii').value}}function open(){var k=K[sel];F('is').value=k.is;F('ii').value=k.ii;F('os').value=k.os;F('oi').value=k.oi;F('lk').checked=false;link();err.textContent='';fm.querySelectorAll('input').forEach(function(i){i.removeAttribute('aria-invalid')});scrim.hidden=false;dlg.hidden=false;bg.inert=true;F('is').focus();F('is').select()}function close(){scrim.hidden=true;dlg.hidden=true;bg.inert=false;ed.focus()}kfs.forEach(function(b,i){b.addEventListener('click',function(){sel=sel===i?-1:i;paint()});b.addEventListener('dblclick',function(){sel=i;paint();open()})});ed.addEventListener('click',open);F('lk').addEventListener('change',link);fm.addEventListener('input',function(e){if(F('lk').checked&&(e.target.name==='is'||e.target.name==='ii'))link()});fm.addEventListener('submit',function(e){e.preventDefault();var bad=null;['is','os'].forEach(function(n){var v=F(n).value;var ok=v!==''&&isFinite(v);F(n).toggleAttribute('aria-invalid',!ok);if(!ok&&!bad)bad=[F(n),'速度は数値で入力してください']});['ii','oi'].forEach(function(n){var v=parseFloat(F(n).value),ok=v>=0.1&&v<=100;F(n).toggleAttribute('aria-invalid',!ok);if(!ok&&!bad)bad=[F(n),'影響は0.1〜100%の範囲で入力してください']});if(bad){err.textContent=bad[1];bad[0].focus();return}var k=K[sel];k.is=+F('is').value;k.ii=+F('ii').value;k.os=+F('os').value;k.oi=+F('oi').value;paint();close();st.textContent='「'+k.t+'」の速度を更新しました。'+(ez(k)?'イーズ':'リニア')+'になりました'});r.querySelector('.cn').addEventListener('click',close);scrim.addEventListener('click',close);dlg.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();close();return}if(e.key!=='Tab')return;var f=[].filter.call(dlg.querySelectorAll('input,button'),function(x){return!x.disabled});var a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){z.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===z){a.focus();e.preventDefault()}});paint()})();
</script>
