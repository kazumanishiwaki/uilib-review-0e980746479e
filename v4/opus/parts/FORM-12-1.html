<div class="p-FORM-12-1"><fieldset class="grp"><legend class="lg">生年月日<span class="req">必須</span></legend><div class="sels"><div class="s"><span class="sw"><select class="e" aria-label="元号"><option value="">元号</option><option value="R">令和</option><option value="H">平成</option><option value="S">昭和</option><option value="T">大正</option></select></span></div><div class="s"><span class="sw"><select class="y" aria-label="年" disabled><option value="">--</option></select></span><span class="u">年</span></div><div class="s"><span class="sw"><select class="m" aria-label="月"><option value="">--</option></select></span><span class="u">月</span></div><div class="s"><span class="sw"><select class="d" aria-label="日"><option value="">--</option></select></span><span class="u">日</span></div></div><p class="conv" aria-live="polite"><span class="ct">西暦</span><span class="cv">元号を選ぶと年を選べます</span></p></fieldset></div>
<script>
(function(){var E={R:[2019,8,'令和'],H:[1989,31,'平成'],S:[1926,64,'昭和'],T:[1912,15,'大正']};function fill(s,n,f){var k=s.value;s.length=1;for(var i=1;i<=n;i++)s.add(new Option(f?f(i):String(i),String(i)));if(k&&Number(k)<=n)s.value=k}document.querySelectorAll('.p-FORM-12-1').forEach(function(r){var e=r.querySelector('.e'),y=r.querySelector('.y'),m=r.querySelector('.m'),d=r.querySelector('.d'),cp=r.querySelector('.conv'),cv=r.querySelector('.cv');fill(m,12);fill(d,31);function upd(){var x=E[e.value];if(x){fill(y,x[1],function(i){return i===1?'元':String(i)});y.disabled=false}else{y.length=1;y.disabled=true}var yn=Number(y.value),mn=Number(m.value),Y=x&&yn?x[0]+yn-1:0;fill(d,new Date(Y||2000,mn||1,0).getDate());if(!x){cv.textContent='元号を選ぶと年を選べます';cp.className='conv';return}if(!yn){cv.textContent=x[2]+'の年を選んでください';cp.className='conv';return}var w='';if(e.value==='H'&&yn===31&&mn>4)w='平成31年5月1日からは令和元年です';else if(e.value==='R'&&yn===1&&mn&&mn<5)w='令和元年は5月1日からです';else if(e.value==='S'&&yn===64&&mn>1)w='昭和64年は1月7日までです';cv.textContent=w||(Y+'年'+(mn?mn+'月':'')+(d.value?d.value+'日':''));cp.className=w?'conv is-warn':'conv is-ok'};[e,y,m,d].forEach(function(s){s.addEventListener('change',upd)});upd()})})();
