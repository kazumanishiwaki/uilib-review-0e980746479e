<style>

ed='false'] .x{display:inline}.p-TOOL-02-1 .eye[aria-pressed='false']{color:var(--color-disabled-text)}.p-TOOL-02-1 .grp>.row .nm{font-weight:var(--font-weight-bold)}.p-TOOL-02-1 .it.off .nm{color:var(--color-disabled-text)}.p-TOOL-02-1 .cv{position:relative;flex:1 1 calc(var(--space-16)*3);aspect-ratio:4/3;border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);overflow:hidden}.p-TOOL-02-1 .ly{position:absolute}.p-TOOL-02-1 .cv [data-id='bg']{inset:0;background:var(--color-brand-subtle)}.p-TOOL-02-1 .cv [data-id='photo']{left:35%;top:30%;width:55%;height:55%;display:grid;place-items:center;border:var(--border-width-thin) solid var(--color-info-border);border-radius:var(--radius-sm);background:var(--color-info-subtle)}.p-TOOL-02-1 .cv [data-id='photo'] svg{width:50%;height:50%;fill:var(--color-info);stroke:none}.p-TOOL-02-1 .cv [data-id='head']{inset:0}.p-TOOL-02-1 .cv [data-id='title']{left:8%;top:16%;padding:var(--space-1) var(--space-3);border-radius:var(--radius-sm);background:var(--color-brand);color:var(--color-on-brand);font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);white-space:nowrap}.p-TOOL-02-1 .cv [data-id='line']{left:8%;top:calc(16% + var(--space-12));width:45%;height:var(--space-1);border-radius:var(--radius-full);background:var(--color-warning)}.p-TOOL-02-1 .sr{position:absolute;width:var(--border-width-thin);height:var(--border-width-thin);overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
<div class='p-TOOL-02-1'><div class='panel'><p class='hdr'>レイヤー<span class='hint'>上ほど前面</span></p><ul class='tree' aria-label='レイヤー'><li class='it grp' data-id='head' data-name='見出し'><div class='row'><button type='button' class='hd' aria-label='見出しを移動（↑↓キー）'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01'/></svg></button><button type='button' class='eye' aria-pressed='true' aria-label='見出しを表示'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z'/><circle cx='12' cy='12' r='3'/><path class='x' d='M4 4l16 16'/></svg></button><button type='button' class='tw' aria-expanded='true' aria-label='見出しの中身'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M9 6l6 6-6 6'/></svg></button><span class='nm'>見出し</span></div><ul class='kids'><li class='it' data-id='title' data-name='タイトル'><div class='row'><button type='button' class='hd' aria-label='タイトルを移動（↑↓キー）'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01'/></svg></button><button type='button' class='eye' aria-pressed='true' aria-label='タイトルを表示'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z'/><circle cx='12' cy='12' r='3'/><path class='x' d='M4 4l16 16'/></svg></button><span class='sp'></span><span class='nm'>タイトル</span></div></li><li class='it' data-id='line' data-name='下線'><div class='row'><button type='button' class='hd' aria-label='下線を移動（↑↓キー）'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01'/></svg></button><button type='button' class='eye' aria-pressed='true' aria-label='下線を表示'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z'/><circle cx='12' cy='12' r='3'/><path class='x' d='M4 4l16 16'/></svg></button><span class='sp'></span><span class='nm'>下線</span></div></li></ul></li><li class='it' data-i <script>
(function(){var r=document.querySelector('.p-TOOL-02-1');if(!r)return;var tree=r.querySelector('.tree'),cv=r.querySelector('.cv'),st=r.querySelector('.sr'),drag=null;function sync(){[tree].concat([].slice.call(r.querySelectorAll('.kids'))).forEach(function(ul){var it=[].slice.call(ul.children);it.forEach(function(li,i){var l=cv.querySelector('[data-id='+li.dataset.id+']');l.style.zIndex=it.length-i;l.style.visibility=li.classList.contains('off')?'hidden':''})})}function told(li){st.textContent=li.dataset.name+'を'+([].indexOf.call(li.parentNode.children,li)+1)+'番目に移動しました（上ほど前面）'}r.querySelectorAll('.eye').forEach(function(b){b.addEventListener('click',function(){var li=b.closest('.it'),on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));li.classList.toggle('off',!on);sync();st.textContent=li.dataset.name+(on?'を表示しました':'を非表示にしました')})});r.querySelectorAll('.tw').forEach(function(b){b.addEventListener('click',function(){var on=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(on));b.closest('.it').querySelector('.kids').hidden=!on})});function mv(e){if(!drag)return;var li=drag.li,ref=null;[].some.call(drag.ul.children,function(s){if(s===li)return false;var b=s.querySelector('.row').getBoundingClientRect();if(e.clientY<b.top+b.height/2){ref=s;return true}return false});if(ref){if(li.nextElementSibling!==ref)drag.ul.insertBefore(li,ref)}else if(drag.ul.lastElementChild!==li)drag.ul.appendChild(li);sync()}function end(){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cc);var d=drag;drag=null;d.li.classList.remove('drag');return d}function up(){var d=end();if(d.li.nextElementSibling!==d.nx)told(d.li)}function cc(){var d=end();d.ul.insertBefore(d.li,d.nx);sync();st.textContent='並べ替えを取り消しました'}r.querySelectorAll('.hd').forEach(function(h){h.addEventListener('keydown',function(e){var li=h.closest('.it'),ul=li.parentNode;if(e.key==='ArrowUp'&&li.previousElementSibling)ul.insertBefore(li.previousElementSibling,li.nextElementSibling);else if(e.key==='ArrowDown'&&li.nextElementSibling)ul.insertBefore(li.nextElementSibling,li);else return;e.preventDefault();h.focus();sync();told(li)});h.addEventListener('pointerdown',function(e){if(e.button!==0||drag)return;e.preventDefault();var li=h.closest('.it');drag={li:li,ul:li.parentNode,nx:li.nextElementSibling};li.classList.add('drag');window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cc)})});sync()})();
</script>
