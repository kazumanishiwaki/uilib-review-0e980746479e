<script>
(function(){document.querySelectorAll('.p-MEDIA-03-1').forEach(function(r){var caps=['店の外観','店内の様子','季節のケーキ','窓辺の席','焼き菓子','入口の看板'],n=caps.length,i=0,last=null,sx=null,lb=r.querySelector('.lb'),big=r.querySelector('.big'),cnt=r.querySelector('.count'),cap=r.querySelector('.cap'),st=r.querySelector('.stage'),cl=r.querySelector('.close');function show(k){i=(k+n)%n;big.className='big ph ph-'+(i+1);void big.offsetWidth;big.classList.add('anim');cnt.textContent=(i+1)+' / '+n;cap.textContent=caps[i]}function open(k,btn){last=btn;lb.hidden=false;show(k);cl.focus()}function close(){lb.hidden=true;if(last)last.focus()}r.querySelectorAll('.th').forEach(function(t){t.addEventListener('click',function(){open(+t.dataset.i,t)})});cl.addEventListener('click',close);r.querySelector('.prev').addEventListener('click',function(){show(i-1)});r.querySelector('.next').addEventListener('click',function(){show(i+1)});lb.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'){show(i-1);e.preventDefault()}else if(e.key==='ArrowRight'){show(i+1);e.preventDefault()}else if(e.key==='Escape'){close();e.preventDefault()}else if(e.key==='Tab'){var fs=lb.querySelectorAll('button'),a=fs[0],z=fs[fs.length-1];if(e.shiftKey&&document.activeElement===a){z.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===z){a.focus();e.preventDefault()}}});st.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;sx=e.clientX});st.addEventListener('pointerup',function(e){if(sx===null)return;var dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40)show(dx<0?i+1:i-1)})})})();
