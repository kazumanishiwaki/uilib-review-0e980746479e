<style>

<script>
(function(){document.querySelectorAll('.p-NAV-06-1').forEach(function(r){var t=+r.dataset.total,c=+r.dataset.current,l=r.querySelector('.list'),pv=r.querySelector('.prev'),nx=r.querySelector('.next'),st=r.querySelector('[aria-live]');function seq(){var s=[1],a=Math.max(2,c-1),b=Math.min(t-1,c+1);if(c<=3){a=2;b=4}if(c>=t-2){a=t-3;b=t-1}if(a>2)s.push(0);for(var i=a;i<=b;i++)s.push(i);if(b<t-1)s.push(0);s.push(t);return s}function render(){l.innerHTML='';seq().forEach(function(n){var li=document.createElement('li');if(n===0){li.className='gap';li.setAttribute('aria-hidden','true');li.textContent='…'}else{var b=document.createElement('button');b.type='button';b.className='num';b.textContent=n;b.setAttribute('aria-label',n+'ページ');b.dataset.p=n;if(n===c)b.setAttribute('aria-current','page');li.appendChild(b)}l.appendChild(li)});pv.disabled=c===1;nx.disabled=c===t}function go(n,keep){if(n<1||n>t||n===c)return;c=n;render();st.textContent=t+'ページ中 '+c+'ページ目';if(!keep||keep.disabled)l.querySelector('[aria-current]').focus()}l.addEventListener('click',function(e){var b=e.target.closest('.num');if(b)go(+b.dataset.p)});pv.addEventListener('click',function(){go(c-1,pv)});nx.addEventListener('click',function(){go(c+1,nx)});render()})})();
