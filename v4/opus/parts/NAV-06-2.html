<style>

<nav class='p-NAV-06-2' aria-label='連載の前後'><p class='count' aria-live='polite'>全3回中 2回目：固定費を見直す</p><div class='blocks'><a href='#0' class='blk prev'><span class='dir'><svg viewBox='0 0 24 24' aria-hidden='true' focusable='false'><path d='M15 6l-6 6 6 6'/></svg>前の回</span><span class='ttl'>第1回 家計簿をはじめる</span></a><a href='#0' class='blk next'><span class='dir'>次の回<svg viewBox='0 0 24 24' aria-hidden='true' focusable='false'><path d='M9 6l6 6-6 6'/></svg></span><span class='ttl'>第3回 貯める仕組みを作る</span></a></div></nav>
<script>
(function(){var T=['家計簿をはじめる','固定費を見直す','貯める仕組みを作る'];document.querySelectorAll('.p-NAV-06-2').forEach(function(r){var i=1,c=r.querySelector('.count'),pv=r.querySelector('.prev'),nx=r.querySelector('.next'),pt=pv.querySelector('.ttl'),nt=nx.querySelector('.ttl');function render(){c.textContent='全'+T.length+'回中 '+(i+1)+'回目：'+T[i];pv.hidden=i===0;nx.hidden=i===T.length-1;if(i>0)pt.textContent='第'+i+'回 '+T[i-1];if(i<T.length-1)nt.textContent='第'+(i+2)+'回 '+T[i+1]}pv.addEventListener('click',function(e){e.preventDefault();if(i===0)return;i--;render();(pv.hidden?nx:pv).focus()});nx.addEventListener('click',function(e){e.preventDefault();if(i===T.length-1)return;i++;render();(nx.hidden?pv:nx).focus()});render()})})();
</script>
