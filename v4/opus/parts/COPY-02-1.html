<!-- COPY-02-1 -->
<style>
.p-COPY-02-1{font-family:var(--font-sans);font-size:var(--font-size-md);line-height:var(--line-height-normal);letter-spacing:var(--letter-spacing-normal);color:var(--color-text);display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2);padding:var(--space-6);background:var(--color-bg);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-lg)}.p-COPY-02-1 p{margin:0}.p-COPY-02-1 .lbl{font-size:var(--font-size-sm);font-weight:var(--font-weight-bold)}.p-COPY-02-1 .in{width:100%;min-height:var(--size-control-md);padding:0 var(--space-3);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-bg);transition:border-color var(--duration-fast) var(--ease-standard)}.p-COPY-02-1 .in[aria-invalid=true]{border:var(--border-width-medium) solid var(--color-danger);background:var(--color-danger-subtle)}.p-COPY-02-1 .err{display:flex;align-items:center;gap:var(--space-1);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);color:var(--color-danger)}.p-COPY-02-1 .err[hidden],.p-COPY-02-1 .ok[hidden]{display:none}.p-COPY-02-1 .ic{flex:none;width:var(--size-icon-sm);height:var(--size-icon-sm)}.p-COPY-02-1 .ic circle{fill:currentColor}.p-COPY-02-1 .ic path{fill:none;stroke:var(--color-on-status);stroke-width:2;stroke-linecap:round}.p-COPY-02-1 .btn{min-height:var(--size-control-md);margin-top:var(--space-2);padding:0 var(--space-5);border:var(--border-width-thin) solid var(--color-brand);border-radius:var(--radius-md);background:var(--color-brand);color:var(--color-on-brand);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-COPY-02-1 .btn:hover{background:var(--color-brand-hover)}.p-COPY-02-1 .btn:active{background:var(--color-brand-active)}.p-COPY-02-1 .ok{font-size:var(--font-size-sm);color:var(--color-success)}
</style>
<form class="p-COPY-02-1" novalidate><label class="lbl" for="p-COPY-02-1-mail">メールアドレス</label><input id="p-COPY-02-1-mail" class="in" type="email" autocomplete="off" aria-invalid="true" aria-describedby="p-COPY-02-1-err"><p id="p-COPY-02-1-err" class="err"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9"/><path d="M10 5.5v5.5M10 14v.5"/></svg>メールアドレスを入力してください</p><button class="btn" type="submit">次へ</button><p class="ok" role="status" hidden>入力を受け付けました</p></form>
<script>
(function(){document.querySelectorAll('.p-COPY-02-1').forEach(function(f){var i=f.querySelector('.in'),e=f.querySelector('.err'),ok=f.querySelector('.ok');function set(bad){e.hidden=!bad;i.setAttribute('aria-invalid',bad?'true':'false');}i.addEventListener('input',function(){if(i.value.trim())set(false);ok.hidden=true;});f.addEventListener('submit',function(ev){ev.preventDefault();var bad=!i.value.trim();set(bad);ok.hidden=bad;if(bad)i.focus();});});})();
</script>
