<div class="p-FORM-08-2"><p class="ttl">アカウントを選択</p><p class="lead">続けて使うアカウントを選んでください</p><div class="list"><label class="acct"><input type="radio" name="f082" checked><span class="av t1" aria-hidden="true">山</span><span class="info"><span class="nm">山田 太郎</span><span class="em">taro@example.jp</span></span><span class="tag">前回使用</span><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 12l4 4 8-9"/></svg></span></label><label class="acct"><input type="radio" name="f082"><span class="av t2" aria-hidden="true">山</span><span class="info"><span class="nm">山田 太郎</span><span class="em">t.yamada@sample.co.jp</span></span><span class="tag">勤務先</span><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 12l4 4 8-9"/></svg></span></label><label class="acct" data-out="1"><input type="radio" name="f082"><span class="av t3" aria-hidden="true">佐</span><span class="info"><span class="nm">佐藤 花子</span><span class="em">hanako@example.jp</span></span><span class="tag">ログアウト中</span><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 12l4 4 8-9"/></svg></span></label><button type="button" class="add"><span class="av av-add" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>別のアカウントを使う</button></div><button type="button" class="go">taro@example.jp で続行</button><p class="status" aria-live="polite"></p></div>
