justify-items:center}.p-PRINT-06-2 .bleed{padding:var(--space-2);background:var(--color-warning-subtle)}.p-PRINT-06-2 .trim{display:grid;align-content:start;gap:var(--space-2);width:calc(var(--space-16)*1.5);aspect-ratio:1/1.414;padding:var(--space-3);background:var(--color-bg);outline:var(--border-width-thin) dashed transparent;transition:outline-color var(--duration-fast) var(--ease-standard)}.p-PRINT-06-2 .pg[data-trim='on'] .trim{outline-color:var(--color-danger)}.p-PRINT-06-2 .trim .hd{height:var(--space-3);margin-top:calc(var(--space-4)*-1);border-radius:var(--radius-xs);background:var(--color-brand)}.p-PRINT-06-2 .trim .ln{height:var(--space-1);border-radius:var(--radius-xs);background:var(--color-border-strong)}.p-PRINT-06-2 .trim .ln:last-child{width:60%}.p-PRINT-06-2 figcaption{font-size:var(--font-size-xs);color:var(--color-text-muted)}.p-PRINT-06-2 .ck{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-sm)}.p-PRINT-06-2 .ck input{margin:0;accent-color:var(--color-brand)}.p-PRINT-06-2 .cf{font-weight:var(--font-weight-medium)}.p-PRINT-06-2 .st{margin:0;font-size:var(--font-size-sm)}.p-PRINT-06-2 .st:empty{display:none}

<div class='p-PRINT-06-2'><ol class='steps'><li data-s='1' aria-current='step'>ファイル選択</li><li data-s='2'>チェック</li><li data-s='3'>プレビュー確認</li></ol><section class='pane p1'><p class='lead'>このパソコンの中でチェックします。ファイルは送信されません。</p><div class='pick'><label class='fb'><input type='file' class='fi' accept='.pdf,application/pdf'><span>PDFを選ぶ</span></label><button type='button' class='btn smp'>見本ファイルで試す</button></div><p class='fname'></p><div class='bar' aria-hidden='true'><i></i></div><button type='button' class='go run' disabled>チェックを始める</button></section><section class='pane p2' hidden><ul class='res' tabindex='-1' aria-label='チェック結果'></ul><div class='pvw'><figure class='pg' data-trim='on'><div class='bleed'><div class='trim'><span class='hd'></span><span class='ln'></span><span class='ln'></span></div></div><figcaption>プレビュー（外側の色帯が塗り足し）</figcaption></figure><label class='ck'><input type='checkbox' class='tg' checked>仕上がり線を表示</label></div><label class='ck cf'><input type='checkbox' class='ok'>プレビューで仕上がりを確認しました</label><div class='acts'><button type='button' class='btn back'>選び直す</button><button type='button' class='go send' disabled>入稿へ進む</button></div></section><p class='st' role='status' aria-live='polite'></p></div>
<script>
(function(){var r=document.querySelector('.p-PRINT-06-2');if(!r)return;var fi=r.querySelector('.fi'),run=r.querySelector('.run'),fname=r.querySelector('.fname'),bar=r.querySelector('.bar'),p1=r.querySelector('.p1'),p2=r.querySelector('.p2'),res=r.querySelector('.res'),ok=r.querySelector('.ok'),send=r.querySelector('.send'),pg=r.querySelector('.pg'),st=r.querySelector('.st'),steps=r.querySelectorAll('.steps li'),src=null,err=false;var L={ok:'問題なし',w:'注意',e:'エラー',i:'目で確認'};function step(n){steps.forEach(function(li){var s=+li.dataset.s;if(s===n)li.setAttribute('aria-current','step');else li.removeAttribute('aria-current');li.classList.toggle('done',s<n)})}function add(a){var li=document.createElement('li');li.className=a[0];['lv','nm','ms'].forEach(function(c,i){var s=document.createElement('span');s.className=c;s.textContent=i?a[i]:L[a[0]];li.appendChild(s)});res.appendChild(li)}function check(){if(src==='sample')return Promise.resolve([['ok','ファイル形式','PDF'],['ok','容量','2.4MB'],['w','塗り足し','上辺が2mm。プレビューで確認'],['i','文字・色','自動では確認しません']]);return src.slice(0,5).text().then(function(h){var mb=src.size/1048576;return[h==='%PDF-'?['ok','ファイル形式','PDF']:['e','ファイル形式','PDFではありません'],mb<=100?['ok','容量',mb.toFixed(1)+'MB']:['e','容量',mb.toFixed(1)+'MB（上限100MB）'],['i','塗り足し・文字','プレビューで確認']]})}fi.addEventListener('change',function(){var f=fi.files[0];if(!f)return;src=f;fname.textContent='選択中: '+f.name;run.disabled=false;st.textContent=''});r.querySelector('.smp').addEventListener('click',function(){src='sample';fi.value='';fname.textContent='選択中: 見本_チラシ.pdf';run.disabled=false;st.textContent=''});run.addEventListener('click',function(){run.disabled=true;step(2);p1.setAttribute('aria-busy','true');st.textContent='チェックしています';bar.classList.remove('on');void bar.offsetWidth;bar.classList.add('on');check().then(function(a){setTimeout(function(){res.textContent='';err=a.some(function(x){return x[0]==='e'});a.forEach(add);p1.removeAttribute('aria-busy');bar.classList.remove('on');p1.hidden=true;p2.hidden=false;ok.checked=false;ok.disabled=err;send.disabled=true;step(3);res.focus();st.textContent=err?'エラーがあります。修正したファイルを選び直してください':'チェックが終わりました。プレビューを確認してください'},400)}).catch(function(){p1.removeAttribute('aria-busy');bar.classList.remove('on');run.disabled=false;step(1);st.textContent='ファイルを読み込めませんでした'})});ok.addEventListener('change',function(){send.disabled=!ok.checked||err});r.querySelector('.tg').addEventListener('change',function(e){pg.dataset.trim=e.target.checked?'on':'off'});r.querySelector('.back').addEventListener('click',function(){p2.hidden=true;p1.hidden=false;run.disabled=!src;step(1);st.textContent='';run.disabled?fi.focus():run.focus()});send.addEventListener('click',function(){send.disabled=true;st.textContent='チェック済みのデータで入稿の準備ができました'})})();
</script>
