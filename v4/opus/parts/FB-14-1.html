<div class="p-FB-14-1" data-step="ask"><div class="ask"><p class="q" id="p-FB-14-1-q">このページは役に立ちましたか？</p><div class="choices" role="group" aria-labelledby="p-FB-14-1-q"><button type="button" class="btn" data-yes>はい</button><button type="button" class="btn" data-no aria-expanded="false" aria-controls="p-FB-14-1-form">いいえ</button></div></div><div class="expand"><form class="form" id="p-FB-14-1-form"><div class="inner"><label class="lbl" for="p-FB-14-1-ta">わかりにくかった点を教えてください（任意）</label><textarea id="p-FB-14-1-ta" class="ta" rows="3" placeholder="例：手順3の画面が見つからない"></textarea><p class="note">個人情報は書かないでください</p><div class="fa"><button type="submit" class="btn btn--primary">送信</button><button type="button" class="btn btn--ghost" data-cancel>キャンセル</button></div></div></form></div><div class="done"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 10"/></svg><span class="dt" role="status" aria-live="polite"></span></div></div>
<script>
(function(){document.querySelectorAll('.p-FB-14-1').forEach(function(r){var no=r.querySelector('[data-no]'),ta=r.querySelector('.ta'),dt=r.querySelector('.dt');function step(s){r.setAttribute('data-step',s);var re=s==='reason';no.classList.toggle('is-selected',re);no.setAttribute('aria-expanded',re?'true':'false');}r.querySelector('[data-yes]').addEventListener('click',function(){step('done');dt.textContent='ご協力ありがとうございました';});no.addEventListener('click',function(){if(r.getAttribute('data-step')==='reason'){step('ask');return;}step('reason');setTimeout(function(){ta.focus();},0);});r.querySelector('[data-cancel]').addEventListener('click',function(){step('ask');no.focus();});r.querySelector('.form').addEventListener('submit',function(e){e.preventDefault();step('done');dt.textContent='送信しました。改善に役立てます';});});})();
