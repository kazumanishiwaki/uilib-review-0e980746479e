<style>

<div class='p-CONT-01-5'><div class='frame'><div class='head'><span class='hint'>枠の中をスクロール</span><span class='count' aria-live='polite'>CARD <span class='cur'>1</span>/3</span></div><div class='stage' tabindex='0' role='region' aria-label='導入の流れ'><article class='card'><span class='step'>STEP 1</span><h3 class='ttl'>課題をうかがう</h3><p class='txt'>担当者が現在の運用と困りごとを整理します。</p></article><article class='card'><span class='step'>STEP 2</span><h3 class='ttl'>試験導入</h3><p class='txt'>1部署で2週間、実際の業務で使ってみます。</p></article><article class='card'><span class='step'>STEP 3</span><h3 class='ttl'>全社に展開</h3><p class='txt'>研修と移行作業まで、まとめて支援します。</p></article><div class='tail' aria-hidden='true'></div></div></div></div>
<script>
(function(){document.querySelectorAll('.p-CONT-01-5').forEach(function(root){if(root.dataset.ready){return;}root.dataset.ready='1';var stage=root.querySelector('.stage');var cards=Array.prototype.slice.call(stage.querySelectorAll('.card'));var cur=root.querySelector('.cur');function update(){var step=cards[0].offsetHeight+(parseFloat(getComputedStyle(cards[0]).marginBottom)||0);if(!step){return;}var idx=Math.min(cards.length-1,Math.floor((stage.scrollTop+stage.clientHeight*0.5)/step));cur.textContent=String(idx+1);cards.forEach(function(c,i){c.classList.toggle('is-under',i<idx);});}stage.addEventListener('scroll',update,{passive:true});update();});})();
