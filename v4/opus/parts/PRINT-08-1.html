<!-- PRINT-08-1 -->
<style>
.p-PRINT-08-1{display:flex;flex-wrap:wrap;gap:var(--space-5);align-items:flex-start}.p-PRINT-08-1 .cfg{flex:1 1 calc(var(--space-16)*3);display:grid;gap:var(--space-3)}.p-PRINT-08-1 .f{display:grid;gap:var(--space-1);font-size:var(--font-size-sm);color:var(--color-text-muted)}.p-PRINT-08-1 select,.p-PRINT-08-1 input{min-height:var(--size-control-md);padding:0 var(--space-2);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-bg);color:var(--color-text)}.p-PRINT-08-1 .res{flex:1 1 calc(var(--space-16)*3.5);display:grid;gap:var(--space-3)}.p-PRINT-08-1 .calc{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-2);margin:0}.p-PRINT-08-1 .calc div{padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);background:var(--color-surface)}.p-PRINT-08-1 .calc .main{grid-column:1/-1;background:var(--color-brand-subtle)}.p-PRINT-08-1 dt{font-size:var(--font-size-xs);color:var(--color-text-muted)}.p-PRINT-08-1 dd{margin:0;font-family:var(--font-mono);font-weight:var(--font-weight-bold);letter-spacing:var(--letter-spacing-tight)}.p-PRINT-08-1 .main dd{font-size:var(--font-size-3xl);line-height:var(--line-height-tight);color:var(--color-brand)}.p-PRINT-08-1 .why{margin:0;font-size:var(--font-size-sm);color:var(--color-text-muted)}.p-PRINT-08-1 .qr{margin:0;display:grid;gap:var(--space-1);justify-items:start}.p-PRINT-08-1 .qr svg{display:block;width:calc(var(--space-16)*var(--k,1));height:auto;border:var(--border-width-thin) solid var(--color-border);transition:width var(--duration-normal) var(--ease-standard)}.p-PRINT-08-1 .qr .bg{fill:var(--color-bg)}.p-PRINT-08-1 .qr .dk{fill:var(--color-text)}.p-PRINT-08-1 figcaption{font-size:var(--font-size-xs);color:var(--color-text-muted)}
</style>
<div class='p-PRINT-08-1'><div class='cfg'><label class='f'><span>読み取る機器</span><select class='dev'><option value='0.33'>スマホのカメラ</option><option value='0.25'>業務用ハンディ</option><option value='0.17'>固定式スキャナ</option></select></label><label class='f'><span>読み取る距離</span><select class='dist'><option value='10'>10cm（手元）</option><option value='30' selected>30cm（卓上・掲示）</option><option value='100'>1m（ポスター）</option></select></label><label class='f'><span>載せる内容</span><input type='text' class='tx' value='https://example.jp/menu'></label></div><div class='res'><dl class='calc'><div class='main'><dt>1マスの大きさ</dt><dd class='mod'></dd></div><div><dt>マスの数</dt><dd class='ver'></dd></div><div><dt>余白込みの一辺</dt><dd class='tot'></dd></div></dl><p class='why' aria-live='polite'></p><figure class='qr'><svg viewBox='0 0 33 33' aria-hidden='true'><rect class='bg' width='100%' height='100%'/><path class='dk'/></svg><figcaption>見本（表示の大きさは比率の目安）</figcaption></figure></div></div>
<script>
(function(){var r=document.querySelector('.p-PRINT-08-1');if(!r)return;var dev=r.querySelector('.dev'),dist=r.querySelector('.dist'),tx=r.querySelector('.tx'),svg=r.querySelector('.qr svg'),dk=r.querySelector('.dk');function qr(s,n){var h=2166136261,i,x,y,d='';for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}function rnd(){h^=h<<13;h^=h>>>17;h^=h<<5;return(h>>>0)/4294967296}function fd(a,b){return a===0||a===6||b===0||b===6||(a>1&&a<5&&b>1&&b<5)}for(y=0;y<n;y++)for(x=0;x<n;x++){var on;if((x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8)){var a=x<8?x:x-(n-7),b=y<8?y:y-(n-7);on=a>=0&&a<7&&b>=0&&b<7&&fd(a,b)}else if(x===6||y===6)on=(x+y)%2===0;else on=rnd()<0.5;if(on)d+='M'+(x+4)+' '+(y+4)+'h1v1h-1z'}return d}function calc(){var len=tx.value.length,n=len<=17?21:len<=32?25:len<=53?29:33,mn=+dev.value,cm=+dist.value,need=cm/(n+8),m=Math.ceil(Math.max(mn,need)*100)/100,t=Math.round(m*(n+8)*10)/10,name=dev.options[dev.selectedIndex].text;r.querySelector('.mod').textContent=m.toFixed(2)+'mm';r.querySelector('.ver').textContent=n+'×'+n;r.querySelector('.tot').textContent=t+'mm';r.querySelector('.why').textContent=need>mn?name+'の下限は'+mn+'mmですが、'+cm+'cm離れて読むため'+m.toFixed(2)+'mmに広げています':name+'が読める下限の'+mn+'mmで決まります（距離'+cm+'cmでは十分です）';svg.setAttribute('viewBox','0 0 '+(n+8)+' '+(n+8));dk.setAttribute('d',qr(tx.value||' ',n));svg.style.setProperty('--k',Math.max(1,Math.min(3,t/15)).toFixed(2))}r.addEventListener('input',calc);r.addEventListener('change',calc);calc()})();
</script>
