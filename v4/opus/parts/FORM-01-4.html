<!-- FORM-01-4 -->
<style>
.p-FORM-01-4{display:grid;gap:var(--space-4);max-width:calc(var(--space-16) * 6);font-family:var(--font-sans);color:var(--color-text);font-size:var(--font-size-md);line-height:var(--line-height-normal);letter-spacing:var(--letter-spacing-normal)}.p-FORM-01-4 .field{display:grid;gap:var(--space-2)}.p-FORM-01-4 .label{font-size:var(--font-size-sm);font-weight:var(--font-weight-bold);line-height:var(--line-height-snug)}.p-FORM-01-4 .group{display:flex;align-items:stretch;height:var(--size-control-md);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-bg);overflow:hidden;transition:border-color var(--duration-fast) var(--ease-standard),box-shadow var(--duration-fast) var(--ease-standard)}.p-FORM-01-4 .group:hover{border-color:var(--color-text-muted)}.p-FORM-01-4 .group:focus-within{border-color:var(--color-brand);box-shadow:var(--focus-ring)}.p-FORM-01-4 .group input{flex:1 1 auto;min-width:0;height:100%;padding:0 var(--space-3);border:0;background:transparent;color:var(--color-text);font-size:var(--font-size-md)}.p-FORM-01-4 .group input:focus-visible{box-shadow:var(--shadow-none)}.p-FORM-01-4 .group input.num{text-align:right;font-variant-numeric:tabular-nums}.p-FORM-01-4 .addon{display:flex;align-items:center;flex:none;padding:0 var(--space-3);background:var(--color-surface-strong);color:var(--color-text-muted);font-size:var(--font-size-sm);white-space:nowrap}.p-FORM-01-4 .addon:first-child{border-right:var(--border-width-thin) solid var(--color-border)}.p-FORM-01-4 .addon:last-child{border-left:var(--border-width-thin) solid var(--color-border)}.p-FORM-01-4 .btn{flex:none;padding:0 var(--space-4);border:0;border-left:var(--border-width-thin) solid var(--color-border-strong);background:var(--color-surface-strong);color:var(--color-text);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);white-space:nowrap;cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-FORM-01-4 .btn:hover{background:var(--color-border)}.p-FORM-01-4 .btn:focus-visible{box-shadow:inset 0 0 0 var(--focus-ring-width) var(--color-focus)}.p-FORM-01-4 .out{margin:0;min-height:calc(var(--font-size-xs) * var(--line-height-snug));font-size:var(--font-size-xs);line-height:var(--line-height-snug);color:var(--color-text-muted)}
</style>
<div class="p-FORM-01-4"><div class="field"><label class="label" for="f014-yen">予算の上限</label><div class="group"><span class="addon" aria-hidden="true">¥</span><input id="f014-yen" class="num" type="text" inputmode="numeric" value="50,000" aria-describedby="f014-yen-u"><span class="addon" id="f014-yen-u">円まで</span></div></div><div class="field"><label class="label" for="f014-zip">郵便番号</label><div class="group"><span class="addon" aria-hidden="true">〒</span><input id="f014-zip" type="text" inputmode="numeric" placeholder="100-0001" autocomplete="postal-code"><button type="button" class="btn" data-act="zip">住所を検索</button></div><p class="out" aria-live="polite"></p></div><div class="field"><label class="label" for="f014-url">公開URL</label><div class="group"><span class="addon">https://</span><input id="f014-url" type="text" value="example.jp/shop"><button type="button" class="btn" data-act="copy">コピー</button></div><p class="out" aria-live="polite"></p></div></div>
<script>
(function(){document.querySelectorAll('.p-FORM-01-4').forEach(function(root){root.querySelectorAll('.btn').forEach(function(b){b.addEventListener('click',function(){var f=b.closest('.field'),out=f.querySelector('.out'),inp=f.querySelector('input');if(b.dataset.act==='zip'){out.textContent=inp.value.trim()?'東京都千代田区千代田 が見つかりました':'郵便番号を入力してください';}else{out.textContent='https://'+inp.value.trim()+' をコピーしました';}});});});})();
</script>
