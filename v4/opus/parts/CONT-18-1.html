<div class="p-CONT-18-1"><article class="post"><header class="head"><span class="av" aria-hidden="true">山</span><div><p class="name">山田 花子</p><p class="time">2時間前</p></div></header><p class="text">次の勉強会、どの曜日が参加しやすいですか？</p><div class="poll" role="group" aria-label="投票"><ul class="opts"><li><button type="button" class="opt" data-pct="46"><span class="bar" aria-hidden="true"></span><span class="lbl">火曜日の夜</span><span class="pct">46%</span></button></li><li><button type="button" class="opt" data-pct="31"><span class="bar" aria-hidden="true"></span><span class="lbl">水曜日の夜</span><span class="pct">31%</span></button></li><li><button type="button" class="opt" data-pct="18"><span class="bar" aria-hidden="true"></span><span class="lbl">土曜日の午前</span><span class="pct">18%</span></button></li><li><button type="button" class="opt" data-pct="5"><span class="bar" aria-hidden="true"></span><span class="lbl">日曜日の午後</span><span class="pct">5%</span></button></li></ul><p class="meta" aria-live="polite"><span class="votes">128</span>票 ・ <span class="dl">残り2日</span></p></div><div class="foot"><button type="button" class="sim">締め切り後の表示にする</button></div></article></div>
<script>
(function(){document.querySelectorAll('.p-CONT-18-1').forEach(function(root){var poll=root.querySelector('.poll'),opts=[].slice.call(root.querySelectorAll('.opt')),votes=root.querySelector('.votes'),dl=root.querySelector('.dl'),sim=root.querySelector('.sim');function show(){if(poll.classList.contains('is-result'))return;poll.classList.add('is-result');opts.forEach(function(o){o.tabIndex=-1;o.querySelector('.bar').style.width=o.getAttribute('data-pct')+'%';});}opts.forEach(function(o){o.addEventListener('click',function(){if(poll.classList.contains('is-result'))return;o.classList.add('is-mine');votes.textContent=String(Number(votes.textContent)+1);dl.textContent='投票済み・残り2日';show();});});sim.addEventListener('click',function(){show();poll.classList.add('is-closed');dl.textContent='締め切りました';sim.textContent='締め切り済み';sim.disabled=true;});});})();
