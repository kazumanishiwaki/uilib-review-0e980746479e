<ol class='p-CONT-12-2' aria-label='沿革'><li><p class='yr'><time datetime='1962'>1962年</time><span class='wa'>昭和37年</span></p><p class='ev'>東京都大田区で創業。精密部品の製造を始める。</p></li><li><p class='yr'><time datetime='1975'>1975年</time><span class='wa'>昭和50年</span></p><p class='ev'>大阪営業所を開設。</p></li><li><p class='yr'><time datetime='1989'>1989年</time><span class='wa'>平成元年</span></p><p class='ev'>株式会社に組織を変更。</p></li><li><p class='yr'><time datetime='1998'>1998年</time><span class='wa'>平成10年</span></p><p class='ev'>第二工場（埼玉県）が稼働。</p></li><li><p class='yr'><time datetime='2010'>2010年</time><span class='wa'>平成22年</span></p><p class='ev'>ブランドと社名ロゴを刷新。</p></li><li><p class='yr'><time datetime='2019'>2019年</time><span class='wa'>令和元年</span></p><p class='ev'>ベトナムに海外拠点を設立。</p></li><li><p class='yr'><time datetime='2024'>2024年</time><span class='wa'>令和6年</span></p><p class='ev'>本社を品川へ移転。</p></li></ol>
