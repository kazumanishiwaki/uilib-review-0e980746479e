<style>
.p-NAV-04-3{position:relative;display:flex;flex-direction:column;max-width:calc(var(--space-16) * 6);height:calc(var(--space-16) * 5.5);margin:0 auto;overflow:hidden;border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-xl);background:var(--color-bg)}.p-NAV-04-3 svg{width:var(--size-icon-lg);height:var(--size-icon-lg);fill:none;stroke:currentColor;stroke-width:var(--border-width-medium);stroke-linecap:round;stroke-linejoin:round}.p-NAV-04-3 .vh{position:absolute;width:var(--border-width-thin);height:var(--border-width-thin);overflow:hidden;clip-path:inset(50%);white-space:nowrap}.p-NAV-04-3 .screen{flex:1;padding:var(--space-5)}.p-NAV-04-3 .now{margin:0;font-size:var(--font-size-xl);font-weight:var(--font-weight-bold)}.p-NAV-04-3 .bar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:var(--space-2) var(--space-1) var(--space-3);border-top:var(--border-width-thin) solid var(--color-border);background:var(--color-surface-raised)}.p-NAV-04-3 .tab{display:flex;flex-direction:column;align-items:center;gap:var(--space-1);min-height:var(--size-touch-min);padding:var(--space-0-5) 0;border-radius:var(--radius-md);color:var(--color-text-muted);font-size:var(--font-size-xs);line-height:var(--line-height-snug);text-decoration:none;white-space:nowrap;transition:color var(--duration-fast) var(--ease-standard)}.p-NAV-04-3 .tab:hover{color:var(--color-text)}.p-NAV-04-3 .tab[aria-current='page']{color:var(--color-brand);font-weight:var(--font-weight-bold)}.p-NAV-04-3 .act{display:grid;justify-self:center;place-items:center;width:var(--size-control-xl);height:var(--size-control-xl);margin-top:calc(var(--size-control-xl) / -2);padding:0;border:var(--border-width-thick) solid var(--color-surface-raised);border-radius:var(--radius-full);background:var(--color-surface-inverse);color:var(--color-text-inverse);box-shadow:var(--shadow-md);cursor:pointer;transition:transform var(--duration-instant) var(--ease-standard)}.p-NAV-04-3 .act:active{transform:scale(0.94)}.p-NAV-04-3 .act:focus-visible{box-shadow:var(--shadow-md),var(--focus-ring)}
</style>

<script>
(function(){document.querySelectorAll('.p-NAV-04-3').forEach(function(r){var n=r.querySelector('.now'),ts=r.querySelectorAll('.tab');ts.forEach(function(t){t.addEventListener('click',function(e){e.preventDefault();ts.forEach(function(x){x.removeAttribute('aria-current')});t.setAttribute('aria-current','page');n.textContent=t.querySelector('.lb').textContent})});r.querySelector('.act').addEventListener('click',function(){n.textContent='新規投稿を作成'})})})();
