<style>
.p-FORM-08-1{display:grid;gap:var(--space-4);max-width:calc(var(--space-16) * 11.25);font-family:var(--font-sans);color:var(--color-text);font-size:var(--font-size-md);line-height:var(--line-height-normal);letter-spacing:var(--letter-spacing-normal)}.p-FORM-08-1 .ttl{margin:0;font-size:var(--font-size-xl);font-weight:var(--font-weight-bold);line-height:var(--line-height-tight)}.p-FORM-08-1 .lead{margin:calc(var(--space-3) * -1) 0 0;font-size:var(--font-size-sm);color:var(--color-text-muted)}.p-FORM-08-1 .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--space-16) * 2.75),1fr));gap:var(--space-3)}.p-FORM-08-1 .opt{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-5);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-bg);transition:box-shadow var(--duration-normal) var(--ease-standard)}.p-FORM-08-1 .opt.is-primary{border-color:var(--color-brand-border);background:var(--color-brand-subtle)}.p-FORM-08-1 .opt.is-chosen{box-shadow:0 0 0 var(--border-width-medium) var(--color-brand)}.p-FORM-08-1 .ic{display:grid;place-items:center;width:var(--size-control-md);height:var(--size-control-md);border-radius:var(--radius-full);background:var(--color-surface-strong);color:var(--color-text)}.p-FORM-08-1 .is-primary .ic{background:var(--color-brand);color:var(--color-on-brand)}.p-FORM-08-1 .ic svg{width:var(--size-icon-md);height:var(--size-icon-md);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-FORM-08-1 h3{margin:0;font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);line-height:var(--line-height-snug)}.p-FORM-08-1 .opt p{flex:1 1 auto;margin:0;font-size:var(--font-size-sm);color:var(--color-text-muted)}.p-FORM-08-1 .btn{width:100%;height:var(--size-control-md);margin-top:var(--space-2);border-radius:var(--radius-md);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard)}.p-FORM-08-1 .btn-primary{border:var(--border-width-thin) solid var(--color-brand);background:var(--color-brand);color:var(--color-on-brand)}.p-FORM-08-1 .btn-primary:hover{border-color:var(--color-brand-hover);background:var(--color-brand-hover)}.p-FORM-08-1 .btn-primary:active{background:var(--color-brand-active)}.p-FORM-08-1 .btn-secondary{border:var(--border-width-thin) solid var(--color-brand);background:var(--color-bg);color:var(--color-brand)}.p-FORM-08-1 .btn-secondary:hover{background:var(--color-brand-subtle)}.p-FORM-08-1 .btn-ghost{border:var(--border-width-thin) solid var(--color-border-strong);background:var(--color-bg);color:var(--color-text)}.p-FORM-08-1 .btn-ghost:hover{background:var(--color-surface-strong)}.p-FORM-08-1 .status{margin:0;min-height:calc(var(--font-size-sm) * var(--line-height-normal));font-size:var(--font-size-sm);color:var(--color-text-muted)}

<div class="p-FORM-08-1"><p class="ttl">ご購入手続きへ進む</p><p class="lead">進み方を選んでください</p><div class="opts"><section class="opt is-primary" aria-labelledby="f081-a"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span><h3 id="f081-a">ログイン</h3><p>会員の方。保存した住所やポイントを使えます。</p><button type="button" class="btn btn-primary" data-msg="ログイン画面へ進みます">ログインする</button></section><section class="opt" aria-labelledby="f081-b"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="4"/><path d="M2 21c0-4 4-6 8-6 2 0 3.5.5 4.5 1.2M19 14v6M16 17h6"/></svg></span><h3 id="f081-b">新規登録</h3><p>はじめての方。次回から入力を省けます。</p><button type="button" class="btn btn-secondary" data-msg="会員登録へ進みます">会員登録する</button></section><section class="opt" aria-labelledby="f081-c"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7z M9 8V7a3 3 0 0 1 6 0v1"/></svg></span><h3 id="f081-c">ゲスト購入</h3><p>登録せずに購入。お届け先を毎回入力します。</p><button type="button" class="btn btn-ghost" data-msg="ゲストとしてお届け先の入力へ進みます">ゲストで進む</button></section></div><p class="status" aria-live="polite"></p></div>
<script>
(function(){document.querySelectorAll('.p-FORM-08-1').forEach(function(root){var st=root.querySelector('.status');root.querySelectorAll('.btn').forEach(function(b){b.addEventListener('click',function(){root.querySelectorAll('.opt').forEach(function(o){o.classList.remove('is-chosen');});b.closest('.opt').classList.add('is-chosen');st.textContent=b.dataset.msg;});});});})();
</script>
