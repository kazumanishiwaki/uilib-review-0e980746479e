<!-- FB-04-1 -->
<style>
.p-FB-04-1{overflow:hidden;background:var(--color-bg);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-lg);font-family:var(--font-sans);font-size:var(--font-size-md);line-height:var(--line-height-normal);letter-spacing:var(--letter-spacing-normal);color:var(--color-text)}.p-FB-04-1 [hidden]{display:none !important}.p-FB-04-1 .banner{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3) var(--space-4);background:var(--color-warning-subtle);border-bottom:var(--border-width-thin) solid var(--color-warning-border)}.p-FB-04-1 .banner > .ic{margin-top:var(--space-0-5);color:var(--color-warning)}.p-FB-04-1 .ic{flex:none;width:var(--size-icon-md);height:var(--size-icon-md);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.p-FB-04-1 .text{flex:1;margin:0;font-size:var(--font-size-sm);line-height:var(--line-height-snug);padding-top:var(--space-0-5)}.p-FB-04-1 .text strong{margin-right:var(--space-2);font-weight:var(--font-weight-bold)}.p-FB-04-1 .link{margin-left:var(--space-2);color:var(--color-text-link);text-decoration:underline}.p-FB-04-1 .close{flex:none;display:grid;place-items:center;width:var(--size-control-sm);height:var(--size-control-sm);margin:calc(var(--space-1) * -1) calc(var(--space-1) * -1) calc(var(--space-1) * -1) 0;padding:0;background:transparent;border:0;border-radius:var(--radius-md);color:var(--color-text);cursor:pointer}.p-FB-04-1 .close:hover{background:var(--color-warning-border)}.p-FB-04-1 .site{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:var(--space-3) var(--space-5);border-bottom:var(--border-width-thin) solid var(--color-border)}.p-FB-04-1 .logo{font-weight:var(--font-weight-bold)}.p-FB-04-1 .nav{display:flex;gap:var(--space-4);font-size:var(--font-size-sm);color:var(--color-text-muted)}.p-FB-04-1 .page{display:grid;gap:var(--space-3);padding:var(--space-5)}.p-FB-04-1 .ph{display:block;width:100%;height:v <div class="p-FB-04-1"><div class="banner" role="region" aria-label="サイト全体のお知らせ"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.5l9 16H3z"/><path d="M12 10v4M12 17v.01"/></svg><p class="text"><strong>メンテナンスのお知らせ</strong>11月15日 2:00〜5:00 は全サービスを停止します。<a href="#" class="link">詳細</a></p><button type="button" class="close" aria-label="お知らせを閉じる"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="site"><span class="logo">サービス名</span><span class="nav" aria-hidden="true"><span>ホーム</span><span>注文履歴</span><span>設定</span></span></div><div class="page"><span class="ph ph--h"></span><span class="ph"></span><span class="ph ph--s"></span><button type="button" class="reopen" hidden>お知らせを再表示</button></div></div>
<script>
(function(){document.querySelectorAll('.p-FB-04-1').forEach(function(r){var bn=r.querySelector('.banner'),c=r.querySelector('.close'),o=r.querySelector('.reopen');c.addEventListener('click',function(){bn.hidden=true;o.hidden=false;o.focus();});o.addEventListener('click',function(){bn.hidden=false;o.hidden=true;c.focus();});r.querySelector('.link').addEventListener('click',function(e){e.preventDefault();});});})();
</script>
