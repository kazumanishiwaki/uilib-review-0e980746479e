<!-- FORM-09-1 -->
<style>
.p-FORM-09-1{display:grid;gap:var(--space-3);max-width:calc(var(--space-16) * 8);font-family:var(--font-sans);color:var(--color-text);line-height:var(--line-height-normal);letter-spacing:var(--letter-spacing-normal)}.p-FORM-09-1 .row{display:grid;grid-template-columns:calc(var(--space-16) + var(--space-8)) minmax(0,1fr);gap:var(--space-3);align-items:start}.p-FORM-09-1 .lab{padding-top:var(--space-2);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold);line-height:var(--line-height-snug)}.p-FORM-09-1 .req{display:inline-block;margin-left:var(--space-1);padding:0 var(--space-1);border-radius:var(--radius-xs);background-color:var(--color-danger);color:var(--color-on-status);font-size:var(--font-size-xs);font-weight:var(--font-weight-bold);line-height:var(--line-height-snug)}.p-FORM-09-1 input,.p-FORM-09-1 select{width:100%;height:var(--size-control-md);padding:0 var(--space-3);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background-color:var(--color-bg);font-size:var(--font-size-md);line-height:var(--line-height-snug);transition:background-color var(--duration-slow) var(--ease-out),border-color var(--duration-fast) var(--ease-standard)}.p-FORM-09-1 input:focus-visible,.p-FORM-09-1 select:focus-visible{border-color:var(--color-focus)}.p-FORM-09-1 .zipw{display:flex;align-items:center;gap:var(--space-2);max-width:calc(var(--space-16) * 2.5)}.p-FORM-09-1 .mk{color:var(--color-text-muted);font-weight:var(--font-weight-bold)}.p-FORM-09-1 .zip{font-family:var(--font-mono);letter-spacing:var(--letter-spacing-wide)}.p-FORM-09-1 .st{margin:var(--space-1) 0 0;font-size:var(--font-size-xs);color:var(--color-text-muted);line-height:var(--line-height-snug)}.p-FORM-09-1 .st.is-ok{color:var(--color-success);font-weight:var(--font-weight-medium)}.p-FORM-09-1 .st.is-warn{color:var(--color-warning);font-weight:var(--font-weight-medium)}.p-FORM-09-1 .is-filled{background-color:var(--color-brand-subtle);border-color:var(--color-brand)}
</style>
<div class="p-FORM-09-1"><div class="row"><label class="lab" for="f091-zip">郵便番号<span class="req">必須</span></label><div class="fld"><div class="zipw"><span class="mk" aria-hidden="true">〒</span><input id="f091-zip" class="zip" inputmode="numeric" maxlength="8" autocomplete="postal-code" placeholder="1000001" aria-describedby="f091-st"></div><p class="st" id="f091-st" aria-live="polite">7桁を入れると、下の欄に住所が自動で入ります（例: 1000001、5300001）</p></div></div><div class="row"><label class="lab" for="f091-pref">都道府県</label><div class="fld"><select id="f091-pref" class="pref" autocomplete="address-level1"><option value="">選択してください</option><option>北海道</option><option>宮城県</option><option>東京都</option><option>大阪府</option><option>福岡県</option></select></div></div><div class="row"><label class="lab" for="f091-city">市区町村</label><div class="fld"><input id="f091-city" class="city" autocomplete="address-level2"></div></div><div class="row"><label class="lab" for="f091-town">町域</label><div class="fld"><input id="f091-town" class="town" autocomplete="address-level3"></div></div><div class="row"><label class="lab" for="f091-line">番地・建物</label><div class="fld"><input id="f091-line" class="line" autocomplete="address-line2" placeholder="1-1 ○○ビル 3階"></div></div></div>
<script>
(function(){var D={'1000001':['東京都','千代田区','千代田'],'0600001':['北海道','札幌市中央区','北一条西'],'9800811':['宮城県','仙台市青葉区','一番町'],'5300001':['大阪府','大阪市北区','梅田'],'8100001':['福岡県','福岡市中央区','天神']};document.querySelectorAll('.p-FORM-09-1').forEach(function(r){var z=r.querySelector('.zip'),st=r.querySelector('.st'),t=st.textContent,f=[r.querySelector('.pref'),r.querySelector('.city'),r.querySelector('.town')];z.addEventListener('input',function(){var v=z.value.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)}).replace(/[^0-9]/g,'');if(v.length<7){st.textContent=t;st.className='st';return}var a=D[v.slice(0,7)];if(!a){st.textContent='該当する住所が見つかりません。下の欄に直接入力してください';st.className='st is-warn';return}f.forEach(function(el,i){el.value=a[i];el.classList.add('is-filled');setTimeout(function(){el.classList.remove('is-filled')},1200)});st.textContent='住所を自動で入力しました。続けて番地を入力してください';st.className='st is-ok'})})})();
</script>
