<!-- TOOL-03-2 -->
<style>
.p-TOOL-03-2{display:grid;gap:var(--space-3);max-width:calc(var(--space-16)*8)}.p-TOOL-03-2 [hidden]{display:none}.p-TOOL-03-2 .hdr{margin:0;font-size:var(--font-size-sm);font-weight:var(--font-weight-bold)}.p-TOOL-03-2 .cols{display:grid;grid-template-columns:auto 1fr;min-height:calc(var(--space-16)*2.25);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg)}.p-TOOL-03-2 .secs{list-style:none;margin:0;padding:var(--space-1);border-right:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-md) 0 0 var(--radius-md);background:var(--color-surface)}.p-TOOL-03-2 .secs li{display:flex;align-items:center;gap:var(--space-1)}.p-TOOL-03-2 .sp{width:var(--size-icon-sm)}.p-TOOL-03-2 .en{width:var(--size-icon-sm);height:var(--size-icon-sm);margin:0;accent-color:var(--color-brand)}.p-TOOL-03-2 .nb{flex:1;min-height:var(--size-control-sm);padding:0 var(--space-3) 0 var(--space-2);border:0;border-radius:var(--radius-sm);background:transparent;font-size:var(--font-size-sm);text-align:left;cursor:pointer}.p-TOOL-03-2 .nb:hover{background:var(--color-surface-strong)}.p-TOOL-03-2 .nb[aria-current='true']{background:var(--color-brand-subtle);color:var(--color-brand);font-weight:var(--font-weight-bold)}.p-TOOL-03-2 .secs li.off .nb{color:var(--color-text-muted)}.p-TOOL-03-2 .dt{padding:var(--space-3)}.p-TOOL-03-2 .pn{display:grid;gap:var(--space-2)}.p-TOOL-03-2 h4{margin:0;font-size:var(--font-size-sm)}.p-TOOL-03-2 .nt{margin:0;font-size:var(--font-size-xs);color:var(--color-warning)}.p-TOOL-03-2 .pn.on .nt{display:none}.p-TOOL-03-2 .r{display:grid;grid-template-columns:calc(var(--space-16)*1.5) 1fr var(--space-10);align-items:center;gap:var(--space-2);font-size:var(--font-size-sm)}.p-TOOL-03-2 .r:has(input:disabled){color:var(--color-disabled-text)}.p-TOOL-03-2 .r input{min-width:0;accent-color:var(--color-brand)}.p-TOOL-03-2 .r input:disabled{background:transparent}.p-TOOL-03-2 output{font-family:var(--font-mono);font-size:var(--font-size-xs);text-align:right}.p-TOOL-03-2 .pv{position:relative;padding:var(--space-2);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg)}.p-TOOL-03-2 .pl{position:absolute;top:var(--space-1);left:var(--space-2);font-size:var(--font-size-xs);color:var(--color-text-muted)}.p-TOOL-03-2 .pv svg{display:block;width:100%;height:auto}.p-TOOL-03-2 .dabs circle{fill:var(--color-brand)}.p-TOOL-03-2 .sr{position:absolute;width:var(--border-width-thin);height:var(--border-width-thin);overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
<div class='p-TOOL-03-2'><p class='hdr'>ブラシ設定</p><div class='cols'><ul class='secs'><li><span class='sp' aria-hidden='true'></span><button type='button' class='nb' data-p='shape' aria-controls='q0302-shape' aria-current='true'>形状</button></li><li class='off'><input type='checkbox' class='en' data-p='jit' aria-label='ばらつきを有効にする'><button type='button' class='nb' data-p='jit' aria-controls='q0302-jit'>ばらつき</button></li><li><input type='checkbox' class='en' data-p='sct' checked aria-label='散布を有効にする'><button type='button' class='nb' data-p='sct' aria-controls='q0302-sct'>散布</button></li><li class='off'><input type='checkbox' class='en' data-p='op' aria-label='濃淡を有効にする'><button type='button' class='nb' data-p='op' aria-controls='q0302-op'>濃淡</button></li></ul><div class='dt'><section class='pn' id='q0302-shape' data-p='shape'><h4>形状</h4><label class='r'>サイズ<input type='range' min='4' max='20' value='10' data-k='size'><output>10</output></label><label class='r'>間隔<input type='range' min='10' max='200' step='10' value='60' data-k='gap'><output>60%</output></label></section><section class='pn' id='q0302-jit' data-p='jit' hidden><h4>ばらつき</h4><p class='nt'>オフのため無効です。左のチェックで有効にします</p><label class='r'>大きさのゆらぎ<input type='range' min='0' max='100' value='60' data-k='jit'><output>60%</output></label></section><section class='pn' id='q0302-sct' data-p='sct' hidden><h4>散布</h4><p class='nt'>オフのため無効です。左のチェックで有効にします</p><label class='r'>散らばり<input type='range' min='0' max='100' value='40' data-k='sct'><output>40%</output></label><label class='r'>数<input type='range' min='1' max='3' value='2' data-k='cnt'><output>2</output></label></section><section class='pn' id='q0302-op' data-p='op' hidden><h4>濃淡</h4><p class='nt'>オフのため無効です。左のチェックで有効にします</p><label class='r'>濃さのゆらぎ<input type='range' min='0' max='100' value='60' data-k='op'><output>60%</output></label></section></div></div><div class='pv'><span class='pl'>プレビュー</span><svg viewBox='0 0 320 80' role='img' aria-label='ブラシのプレビュー'><g class='dabs'></g></svg></div><p class='sr' role='status' aria-live='polite'></p></div>
<script>
(function(){var r=document.querySelector('.p-TOOL-03-2');if(!r)return;var g=r.querySelector('.dabs'),st=r.querySelector('.sr'),on={shape:true,jit:false,sct:true,op:false};function v(k){return+r.querySelector('[data-k='+k+']').value}function draw(){var seed=11;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}var size=v('size'),step=Math.max(2,size*v('gap')/100),s='';for(var x=12;x<=308;x+=step){var y=40+16*Math.sin(x/40),n=on.sct?v('cnt'):1;for(var k=0;k<n;k++){var rr=size/2*(on.jit?1-v('jit')/100*rnd()*0.9:1),dy=on.sct?(rnd()-0.5)*v('sct')/100*size*3:0,dx=on.sct?(rnd()-0.5)*v('sct')/100*size:0,o=on.op?1-v('op')/100*rnd()*0.9:1;s+='<circle cx='+(x+dx).toFixed(1)+' cy='+(y+dy).toFixed(1)+' r='+rr.toFixed(1)+' opacity='+o.toFixed(2)+'></circle>'}}g.innerHTML=s}function state(p){var pn=r.querySelector('.pn[data-p='+p+']');pn.classList.toggle('on',on[p]);pn.querySelectorAll('input').forEach(function(i){i.disabled=!on[p]});var li=r.querySelector('.nb[data-p='+p+']').parentNode;li.classList.toggle('off',!on[p])}r.querySelectorAll('.nb').forEach(function(b){b.addEventListener('click',function(){r.querySelectorAll('.nb').forEach(function(x){if(x===b)x.setAttribute('aria-current','true');else x.removeAttribute('aria-current')});r.querySelectorAll('.pn').forEach(function(p){p.hidden=p.dataset.p!==b.dataset.p})})});r.querySelectorAll('.en').forEach(function(c){c.addEventListener('change',function(){on[c.dataset.p]=c.checked;state(c.dataset.p);draw();st.textContent=c.nextElementSibling.textContent+'を'+(c.checked?'オン':'オフ')+'にしました'})});r.querySelector('.dt').addEventListener('input',function(e){var o=e.target.nextElementSibling,k=e.target.dataset.k;if(o)o.textContent=e.target.value+(k==='size'||k==='cnt'?'':'%');draw()});Object.keys(on).forEach(state);draw()})();
</script>
