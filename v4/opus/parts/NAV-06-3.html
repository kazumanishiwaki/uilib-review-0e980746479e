<!-- NAV-06-3 -->
<style>
.p-NAV-06-3 .list{margin:0;padding:0;border-top:var(--border-width-thin) solid var(--color-border);list-style:none}.p-NAV-06-3 .list li{border-bottom:var(--border-width-thin) solid var(--color-border)}.p-NAV-06-3 .list a{display:flex;align-items:center;min-height:var(--size-control-lg);padding:0 var(--space-3);color:var(--color-text);text-decoration:none;transition:background-color var(--duration-fast) var(--ease-standard)}.p-NAV-06-3 .list a:hover{background:var(--color-surface)}.p-NAV-06-3 .foot{display:grid;justify-items:center;gap:var(--space-2);padding-top:var(--space-4)}.p-NAV-06-3 .more{min-height:var(--size-control-md);padding:0 var(--space-8);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-full);background:var(--color-surface-raised);font-weight:var(--font-weight-medium);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-NAV-06-3 .more:hover{background:var(--color-surface-strong)}.p-NAV-06-3 .meta{margin:0;color:var(--color-text-muted);font-size:var(--font-size-xs)}
</style>
<div class='p-NAV-06-3'><ul class='list'><li><a href='#0'>お知らせ 1</a></li><li><a href='#0'>お知らせ 2</a></li><li><a href='#0'>お知らせ 3</a></li><li><a href='#0'>お知らせ 4</a></li></ul><div class='foot'><button type='button' class='more'>もっと見る</button><p class='meta' aria-live='polite'>全12件中 4件を表示</p></div></div>
<script>
(function(){document.querySelectorAll('.p-NAV-06-3').forEach(function(r){var ul=r.querySelector('.list'),b=r.querySelector('.more'),m=r.querySelector('.meta'),T=12,S=4;function shown(){return ul.children.length}function lab(){b.textContent='もっと見る（残り'+(T-shown())+'件）'}b.addEventListener('click',function(){var s=shown(),first=null;for(var i=s+1;i<=Math.min(s+S,T);i++){var li=document.createElement('li'),a=document.createElement('a');a.href='#0';a.textContent='お知らせ '+i;li.appendChild(a);ul.appendChild(li);if(!first)first=a}if(first)first.focus();if(shown()>=T){b.remove();m.textContent=(shown()-s)+'件追加しました。全'+T+'件をすべて表示しています'}else{lab();m.textContent=S+'件追加しました（全'+T+'件中 '+shown()+'件を表示）'}});lab()})})();
</script>
