(function(){function hsv2rgb(h,s,v){var f=function(n){var k=(n+h/60)%6;return Math.round(255*(v-v*s*Math.max(0,Math.min(k,4-k,1))))};return[f(5),f(3),f(1)]}function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx]}function hex(c){return'#'+c.map(function(x){return('0'+x.toString(16)).slice(-2)}).join('').toUpperCase()}function parse(s){var m=/^#?([0-9a-f]{6})$/i.exec(String(s).trim());if(!m)return null;var n=parseInt(m[1],16);return[n>>16&255,n>>8&255,n&255]}document.querySelectorAll('.p-FORM-14-2').forEach(function(r){var cs=getComputedStyle(r),cv=r.querySelector('.cv'),x=cv.getContext('2d'),W=cv.width,C=W/2,Ro=C-4,Ri=Ro-W*0.12,Q=(Ri-W*0.03)/Math.SQRT2,BG=cs.getPropertyValue('--color-bg').trim(),INK=cs.getPropertyValue('--color-text').trim(),dur=parseFloat(cs.getPropertyValue('--duration-slow'))||0,H=220,S=0.8,V=0.8,mode='',raf=0,ring=document.createElement('canvas'),rx=ring.getContext('2d'),pv=r.querySelector('.pv'),hx=r.querySelector('.hx'),hv=r.querySelector('.hv'),hm=r.querySelectorAll('.hm'),D=Math.PI/180;ring.width=ring.height=W;for(var a=0;a<360;a++){rx.beginPath();rx.arc(C,C,Ro,(a-90.5)*D,(a-89)*D);rx.arc(C,C,Ri,(a-89)*D,(a-90.5)*D,true);rx.closePath();rx.fillStyle='hsl('+a+',100%,50%)';rx.fill()}function pos(h,rr){return[C+rr*Math.sin(h*D),C-rr*Math.cos(h*D)]}function ringDot(p,rad,fill){x.beginPath();x.arc(p[0],p[1],rad,0,2*Math.PI);if(fill){x.fillStyle=fill;x.fill()}x.lineWidth=W*0.012;x.strokeStyle=BG;x.stroke();x.beginPath();x.arc(p[0],p[1],rad+W*0.008,0,2*Math.PI);x.lineWidth=W*0.004;x.strokeStyle=INK;x.stroke()}function draw(){var hs=hex(hsv2rgb(H,S,V)),Rm=(Ro+Ri)/2,k=(Ro-Ri)/2,g,p;x.clearRect(0,0,W,W);x.drawImage(ring,0,0);x.fillStyle='hsl('+H+',100%,50%)';x.fillRect(C-Q,C-Q,2*Q,2*Q);g=x.createLinearGradient(C-Q,0,C+Q,0);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255
