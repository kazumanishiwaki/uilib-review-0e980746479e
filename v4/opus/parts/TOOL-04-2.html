<script>
(function(){var r=document.querySelector('.p-TOOL-04-2');if(!r)return;var vp=r.querySelector('.vp'),art=r.querySelector('.art'),zc=r.querySelector('.zc'),zv=r.querySelector('.zv'),mu=r.querySelector('.menu'),ni=r.querySelector('.ni'),st=r.querySelector('.sr'),W=800,H=600,s=1,L=[10,25,50,75,100,150,200,300,400,800];function off(){var a=art.getBoundingClientRect(),b=vp.getBoundingClientRect();return[a.left-b.left-vp.clientLeft+vp.scrollLeft,a.top-b.top-vp.clientTop+vp.scrollTop]}function zoom(p,msg){p=Math.max(10,Math.min(800,Math.round(p)));var o=off(),fx=(vp.scrollLeft+vp.clientWidth/2-o[0])/(W*s),fy=(vp.scrollTop+vp.clientHeight/2-o[1])/(H*s);s=p/100;art.setAttribute('width',W*s);art.setAttribute('height',H*s);o=off();vp.scrollLeft=o[0]+fx*W*s-vp.clientWidth/2;vp.scrollTop=o[1]+fy*H*s-vp.clientHeight/2;zv.textContent=p+'%';zv.setAttribute('aria-label','拡大率 '+p+'%。変更する');st.textContent=msg||'拡大率 '+p+'%'}function fit(){var pad=parseFloat(getComputedStyle(r.querySelector('.pd')).paddingLeft)*2||0,p=Math.floor(Math.min((vp.clientWidth-pad)/W,(vp.clientHeight-pad)/H)*100);zoom(p,'全体表示（'+Math.max(10,p)+'%）')}function step(d){var c=Math.round(s*100),n=d>0?L.filter(function(v){return v>c})[0]:L.filter(function(v){return v<c}).pop();zoom(n||c)}function open(){mu.hidden=false;zv.setAttribute('aria-expanded','true');ni.value=Math.round(s*100);ni.removeAttribute('aria-invalid');ni.focus();ni.select()}function close(ret){if(mu.hidden)return;mu.hidden=true;zv.setAttribute('aria-expanded','false');if(ret)zv.focus()}zv.addEventListener('click',function(){mu.hidden?open():close(true)});r.querySelector('.zo').addEventListener('click',function(){step(-1)});r.querySelector('.zi').addEventListener('click',function(){step(1)});r.querySelector('.nf').addEventListener('submit',function(e){e.preventDefault();var v=parseFloat(ni.value);if(!(v>=10&&v<=800)){ni.setAttribute('aria-invalid','true');st.textContent='10〜800の数値で入力してください';ni.focus();return}ni.removeAttribute('aria-invalid');zoom(v);
