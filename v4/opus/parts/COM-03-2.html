<style>
.p-COM-03-2 .bundle{max-width:calc(var(--space-16) * 8)}.p-COM-03-2 .title{margin:0 0 var(--space-3);font-size:var(--font-size-md);font-weight:var(--font-weight-bold);line-height:var(--line-height-snug)}.p-COM-03-2 .items{margin:0;padding:0;list-style:none;border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-md)}.p-COM-03-2 .items li + li{border-top:var(--border-width-thin) solid var(--color-border)}.p-COM-03-2 .item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);font-size:var(--font-size-sm);line-height:var(--line-height-snug);cursor:pointer}.p-COM-03-2 .item:has(input:disabled){cursor:default}.p-COM-03-2 .item input{flex:none;width:var(--size-icon-md);height:var(--size-icon-md);margin:0;accent-color:var(--color-brand)}.p-COM-03-2 .thumb{flex:none;width:var(--space-10);height:var(--space-10);border-radius:var(--radius-sm);background:var(--color-surface-strong)}.p-COM-03-2 .iname{flex:1;min-width:0}.p-COM-03-2 .tag{display:inline-block;margin-right:var(--space-2);padding:0 var(--space-1);border-radius:var(--radius-xs);background:var(--color-surface-strong);font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);color:var(--color-text-muted)}.p-COM-03-2 .iprice{font-weight:var(--font-weight-bold);font-variant-numeric:tabular-nums}.p-COM-03-2 .sum{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3);margin-top:var(--space-4)}.p-COM-03-2 .total{margin:0;font-size:var(--font-size-sm)}.p-COM-03-2 .total strong{margin:0 var(--space-1);font-size:var(--font-size-xl);font-variant-numeric:tabular-nums}.p-COM-03-2 .btn{min-height:var(--size-control-md);padding:0 var(--space-5);border:0;border-radius:var(--radius-md);background:var(--color-brand);color:var(--color-on-brand);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-COM-03-2 .btn:hover{background:var(--color-brand-hover)}.p-COM-03-2 .vh{position:absolute;width:var(--border-width-thin);height:var(--border-width-thin);overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
<div class='p-COM-03-2'><section class='bundle' aria-labelledby='c0302-t'><h3 id='c0302-t' class='title'>一緒に購入されている商品</h3><ul class='items'><li><label class='item'><input type='checkbox' data-price='6600' checked disabled><span class='thumb' aria-hidden='true'></span><span class='iname'><span class='tag'>この商品</span>ドリップケトル</span><span class='iprice'>¥6,600</span></label></li><li><label class='item'><input type='checkbox' data-price='1980' checked><span class='thumb' aria-hidden='true'></span><span class='iname'>ドリッパー</span><span class='iprice'>¥1,980</span></label></li><li><label class='item'><input type='checkbox' data-price='550' checked><span class='thumb' aria-hidden='true'></span><span class='iname'>ペーパーフィルター 100枚</span><span class='iprice'>¥550</span></label></li></ul><div class='sum'><p class='total' aria-live='polite'>合計<strong data-total>¥9,130</strong>（<span data-count>3</span>点）</p><button type='button' class='btn' data-addall>3点をまとめてカートへ</button></div><p class='vh' role='status' data-status></p></section></div>
<script>
(function(){var r=document.querySelector('.p-COM-03-2');if(!r)return;var boxes=r.querySelectorAll('input[type=checkbox]'),tot=r.querySelector('[data-total]'),cnt=r.querySelector('[data-count]'),btn=r.querySelector('[data-addall]'),st=r.querySelector('[data-status]');function calc(){var s=0,n=0;boxes.forEach(function(b){if(b.checked){s+=+b.dataset.price;n++;}});tot.textContent='¥'+s.toLocaleString('ja-JP');cnt.textContent=n;btn.textContent=n>1?n+'点をまとめてカートへ':'カートに入れる';return n;}r.addEventListener('change',calc);btn.addEventListener('click',function(){var n=calc();st.textContent=n+'点をカートに追加しました';});calc();})();
</script>
