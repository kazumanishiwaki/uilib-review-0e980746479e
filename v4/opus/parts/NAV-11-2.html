(function(){var M={'':{k:'file',n:'ファイル',d:['index.html','style.css','app.js','README.md']},'>':{k:'cmd',n:'コマンド',d:['ファイルを保存','行を折り返す','すべて置換','ターミナルを開く']},'#':{k:'sym',n:'見出し',d:['概要','インストール','使い方','設定項目']},':':{k:'line',n:'行へ移動',d:null}};document.querySelectorAll('.p-NAV-11-2').forEach(function(r){var inp=r.querySelector('input'),ul=r.querySelector('.list'),md=r.querySelector('.mode'),st=r.querySelector('.res'),cur='',hits=[],act=0;function mark(){[].forEach.call(ul.querySelectorAll('[role=option]'),function(o,i){o.setAttribute('aria-selected',String(i===act))});var a=hits.length?document.getElementById('n112-o'+act):null;if(a){inp.setAttribute('aria-activedescendant',a.id);a.scrollIntoView({block:'nearest'})}else{inp.removeAttribute('aria-activedescendant')}}function render(){var v=inp.value,c=v.charAt(0),key=(c==='>'||c==='#'||c===':')?c:'',m=M[key],q=(key?v.slice(1):v).trim().toLowerCase();if(key!==cur){cur=key;r.setAttribute('data-mode',m.k);md.textContent=m.n;inp.setAttribute('aria-label',m.n+'を検索');st.textContent=m.n+'モード'}if(m.d){hits=m.d.filter(function(s){return s.toLowerCase().indexOf(q)>-1})}else{hits=/^[0-9]+$/.test(q)?[q+' 行目へ移動']:[]}ul.innerHTML='';hits.forEach(function(s,i){var li=document.createElement('li');li.id='n112-o'+i;li.setAttribute('role','option');li.textContent=s;li.addEventListener('pointermove',function(){if(act!==i){act=i;mark()}});li.addEventListener('click',function(){act=i;run()});ul.appendChild(li)});if(!hits.length){var e=document.createElement('li');e.className='empty';e.setAttribute('role','presentation');e.textContent=m.d?'該当なし':'行番号を数字で入力';ul.appendChild(e)}act=0;mark()}function run(){if(hits[act])st.textContent='実行：'+hits[act]}inp.addEventListener('input',render);inp.addEventListener('keydown',function(e){var n=hits.length;if(e.key==='ArrowDown'&&n){e.preventDefault();act=(act+1)%n;mark()}else if(e.key==='ArrowUp'&&n){e.preventDefault();act=(act-1+n)%n;mark()}else if(e.key==='Enter'){e.preventDefault();run()}else if(e.key=
