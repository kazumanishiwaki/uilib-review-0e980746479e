<div class='p-A11Y-02-2'><p class='hint'>文章の一部を選ぶと、読み上げボタンが出ます。キーボードでは段落で Enter を押すと段落全体を選べます。</p><div class='txt' tabindex='-1'><p tabindex='0'>市民プールは7月1日から開きます。利用料は大人300円、子ども100円です。</p><p tabindex='0'>月曜日はお休みです。雨の日も開いています。</p></div><div class='pop' hidden><button type='button' class='play'><svg class='i-play' viewBox='0 0 24 24' aria-hidden='true'><path d='M8 5v14l11-7z'/></svg><svg class='i-stop' viewBox='0 0 24 24' aria-hidden='true'><path d='M6 6h12v12H6z'/></svg><span class='lb'>選んだ部分を読む</span></button></div><p class='sr live' role='status' aria-live='polite'></p></div>
<script>
(function(){document.querySelectorAll('.p-A11Y-02-2').forEach(function(r){var txt=r.querySelector('.txt'),pop=r.querySelector('.pop'),btn=r.querySelector('.play'),lb=r.querySelector('.lb'),live=r.querySelector('.live'),ss=window.speechSynthesis,ok=!!(ss&&window.SpeechSynthesisUtterance),sel='',on=false,tok=0,tm;function hide(){if(!on)pop.hidden=true;}function check(){var s=window.getSelection();if(!s||!s.rangeCount||s.isCollapsed){hide();return;}var rg=s.getRangeAt(0);if(!txt.contains(rg.commonAncestorContainer)){hide();return;}var t=s.toString().trim();if(!t){hide();return;}sel=t;var a=rg.getBoundingClientRect(),b=r.getBoundingClientRect();pop.hidden=false;var w=pop.offsetWidth,hh=pop.offsetHeight,g=hh/5,x=a.left-b.left+a.width/2-w/2,y=a.top-b.top-hh-g;x=Math.max(0,Math.min(x,r.clientWidth-w));if(y<0)y=a.bottom-b.top+g;pop.style.left=x+'px';pop.style.top=y+'px';}document.addEventListener('selectionchange',function(){clearTimeout(tm);tm=setTimeout(check,120);});txt.querySelectorAll('p').forEach(function(p){p.addEventListener('keydown',function(e){if(e.key!=='Enter')return;e.preventDefault();var rg=document.createRange();rg.selectNodeContents(p);var s=window.getSelection();s.removeAllRanges();s.addRange(rg);check();});});btn.addEventListener('mousedown',function(e){e.preventDefault();});function done(msg){on=false;btn.classList.remove('is-on');lb.textContent='選んだ部分を読む';if(msg)live.textContent=msg;var s=window.getSelection();if(!s||s.isCollapsed)pop.hidden=true;}btn.addEventListener('click',function(){if(!ok){live.textContent='この環境では読み上げを使えません';lb.textContent='読み上げ非対応';return;}if(on){tok++;ss.cancel();done('読み上げを止めました');return;}var my=++tok,u=new SpeechSynthesisUtterance(sel);u.lang='ja-JP';u.onstart=function(){if(my!==tok)return;on=true;btn.classList.add('is-on');lb.textContent='停止';live.textContent='選んだ部分を読み上げています';};u.onend=function(){if(my===tok)done('読み上げを終えました');};u.onerror=function(){if(my===tok)done('読み上げできませんでした');};ss.cancel();ss.speak(u);});pop.addEventListener('keydown',function(e){if(e.key!=='Escape')return;e.preventDefault();if(on){tok++;ss.cancel();done('');}pop.hidden=true;txt.focus();});});})();
</script>
