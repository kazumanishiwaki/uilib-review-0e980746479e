<!-- TOOL-06-1 -->
<style>
.p-TOOL-06-1{display:grid;gap:var(--space-2)}.p-TOOL-06-1 .hd{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2)}.p-TOOL-06-1 .tt{margin:0;font-weight:var(--font-weight-bold)}.p-TOOL-06-1 .go{min-height:var(--size-control-sm);padding:0 var(--space-4);border:0;border-radius:var(--radius-md);background:var(--color-brand);color:var(--color-on-brand);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-TOOL-06-1 .go:hover{background:var(--color-brand-hover)}.p-TOOL-06-1 .q{list-style:none;margin:0;padding:0;border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-md)}.p-TOOL-06-1 .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-3);padding:var(--space-2) var(--space-3)}.p-TOOL-06-1 .row+.row{border-top:var(--border-width-thin) solid var(--color-border)}.p-TOOL-06-1 .row[data-st='run']{background:var(--color-brand-subtle)}.p-TOOL-06-1 .nm{flex:1 1 calc(var(--space-16)*1.5);display:grid;min-width:0}.p-TOOL-06-1 .fn{font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.p-TOOL-06-1 .stt{font-size:var(--font-size-xs);color:var(--color-text-muted)}.p-TOOL-06-1 [data-st='run'] .stt{color:var(--color-brand)}.p-TOOL-06-1 [data-st='pause'] .stt{color:var(--color-warning)}.p-TOOL-06-1 [data-st='done'] .stt{color:var(--color-success);font-weight:var(--font-weight-bold)}.p-TOOL-06-1 .opt{display:flex;gap:var(--space-1)}.p-TOOL-06-1 select{min-height:var(--size-control-sm);padding:0 var(--space-1);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-bg);font-size:var(--font-size-xs)}.p-TOOL-06-1 select:disabled{background:var(--color-disabled-bg);border-color:var(--color-disabled-border);color:var(--color-disabled-text)}.p-TOOL-06-1 .pg{flex:1 1 calc(var(--space-16)*2);display:flex;align-items:center;gap:var(--space-2)}.p-TOOL-06-1 .trk{flex:1;height:var(--space-2);border-radius:var(--radius-full);background:var(--color-surface-strong);overflow:hidden}.p-TOOL-06-1 .trk i{display:block;height:100%;background:var(--color-brand);transform:scaleX(var(--v,0));transform-origin:left;transition:transform var(--duration-normal) var(--ease-linear)}.p-TOOL-06-1 [data-st='pause'] .trk i{background:var(--color-warning)}.p-TOOL-06-1 [data-st='done'] .trk i{background:var(--color-success)}.p-TOOL-06-1 .pc{min-width:var(--space-10);font-family:var(--font-mono);font-size:var(--font-size-xs);text-align:right}.p-TOOL-06-1 .rm{display:grid;place-items:center;width:var(--size-control-sm);height:var(--size-control-sm);padding:0;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--color-text-muted);cursor:pointer}.p-TOOL-06-1 .rm:hover:not(:disabled){background:var(--color-surface-strong)}.p-TOOL-06-1 .rm:disabled{background:transparent;color:var(--color-disabled-text)}.p-TOOL-06-1 .rm svg{width:var(--size-icon-sm);height:var(--size-icon-sm);fill:none;stroke:currentColor;stroke-width:var(--border-width-medium);stroke-linecap:round}.p-TOOL-06-1 .sr{position:absolute;width:var(--border-width-thin);height:var(--border-width-thin);overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
<div class='p-TOOL-06-1'><div class='hd'><p class='tt'>書き出しキュー</p><button type='button' class='go'>書き出し開始</button></div><ul class='q'><li class='row' data-st='wait'><div class='nm'><span class='fn'>本編_最終</span><span class='stt'>待機中</span></div><div class='opt'><label><span class='sr'>本編_最終の形式</span><select><option>MP4</option><option>MOV</option><option>GIF</option></select></label><label><span class='sr'>本編_最終の画質</span><select><option>1080p</option><option>720p</option><option>4K</option></select></label></div><div class='pg'><div class='trk' role='progressbar' aria-label='本編_最終の進み具合' aria-valuemin='0' aria-valuemax='100' aria-valuenow='0'><i></i></div><span class='pc'>0%</span></div><button type='button' class='rm' aria-label='本編_最終をキューから外す'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M6 6l12 12M18 6L6 18'/></svg></button></li><li class='row' data-st='wait'><div class='nm'><span class='fn'>予告_30秒</span><span class='stt'>待機中</span></div><div class='opt'><label><span class='sr'>予告_30秒の形式</span><select><option>MP4</option><option>MOV</option><option>GIF</option></select></label><label><span class='sr'>予告_30秒の画質</span><select><option>1080p</option><option selected>720p</option><option>4K</option></select></label></div><div class='pg'><div class='trk' role='progressbar' aria-label='予告_30秒の進み具合' aria-valuemin='0' aria-valuemax='100' aria-valuenow='0'><i></i></div><span class='pc'>0%</span></div><button type='button' class='rm' aria-label='予告_30秒をキューから外す'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M6 6l12 12M18 6L6 18'/></svg></button></li><li class='row' data-st='wait'><div class='nm'><span class='fn'>SNS用_縦</span><span class='stt'>待機中</span></div><div class='opt'><label><span class='sr'>SNS用_縦の形式</span><select><option>MP4</option><option>MOV</option><option selected>GIF</option></select></label><label><span class='sr'>SNS用_縦の画質</span><select><option>1080p</option><option selected>720p</option><option>4K</option></select></label></div><div class='pg'><div class='trk' role='progressbar' aria-label='SNS用_縦の進み具合' aria-valuemin='0' aria-valuemax='100' aria-valuenow='0'><i></i></div><span class='pc'>0%</span></div><button type='button' class='rm' aria-label='SNS用_縦をキューから外す'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M6 6l12 12M18 6L6 18'/></svg></button></li></ul><p class='sr' role='status' aria-live='polite'></p></div>
<script>
(function(){var r=document.querySelector('.p-TOOL-06-1');if(!r)return;var go=r.querySelector('.go'),q=r.querySelector('.q'),st=r.querySelector('.sr'),tm=null,cur=null,L={wait:'待機中',run:'書き出し中',pause:'一時停止',done:'完了'};function nm(row){return row.querySelector('.fn').textContent}function val(row){return+row.querySelector('.trk').getAttribute('aria-valuenow')}function set(row,v){var t=row.querySelector('.trk');t.querySelector('i').style.setProperty('--v',v/100);t.setAttribute('aria-valuenow',v);row.querySelector('.pc').textContent=v+'%'}function state(row,s){row.dataset.st=s;row.querySelector('.stt').textContent=L[s];row.querySelectorAll('select').forEach(function(x){x.disabled=s==='run'||s==='done'});row.querySelector('.rm').disabled=s==='run'}function next(){return q.querySelector('.row[data-st=pause]')||q.querySelector('.row[data-st=wait]')}function stop(all){clearInterval(tm);tm=null;if(all){cur=null;go.textContent='書き出し開始';st.textContent='キューの書き出しがすべて完了しました'}else{state(cur,'pause');go.textContent='再開';st.textContent=nm(cur)+'を一時停止しました'}}function tick(){var v=Math.min(100,val(cur)+5);set(cur,v);if(v<100)return;state(cur,'done');var done=nm(cur);cur=next();if(!cur){stop(true);return}state(cur,'run');st.textContent=done+'が完了しました。続けて'+nm(cur)+'を書き出します'}go.addEventListener('click',function(){if(tm){stop(false);return}cur=next();if(!cur){st.textContent='待機中の項目がありません';return}state(cur,'run');go.textContent='一時停止';st.textContent=nm(cur)+'の書き出しを始めました';tm=setInterval(tick,150)});q.addEventListener('click',function(e){var b=e.target.closest('.rm');if(!b||b.disabled)return;var row=b.closest('.row'),n=row.nextElementSibling||row.previousElementSibling,name=nm(row);if(row===cur)cur=null;row.remove();(n?n.querySelector('.rm'):go).focus();st.textContent=name+'をキューから外しました'});q.addEventListener('change',function(e){var row=e.target.closest('.row');st.textContent=nm(row)+'の設定を'+e.target.value+'に変更しました'})})();
</script>
