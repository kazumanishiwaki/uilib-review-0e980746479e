<script>
(function(){document.querySelectorAll('.p-ACT-06-1').forEach(function(root){var P='.p-ACT-06-1__',list=root.querySelector(P+'list'),status=root.querySelector(P+'status'),drag=null;function idx(el){return [].indexOf.call(list.children,el);}function say(item){status.textContent='「'+item.querySelector(P+'text').textContent+'」を'+(idx(item)+1)+'番目に移動しました';}function move(e){if(!drag){return;}var items=list.children;for(var i=0;i<items.length;i++){var it=items[i];if(it===drag){continue;}var r=it.getBoundingClientRect();if(e.clientY<r.top+r.height/2){if(drag.nextElementSibling!==it){list.insertBefore(drag,it);}return;}}if(list.lastElementChild!==drag){list.appendChild(drag);}}function up(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);if(!drag){return;}drag.classList.remove('is-dragging');say(drag);drag=null;}list.addEventListener('pointerdown',function(e){var h=e.target.closest(P+'handle');if(!h||e.button!==0){return;}e.preventDefault();drag=h.closest(P+'item');drag.classList.add('is-dragging');window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);});list.addEventListener('keydown',function(e){var h=e.target.closest(P+'handle');if(!h){return;}var item=h.closest(P+'item');if(e.key==='ArrowUp'&&item.previousElementSibling){e.preventDefault();list.insertBefore(item.previousElementSibling,item.nextElementSibling);say(item);}else if(e.key==='ArrowDown'&&item.nextElementSibling){e.preventDefault();list.insertBefore(item.nextElementSibling,item);say(item);}});});})();
