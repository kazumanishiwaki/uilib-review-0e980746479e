<style>

<script>
(function(){document.querySelectorAll('.p-FORM-04-2').forEach(function(root){var ta=root.querySelector('textarea'),c=root.querySelector('.count'),b=c.querySelector('b'),max=parseInt(ta.getAttribute('maxlength'),10);function up(){var r=Math.max(0,max-ta.value.length);b.textContent=r;c.classList.toggle('is-low',r<=10&&r>0);c.classList.toggle('is-zero',r===0);}ta.addEventListener('input',up);up();});})();
