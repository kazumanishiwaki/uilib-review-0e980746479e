rd)}.p-FORM-02-1 .zone:hover .btn{background:var(--color-brand);color:var(--color-on-brand)}.p-FORM-02-1 .note{margin:var(--space-1) 0 0;font-size:var(--font-size-xs);line-height:var(--line-height-snug);color:var(--color-text-muted)}.p-FORM-02-1 .list{display:grid;gap:var(--space-2);margin:0;padding:0;list-style:none}.p-FORM-02-1 .list[hidden]{display:none}.p-FORM-02-1 .item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-2) var(--space-2) var(--space-3);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg);animation:p-FORM-02-1-in var(--duration-normal) var(--ease-out)}.p-FORM-02-1 .ic{display:grid;place-items:center;width:var(--size-control-sm);height:var(--size-control-sm);border-radius:var(--radius-sm);background:var(--color-info-subtle);color:var(--color-info);font-family:var(--font-mono);font-size:var(--font-size-xs);font-weight:var(--font-weight-bold);line-height:var(--line-height-none)}.p-FORM-02-1 .nm{overflow:hidden;font-size:var(--font-size-sm);line-height:var(--line-height-snug);text-overflow:ellipsis;white-space:nowrap}.p-FORM-02-1 .sz{font-size:var(--font-size-xs);color:var(--color-text-muted);font-variant-numeric:tabular-nums;white-space:nowrap}.p-FORM-02-1 .del{height:var(--size-control-sm);padding:0 var(--space-3);border:0;border-radius:var(--radius-sm);background:transparent;color:var(--color-danger);font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-FORM-02-1 .del:hover{background:var(--color-danger-subtle)}@keyframes p-FORM-02-1-in{from{opacity:0;transform:translateY(calc(var(--space-1) * -1))}}

<div class="p-FORM-02-1"><p class="title" id="f021-t">提出書類</p><div class="zone"><input type="file" multiple aria-labelledby="f021-t" aria-describedby="f021-n"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg><p class="zt">ここにファイルをドラッグ</p><p class="zs">または</p><span class="btn" aria-hidden="true">ファイルを選択</span><p class="note" id="f021-n">PDF・JPG・PNG／1件10MBまで</p></div><ul class="list" aria-live="polite" aria-label="追加したファイル"></ul></div>
<script>
(function(){document.querySelectorAll('.p-FORM-02-1').forEach(function(root){var input=root.querySelector('input'),zone=root.querySelector('.zone'),list=root.querySelector('.list'),files=[{name:'本人確認書類.jpg',size:1258291},{name:'見積書.pdf',size:253952}];function fmt(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';}function render(){list.textContent='';files.forEach(function(f,i){var li=document.createElement('li'),ic=document.createElement('span'),nm=document.createElement('span'),sz=document.createElement('span'),del=document.createElement('button');li.className='item';ic.className='ic';ic.setAttribute('aria-hidden','true');ic.textContent=(f.name.indexOf('.')>-1?f.name.split('.').pop():'FILE').toUpperCase().slice(0,3);nm.className='nm';nm.textContent=f.name;sz.className='sz';sz.textContent=fmt(f.size);del.type='button';del.className='del';del.textContent='削除';del.setAttribute('aria-label',f.name+' を削除');del.addEventListener('click',function(){files.splice(i,1);render();});li.appendChild(ic);li.appendChild(nm);li.appendChild(sz);li.appendChild(del);list.appendChild(li);});list.hidden=!files.length;}input.addEventListener('change',function(){Array.prototype.forEach.call(input.files,function(f){files.push({name:f.name,size:f.size});});input.value='';zone.classList.remove('is-over');render();});['dragenter','dragover'].forEach(function(t){zone.addEventListener(t,function(){zone.classList.add('is-over');});});['dragleave','drop'].forEach(function(t){zone.addEventListener(t,function(){zone.classList.remove('is-over');});});render();});})();
</script>
