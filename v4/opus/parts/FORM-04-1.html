<style>

r(--line-height-snug)}.p-FORM-04-1 .req{padding:0 var(--space-1);border:var(--border-width-thin) solid var(--color-danger-border);border-radius:var(--radius-xs);background:var(--color-danger-subtle);color:var(--color-danger);font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);line-height:var(--line-height-snug)}.p-FORM-04-1 .input{display:block;width:100%;height:var(--size-control-md);padding:0 var(--space-3);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-bg);color:var(--color-text);font-size:var(--font-size-md);transition:border-color var(--duration-fast) var(--ease-standard)}.p-FORM-04-1 .input:focus{border-color:var(--color-brand)}.p-FORM-04-1 .is-error .input{border-color:var(--color-danger);box-shadow:inset 0 0 0 var(--border-width-thin) var(--color-danger)}.p-FORM-04-1 .is-error .input:focus-visible{box-shadow:inset 0 0 0 var(--border-width-thin) var(--color-danger),var(--focus-ring)}.p-FORM-04-1 .err{display:flex;align-items:flex-start;gap:var(--space-1);margin:0;color:var(--color-danger);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold);line-height:var(--line-height-snug)}.p-FORM-04-1 .err[hidden]{display:none}.p-FORM-04-1 .err svg{flex:none;width:var(--size-icon-sm);height:var(--size-icon-sm);margin-top:var(--space-0-5);fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}.p-FORM-04-1 .submit{justify-self:start;height:var(--size-control-md);padding:0 var(--space-6);border:0;border-radius:var(--radius-md);background:var(--color-brand);color:var(--color-on-brand);font-weight:var(--font-weight-bold);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-FORM-04-1 .submit:hover{background:var(--color-brand-hover)}.p-FORM-04-1 .submit:active{background:var(--color-brand-active)}

<form class="p-FORM-04-1" novalidate><div class="summary" role="group" tabindex="-1" aria-labelledby="f041-sum-t"><p class="sum-h"><svg class="i-err" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><svg class="i-ok" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg><span class="sum-t" id="f041-sum-t">2件の項目を確認してください</span></p><ul class="sum-list"><li><a href="#f041-name">氏名：氏名を入力してください</a></li><li><a href="#f041-mail">メールアドレス：「example.jp」のようにドメインまで入力してください</a></li></ul></div><div class="field is-error" data-rule="name"><label class="label" for="f041-name">氏名<span class="req">必須</span></label><input class="input" id="f041-name" type="text" autocomplete="name" aria-invalid="true" aria-describedby="f041-name-e"><p class="err" id="f041-name-e"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><span>氏名を入力してください</span></p></div><div class="field is-error" data-rule="mail"><label class="label" for="f041-mail">メールアドレス<span class="req">必須</span></label><input class="input" id="f041-mail" type="email" value="taro@example" autocomplete="email" aria-invalid="true" aria-describedby="f041-mail-e"><p class="err" id="f041-mail-e"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><span>「example.jp」のようにドメインまで入力してください</span></p></div><div class="field" data-rule="tel"><label class="label" for="f041-tel">電話番号</label><input class="input" id="f041-tel" type="tel" value="03-1234-5678" autocomplete="tel" aria-invalid="false" aria-describedby="f041-tel-e"><p class="err" id="f041-tel-e" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><span></span></p></div><button type="submit" class="submit">確認する</button></form>
<script>
(function(){document.querySelectorAll('.p-FORM-04-1').forEach(function(form){var sum=form.querySelector('.summary'),sumT=form.querySelector('.sum-t'),sumL=form.querySelector('.sum-list');var rules={name:{label:'氏名',check:function(v){return v?'':'氏名を入力してください';}},mail:{label:'メールアドレス',check:function(v){if(!v)return 'メールアドレスを入力してください';var p=v.split('@');return p.length===2&&p[0]&&p[1].indexOf('.')>0&&p[1].slice(-1)!=='.'?'':'「example.jp」のようにドメインまで入力してください';}},tel:{label:'電話番号',check:function(v){return !v||/^[0-9-]{10,13}$/.test(v)?'':'半角数字とハイフンで入力してください';}}};function validate(focus){var errs=[];form.querySelectorAll('.field').forEach(function(f){var inp=f.querySelector('input'),r=rules[f.dataset.rule],msg=r.check(inp.value.trim()),e=f.querySelector('.err');f.classList.toggle('is-error',!!msg);inp.setAttribute('aria-invalid',msg?'true':'false');e.hidden=!msg;e.querySelector('span').textContent=msg;if(msg)errs.push({id:inp.id,text:r.label+'：'+msg});});sumL.textContent='';errs.forEach(function(x){var li=document.createElement('li'),a=document.createElement('a');a.href='#'+x.id;a.textContent=x.text;a.addEventListener('click',function(ev){ev.preventDefault();document.getElementById(x.id).focus();});li.appendChild(a);sumL.appendChild(li);});sum.classList.toggle('is-ok',!errs.length);sumT.textContent=errs.length?errs.length+'件の項目を確認してください':'入力内容に問題はありません';sumL.hidden=!errs.length;if(focus)sum.focus();}form.addEventListener('submit',function(ev){ev.preventDefault();validate(true);});form.addEventListener('input',function(){validate(false);});validate(false);});})();
</script>
