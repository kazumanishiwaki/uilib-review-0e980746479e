<div class='p-COM-06-3'><form class='form' novalidate><div class='zone' data-zone><input type='file' id='c0603-photo' accept='image/*' multiple class='vh' data-photo><label for='c0603-photo' class='drop'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M4 8h3l2-3h6l2 3h3v11H4z'/><circle cx='12' cy='13' r='3.5'/></svg><span class='dt'>写真を追加</span><span class='dh'>ドラッグ＆ドロップ、またはクリック・5枚まで</span></label><ul class='thumbs' data-thumbs aria-label='添付した写真'></ul><p class='meta'><span data-pcount>0</span>/5枚</p></div><div class='video'><input type='file' id='c0603-video' accept='video/*' class='vh' data-video><label for='c0603-video' class='vbtn'><svg viewBox='0 0 24 24' aria-hidden='true'><rect x='3' y='6' width='13' height='12' rx='2'/><path d='M16 10l5-3v10l-5-3'/></svg>動画を追加<span class='lim'>1本まで</span></label><div class='vfile' data-vbox hidden><span data-vname></span><button type='button' class='rmv' data-vrm aria-label='動画を削除'>削除</button></div></div><p class='msg' role='status' data-msg></p><div class='f'><label for='c0603-body' class='lbl'>ひとこと（任意）</label><textarea id='c0603-body' rows='2' class='input'></textarea></div><button type='submit' class='btn'>投稿する</button></form></div>
<script>
(function(){var r=document.querySelector('.p-COM-06-3');if(!r)return;var MAX=5,photos=[],video=null,f=r.querySelector('form'),pin=r.querySelector('[data-photo]'),vin=r.querySelector('[data-video]'),zone=r.querySelector('[data-zone]'),list=r.querySelector('[data-thumbs]'),pc=r.querySelector('[data-pcount]'),vbox=r.querySelector('[data-vbox]'),vname=r.querySelector('[data-vname]'),msg=r.querySelector('[data-msg]');function say(t,c){msg.className='msg'+(c?' '+c:'');msg.textContent=t;}function render(){list.innerHTML='';photos.forEach(function(p,i){var li=document.createElement('li'),img=document.createElement('img'),b=document.createElement('button');img.src=p.url;img.alt=p.name;b.type='button';b.className='rm';b.dataset.i=i;b.setAttribute('aria-label','写真'+(i+1)+'を削除');b.textContent='×';li.appendChild(img);li.appendChild(b);list.appendChild(li);});pc.textContent=photos.length;var full=photos.length>=MAX;pin.disabled=full;zone.classList.toggle('is-full',full);vbox.hidden=!video;vname.textContent=video?video.name:'';vin.disabled=!!video;}function addPhotos(fl){var added=0,skip=0;Array.prototype.forEach.call(fl,function(file){if(file.type.indexOf('image/')!==0||photos.length>=MAX){skip++;return;}photos.push({name:file.name,url:URL.createObjectURL(file)});added++;});render();say((added?'写真を'+added+'枚追加しました。':'')+(skip?skip+'件は追加できませんでした（写真のみ・5枚まで）。':''),skip?'is-err':'');}pin.addEventListener('change',function(){addPhotos(pin.files);pin.value='';});vin.addEventListener('change',function(){var file=vin.files[0];vin.value='';if(!file)return;video={name:file.name};render();say('動画を追加しました');});r.querySelector('[data-vrm]').addEventListener('click',function(){video=null;render();say('動画を削除しました');vin.focus();});list.addEventListener('click',function(e){var b=e.target.closest('.rm');if(!b)return;var i=+b.dataset.i;URL.revokeObjectURL(photos[i].url);photos.splice(i,1);render();say('写真を削除しました');var next=list.querySelectorAll('.rm')[Math.min(i,photos.length-1)];(next||pin).focus();});['dragenter','dragover'].forEach(function(t){zone.addEventListener(t,function(e){e.preventDefault();if(photos.length<MAX)zone.classList.add('is-over');});});['dragleave','drop'].forEach(function(t){zone.addEventListener(t,function(e){e.preventDefault();zone.classList.remove('is-over');});});zone.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files.length)addPhotos(e.dataTransfer.files);});f.addEventListener('submit',function(e){e.preventDefault();if(!photos.length&&!video){say('写真か動画を1つ以上添付してください','is-err');pin.focus();return;}var t='投稿を受け付けました（写真'+photos.length+'枚'+(video?'・動画1本':'')+'）';photos.forEach(function(p){URL.revokeObjectURL(p.url);});photos=[];video=null;f.reset();render();say(t,'is-ok');});})();
