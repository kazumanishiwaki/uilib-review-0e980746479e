<div class='p-I18N-02-2'><section class='st1'><p class='step'><span class='n'>1</span>地域を選ぶ</p><label class='lb' for='i22-r'>地域</label><select id='i22-r' class='reg'><option value='jp'>日本</option><option value='us'>アメリカ合衆国</option><option value='de'>ドイツ</option><option value='fr'>フランス</option></select><p class='hint'>選んだ地域の形式が、下の項目すべてにまとめて入ります。</p></section><section class='st2'><p class='step'><span class='n'>2</span>必要な項目だけ変更</p><ul class='rows'><li class='row' data-k='date'><span class='k'>日付</span><span class='v'></span><span class='tag' hidden>個別</span><button type='button' class='chg' aria-expanded='false'>変更<span class='sr'>：日付</span></button><div class='ed' hidden><label class='sr' for='i22-date'>日付の形式</label><select id='i22-date' class='ov'></select></div></li><li class='row' data-k='time'><span class='k'>時刻</span><span class='v'></span><span class='tag' hidden>個別</span><button type='button' class='chg' aria-expanded='false'>変更<span class='sr'>：時刻</span></button><div class='ed' hidden><label class='sr' for='i22-time'>時刻の形式</label><select id='i22-time' class='ov'></select></div></li><li class='row' data-k='num'><span class='k'>数値</span><span class='v'></span><span class='tag' hidden>個別</span><button type='button' class='chg' aria-expanded='false'>変更<span class='sr'>：数値</span></button><div class='ed' hidden><label class='sr' for='i22-num'>数値の形式</label><select id='i22-num' class='ov'></select></div></li><li class='row' data-k='week'><span class='k'>週の始まり</span><span class='v'></span><span class='tag' hidden>個別</span><button type='button' class='chg' aria-expanded='false'>変更<span class='sr'>：週の始まり</span></button><div class='ed' hidden><label class='sr' for='i22-week'>週の始まり</label><select id='i22-week' class='ov'></select></div></li></ul></section><p class='sr live' role='status' aria-live='polite'></p></div>
<script>
(function(){var P={jp:{date:'2026/11/11',time:'14:30',num:'1,234.5',week:'日曜始まり'},us:{date:'11/11/2026',time:'2:30 PM',num:'1,234.5',week:'日曜始まり'},de:{date:'11.11.2026',time:'14:30',num:'1.234,5',week:'月曜始まり'},fr:{date:'11/11/2026',time:'14:30',num:'1 234,5',week:'月曜始まり'}},O={date:['2026/11/11','11/11/2026','11.11.2026','2026-11-11'],time:['14:30','2:30 PM'],num:['1,234.5','1.234,5','1 234,5'],week:['日曜始まり','月曜始まり']};document.querySelectorAll('.p-I18N-02-2').forEach(function(r){var reg=r.querySelector('.reg'),live=r.querySelector('.live'),rows=r.querySelectorAll('.row'),ov={};function render(){var p=P[reg.value];rows.forEach(function(row){var k=row.dataset.k,s=row.querySelector('.ov'),d=p[k];row.querySelector('.v').textContent=ov[k]||d;row.querySelector('.tag').hidden=!ov[k];s.textContent='';var o=document.createElement('option');o.value='';o.textContent='地域の既定（'+d+'）';s.appendChild(o);O[k].forEach(function(x){if(x===d)return;var e=document.createElement('option');e.value=x;e.textContent=x;s.appendChild(e);});s.value=ov[k]||'';});}reg.addEventListener('change',function(){ov={};rows.forEach(function(row){row.querySelector('.ed').hidden=true;row.querySelector('.chg').setAttribute('aria-expanded','false');});render();live.textContent=reg.options[reg.selectedIndex].text+'の形式をすべての項目に適用しました';});rows.forEach(function(row){var b=row.querySelector('.chg'),ed=row.querySelector('.ed'),s=row.querySelector('.ov'),k=row.dataset.k,nm=row.querySelector('.k').textContent;b.addEventListener('click',function(){var o=ed.hidden;ed.hidden=!o;b.setAttribute('aria-expanded',String(o));if(o)s.focus();});s.addEventListener('change',function(){if(s.value)ov[k]=s.value;else delete ov[k];render();live.textContent=s.value?nm+'を個別に変更しました':nm+'を地域の既定に戻しました';});});render();});})();
