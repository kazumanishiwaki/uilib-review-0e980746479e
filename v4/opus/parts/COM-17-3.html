<div class='p-COM-17-3'><section class='stp' aria-labelledby='c173-h1'><p class='pg'>ステップ 1 / 2</p><h3 class='h' id='c173-h1' tabindex='-1'>停止する前に、受け取り方を変えられます</h3><form class='alt'><div class='choices'><label class='ch'><input type='radio' name='c173-o' value='freq' checked><span><span class='nm'>月1回のまとめだけにする</span><span class='ds'>届く通数が約4分の1になります</span></span></label><label class='ch'><input type='radio' name='c173-o' value='sale'><span><span class='nm'>セール情報だけにする</span><span class='ds'>新着や読みものは届きません</span></span></label><label class='ch'><input type='radio' name='c173-o' value='pause'><span><span class='nm'>30日間お休みする</span><span class='ds'>12月11日から自動で再開します</span></span></label></div><button type='submit' class='btn pri'>この内容に変更</button></form><div class='last'><p>どれも合わない場合</p><button type='button' class='go-all'>すべての配信を停止する</button></div></section><section class='stp' aria-labelledby='c173-h2' hidden><p class='pg'>ステップ 2 / 2</p><h3 class='h' id='c173-h2' tabindex='-1'>すべての配信を停止しますか？</h3><p class='tx'>セールや会員限定クーポンのお知らせも届かなくなります。注文や配送のご連絡は引き続き届きます。</p><div class='acts'><button type='button' class='btn dng stop'>すべて停止する</button><button type='button' class='btn back'>選択肢に戻る</button></div></section><section class='stp res' aria-labelledby='c173-h3' hidden><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='10'/><path d='M7.5 12.5l3 3 6-6.5'/></svg><h3 class='h' id='c173-h3' tabindex='-1'></h3><p class='tx rs'></p><button type='button' class='btn reset'>設定に戻る</button></section></div>
<script>
(function(){var R={freq:['月1回のまとめに変更しました','次回は12月1日にお届けします。'],sale:['セール情報だけに変更しました','新着や読みもののメールは届かなくなります。'],pause:['30日間お休みします','12月11日から配信を再開します。'],all:['すべての配信を停止しました','注文や配送のご連絡のみお送りします。']};document.querySelectorAll('.p-COM-17-3').forEach(function(r){var s=r.querySelectorAll('.stp');function show(i){s.forEach(function(x,j){x.hidden=j!==i;});s[i].querySelector('.h').focus();}function done(k){s[2].querySelector('.h').textContent=R[k][0];s[2].querySelector('.rs').textContent=R[k][1];show(2);}r.querySelector('.alt').addEventListener('submit',function(e){e.preventDefault();done(r.querySelector('.alt input:checked').value);});r.querySelector('.go-all').addEventListener('click',function(){show(1);});r.querySelector('.back').addEventListener('click',function(){show(0);});r.querySelector('.stop').addEventListener('click',function(){done('all');});r.querySelector('.reset').addEventListener('click',function(){show(0);});s[1].addEventListener('keydown',function(e){if(e.key==='Escape')show(0);});});})();
</script>
