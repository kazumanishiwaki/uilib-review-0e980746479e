<style>
.p-DATA-01-6{font-family:var(--font-sans);font-size:var(--font-size-sm);line-height:var(--line-height-snug);letter-spacing:var(--letter-spacing-normal);color:var(--color-text)}.p-DATA-01-6 .hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)}.p-DATA-01-6 .tt{font-size:var(--font-size-md);font-weight:var(--font-weight-bold)}.p-DATA-01-6 .fl{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-xs);color:var(--color-text-muted);cursor:pointer}.p-DATA-01-6 .fl input{width:var(--size-icon-sm);height:var(--size-icon-sm);margin:0;accent-color:var(--color-brand)}.p-DATA-01-6 .tw{border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-lg);overflow:auto;background:var(--color-bg)}.p-DATA-01-6 table{width:100%;border-collapse:collapse}.p-DATA-01-6 th,.p-DATA-01-6 td{padding:var(--space-2) var(--space-3);text-align:left;vertical-align:middle;border-bottom:var(--border-width-thin) solid var(--color-border);white-space:nowrap}.p-DATA-01-6 thead th{background:var(--color-surface-strong);font-size:var(--font-size-xs);font-weight:var(--font-weight-bold);letter-spacing:var(--letter-spacing-wide);color:var(--color-text-muted)}.p-DATA-01-6 tbody tr:last-child td{border-bottom:0}.p-DATA-01-6 tbody tr:hover td{background:var(--color-surface)}.p-DATA-01-6 .n{text-align:right;font-variant-numeric:tabular-nums}.p-DATA-01-6 th button{display:inline-flex;align-items:center;gap:var(--space-1);padding:0;border:0;border-radius:var(--radius-xs);background:transparent;font-weight:inherit;color:inherit;cursor:pointer}.p-DATA-01-6 th button:hover{color:var(--color-text)}.p-DATA-01-6 th button::after{content:'↕';color:var(--color-text-placeholder)}.p-DATA-01-6 th[aria-sort=ascending] button,.p-DATA-01-6 th[aria-sort=descending] button{color:var(--color-brand)}.p-DATA-01-6 th[aria-sort=ascending] button::after{content:'↑';color:var(--color-brand)}.p-DATA-01-6 th[aria-sort=descending] button::after{content:'↓';color:var(--color-brand)}.p-DATA-01-6 .sp{display:block;width:calc(var(--space-16) * 1.5);height:var(--space-6);overflow:visible}.p-DATA-01-6 .sp polyline{fill:none;stroke:var(--color-brand);stroke-width:var(--border-width-medium);stroke-linejoin:round;vector-effect:non-scaling-stroke}.p-DATA-01-6 .dn .sp polyline{stroke:var(--color-text-muted)}.p-DATA-01-6 .dl{font-weight:var(--font-weight-bold)}.p-DATA-01-6 .dl.up{color:var(--color-success)}.p-DATA-01-6 .dl.dw{color:var(--color-danger)}
</style>
<div class='p-DATA-01-6'><div class='hd'><span class='tt'>商品別の売上推移</span><label class='fl'><input type='checkbox'>上昇のみ表示</label></div><div class='tw'><table><thead><tr><th><button type='button' data-k='name'>商品</button></th><th class='n' aria-sort='descending'><button type='button' data-k='sales'>売上（万円）</button></th><th>推移（8週）</th><th class='n'><button type='button' data-k='delta'>前週比</button></th></tr></thead><tbody><tr data-name='ぶれんどまめ' data-sales='420' data-delta='8'><td>ブレンド豆</td><td class='n'>420</td><td><svg class='sp' viewBox='0 0 100 24' preserveAspectRatio='none' role='img' aria-label='上昇傾向'><polyline points='0,18 14,17 28,15 42,16 57,12 71,10 85,8 100,5'/></svg></td><td class='n'><span class='dl up'>+8%</span></td></tr><tr class='dn' data-name='かふぇらて' data-sales='310' data-delta='-4'><td>カフェラテ</td><td class='n'>310</td><td><svg class='sp' viewBox='0 0 100 24' preserveAspectRatio='none' role='img' aria-label='下降傾向'><polyline points='0,6 14,8 28,7 42,10 57,12 71,11 85,15 100,17'/></svg></td><td class='n'><span class='dl dw'>-4%</span></td></tr><tr data-name='まっちゃらて' data-sales='265' data-delta='15'><td>抹茶ラテ</td><td class='n'>265</td><td><svg class='sp' viewBox='0 0 100 24' preserveAspectRatio='none' role='img' aria-label='上昇傾向'><polyline points='0,20 14,19 28,18 42,14 57,13 71,9 85,6 100,3'/></svg></td><td class='n'><span class='dl up'>+15%</span></td></tr><tr class='dn' data-name='やきがし' data-sales='180' data-delta='-2'><td>焼き菓子</td><td class='n'>180</td><td><svg class='sp' viewBox='0 0 100 24' preserveAspectRatio='none' role='img' aria-label='横ばいからやや下降'><polyline points='0,10 14,9 28,12 42,11 57,13 71,12 85,14 100,13'/></svg></td><td class='n'><span class='dl dw'>-2%</span></td></tr></tbody></table></div></div>
<script>
(function(){document.querySelectorAll('.p-DATA-01-6').forEach(function(r){var tb=r.querySelector('tbody'),f=r.querySelector('.fl input');r.querySelectorAll('th button').forEach(function(b){b.addEventListener('click',function(){var k=b.dataset.k,th=b.parentNode,d=th.getAttribute('aria-sort')==='descending'?1:-1;r.querySelectorAll('th').forEach(function(t){t.removeAttribute('aria-sort')});th.setAttribute('aria-sort',d>0?'ascending':'descending');var rows=[].slice.call(tb.rows);rows.sort(function(a,c){var x=a.dataset[k],y=c.dataset[k];return (isNaN(x)?x.localeCompare(y,'ja'):x-y)*d});rows.forEach(function(e){tb.appendChild(e)})})});f.addEventListener('change',function(){[].forEach.call(tb.rows,function(e){e.hidden=f.checked&&+e.dataset.delta<0})})})})();
</script>
