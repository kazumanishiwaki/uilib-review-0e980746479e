<!-- PRINT-05-2 -->
<style>
.p-PRINT-05-2{display:grid;gap:var(--space-4)}.p-PRINT-05-2 [hidden]{display:none}.p-PRINT-05-2 .top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--space-3)}.p-PRINT-05-2 .f{display:grid;gap:var(--space-1);font-size:var(--font-size-sm);color:var(--color-text-muted)}.p-PRINT-05-2 select{min-height:var(--size-control-sm);padding:0 var(--space-2);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-bg);color:var(--color-text);font-size:var(--font-size-sm)}.p-PRINT-05-2 .chg{padding:var(--space-0-5) var(--space-2);border:var(--border-width-thin) solid var(--color-warning-border);border-radius:var(--radius-full);background:var(--color-warning-subtle);color:var(--color-warning);font-size:var(--font-size-xs)}.p-PRINT-05-2 .body{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--space-16)*3.5),1fr));gap:var(--space-4);align-items:start}.p-PRINT-05-2 .groups{display:grid;gap:var(--space-2)}.p-PRINT-05-2 fieldset{margin:0;padding:var(--space-1) var(--space-3) var(--space-3);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-md);display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-4)}.p-PRINT-05-2 legend{padding:0 var(--space-1);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold)}.p-PRINT-05-2 .groups .f{display:flex;align-items:center;gap:var(--space-2)}.p-PRINT-05-2 .ck{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-sm)}.p-PRINT-05-2 .ck input{margin:0;accent-color:var(--color-brand)}.p-PRINT-05-2 .ck:has(input:disabled){color:var(--color-disabled-text)}.p-PRINT-05-2 .pv{margin:0;display:grid;gap:var(--space-2)}.p-PRINT-05-2 .sheet{display:grid;place-items:center;padding:var(--space-4);border-radius:var(--radius-md);background:var(--color-surface)}.p-PRINT-05-2 .frame{position:relative;padding:var(--space-5)}.p-PRINT-05-2 .bd{padding:var(--space-2);border:var(--border-width-thin) dashed var(--color-danger);background:var(--color-brand-subtle);transition:padding var(--duration-normal) var(--ease-standard)}.p-PRINT-05-2 .pv[data-bleed='0'] .bd{padding:0;border-color:transparent}.p-PRINT-05-2 .pv[data-bleed='5'] .bd{padding:var(--space-3)}.p-PRINT-05-2 .trim{display:grid;align-content:start;gap:var(--space-2);width:calc(var(--space-16)*1.75);aspect-ratio:1/1.414;padding:var(--space-3);border:var(--border-width-thin) solid var(--color-text-muted);background:var(--color-bg);transition:filter var(--duration-normal) var(--ease-standard)}.p-PRINT-05-2 .trim .hd{height:var(--space-3);border-radius:var(--radius-xs);background:var(--color-brand)}.p-PRINT-05-2 .trim .ln{height:var(--space-1);border-radius:var(--radius-xs);background:var(--color-warning-border)}.p-PRINT-05-2 .trim .ln:last-child{width:60%}.p-PRINT-05-2 .pv[data-color='gray'] .trim{filter:grayscale(1)}.p-PRINT-05-2 .m{position:absolute;width:var(--space-4);height:var(--space-4);border:0 solid var(--color-text)}.p-PRINT-05-2 .tl{top:0;left:0;border-right-width:var(--border-width-thin);border-bottom-width:var(--border-width-thin)}.p-PRINT-05-2 .tr{top:0;right:0;border-left-width:var(--border-width-thin);border-bottom-width:var(--border-width-thin)}.p-PRINT-05-2 .bl{bottom:0;left:0;border-right-width:var(--border-width-thin);border-top-width:var(--border-width-thin)}.p-PRINT-05-2 .br{bottom:0;right:0;border-left-width:var(--border-width-thin);border-top-width:var(--border-width-thin)}.p-PRINT-05-2 .c{position:absolute;left:50%;width:var(--border-width-thin);height:var(--space-3);background:var(--color-text)}.p-PRINT-05-2 .ct{top:0}.p-PRINT-05-2 .cb{bottom:0}.p-PRINT-05-2 .pv[data-marks='off'] .m,.p-PRINT-05-2 .pv[data-marks='off'] .c,.p-PRINT-05-2 .pv[data-center='off'] .c{display:none}.p-PRINT-05-2 figcaption{font-size:var(--font-size-xs);color:var(--color-text-muted);text-align:center}.p-PRINT-05-2 .foot{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3)}.p-PRINT-05-2 .go{min-height:var(--size-control-md);padding:0 var(--space-5);border:0;border-radius:var(--radius-md);background:var(--color-brand);color:var(--color-on-brand);font-weight:var(--font-weight-bold);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-PRINT-05-2 .go:hover{background:var(--color-brand-hover)}.p-PRINT-05-2 .go:active{background:var(--color-brand-active)}.p-PRINT-05-2 .st{margin:0;font-size:var(--font-size-sm);color:var(--color-success)}
</style>
<div class='p-PRINT-05-2'><div class='top'><label class='f'><span>出発点のプリセット</span><select class='ps'><option value='print'>印刷用</option><option value='web'>Web用</option></select></label><span class='chg' hidden>プリセットから変更あり</span></div><div class='body'><div class='groups'><fieldset><legend>トンボ</legend><label class='ck'><input type='checkbox' name='marks' checked>トンボを付ける</label><label class='ck'><input type='checkbox' name='center' checked>センタートンボ</label></fieldset><fieldset><legend>塗り足し</legend><label class='f'><span>上下左右</span><select name='bleed'><option value='0'>0mm</option><option value='3' selected>3mm</option><option value='5'>5mm</option></select></label></fieldset><fieldset><legend>色の変換</legend><label class='f'><span>変換先</span><select name='color'><option value='none'>変換しない</option><option value='cmyk' selected>CMYK</option><option value='gray'>グレースケール</option></select></label></fieldset><fieldset><legend>画像</legend><label class='f'><span>解像度</span><select name='dpi'><option value='150'>150dpi</option><option value='350' selected>350dpi</option></select></label></fieldset><fieldset><legend>フォント</legend><label class='ck'><input type='checkbox' name='embed' checked>すべて埋め込む</label></fieldset></div><figure class='pv' data-bleed='3' data-marks='on' data-center='on' data-color='cmyk'><div class='sheet'><div class='frame'><i class='m tl'></i><i class='m tr'></i><i class='m bl'></i><i class='m br'></i><i class='c ct'></i><i class='c cb'></i><div class='bd'><div class='trim'><span class='hd'></span><span class='ln'></span><span class='ln'></span></div></div></div></div><figcaption>仕上がり見本（赤の破線が塗り足し）</figcaption></figure></div><div class='foot'><button type='button' class='go'>PDFを書き出す</button><p class='st' role='status' aria-live='polite'></p></div></div>
<script>
(function(){var r=document.querySelector('.p-PRINT-05-2');if(!r)return;var P={print:{marks:true,center:true,bleed:'3',color:'cmyk',dpi:'350',embed:true},web:{marks:false,center:false,bleed:'0',color:'none',dpi:'150',embed:true}};var ps=r.querySelector('.ps'),pv=r.querySelector('.pv'),chg=r.querySelector('.chg'),st=r.querySelector('.st');function el(n){return r.querySelector('[name='+n+']')}function val(n){var e=el(n);return e.type==='checkbox'?e.checked:e.value}function sync(){var p=P[ps.value],d=false;Object.keys(p).forEach(function(k){if(val(k)!==p[k])d=true});chg.hidden=!d;el('center').disabled=!val('marks');pv.dataset.bleed=val('bleed');pv.dataset.marks=val('marks')?'on':'off';pv.dataset.center=val('center')?'on':'off';pv.dataset.color=val('color');st.textContent=''}ps.addEventListener('change',function(){var p=P[ps.value];Object.keys(p).forEach(function(k){var e=el(k);if(e.type==='checkbox')e.checked=p[k];else e.value=p[k]});sync()});r.querySelector('.groups').addEventListener('change',sync);r.querySelector('.go').addEventListener('click',function(){var c={none:'色変換なし',cmyk:'CMYK',gray:'グレースケール'}[val('color')];st.textContent='塗り足し'+val('bleed')+'mm・'+c+'・'+(val('marks')?'トンボあり':'トンボなし')+'で書き出しを受け付けました'});sync()})();
</script>
