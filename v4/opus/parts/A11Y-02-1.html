<div class='p-A11Y-02-1'><div class='sc' tabindex='0' role='region' aria-label='記事'><article class='art'><h3 class='h seg'>台風への備え</h3><p class='seg'>窓や雨戸を早めに閉めましょう。</p><p class='seg'>飲み水と食べ物を三日分用意します。</p><p class='seg'>避難の情報は市のサイトで確認できます。</p><p class='seg'>近所の人とも声をかけ合いましょう。</p></article><div class='pb' role='group' aria-label='読み上げプレーヤー'><button type='button' class='cb rw' aria-label='前の段落へ'><svg class='f' viewBox='0 0 24 24' aria-hidden='true'><path d='M11 6v12L3 12zM20 6v12l-8-6z'/></svg></button><button type='button' class='cb pp' aria-label='再生'><svg class='f i-play' viewBox='0 0 24 24' aria-hidden='true'><path d='M8 5v14l11-7z'/></svg><svg class='f i-pause' viewBox='0 0 24 24' aria-hidden='true'><path d='M7 5h4v14H7zM13 5h4v14h-4z'/></svg></button><button type='button' class='cb stp' aria-label='停止'><svg class='f' viewBox='0 0 24 24' aria-hidden='true'><path d='M6 6h12v12H6z'/></svg></button><button type='button' class='cb ff' aria-label='次の段落へ'><svg class='f' viewBox='0 0 24 24' aria-hidden='true'><path d='M4 6v12l8-6zM13 6v12l8-6z'/></svg></button><span class='pos' aria-live='polite'>停止中</span><label class='vol'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M4 9v6h4l5 4V5L8 9H4zM16 9a4 4 0 0 1 0 6'/></svg><span class='sr'>音量</span><input type='range' min='0' max='1' step='0.1' value='0.8'></label><label class='spd'><span class='sr'>速度</span><select><option value='0.75'>0.75倍</option><option value='1' selected>1倍</option><option value='1.25'>1.25倍</option><option value='1.5'>1.5倍</option></select></label><p class='na' hidden>この環境では読み上げを使えません。</p></div></div></div>
<script>
(function(){document.querySelectorAll('.p-A11Y-02-1').forEach(function(r){var ss=window.speechSynthesis,sc=r.querySelector('.sc'),segs=[].slice.call(r.querySelectorAll('.seg')),pp=r.querySelector('.pp'),pos=r.querySelector('.pos'),vol=r.querySelector('.vol input'),spd=r.querySelector('.spd select'),i=0,st='stop',tok=0;if(!ss||!window.SpeechSynthesisUtterance){r.querySelectorAll('.cb,.vol,.spd,.pos').forEach(function(e){e.hidden=true;});r.querySelector('.na').hidden=false;return;}function ui(){pp.setAttribute('aria-label',st==='play'?'一時停止':'再生');pp.classList.toggle('is-play',st==='play');pos.textContent=st==='stop'?'停止中':(st==='pause'?'一時停止中 ':'読み上げ中 ')+(i+1)+'/'+segs.length;segs.forEach(function(s,k){s.classList.toggle('on',st!=='stop'&&k===i);});}function halt(){if(ss.paused)ss.resume();ss.cancel();}function speak(){var my=++tok;halt();var u=new SpeechSynthesisUtterance(segs[i].textContent);u.lang='ja-JP';u.volume=+vol.value;u.rate=+spd.value;u.onstart=function(){if(my!==tok)return;st='play';ui();sc.scrollTop=Math.max(0,segs[i].offsetTop-sc.clientHeight/3);};u.onend=function(){if(my!==tok)return;if(i<segs.length-1){i++;speak();}else{i=0;st='stop';ui();}};u.onerror=function(){if(my!==tok)return;st='stop';ui();pos.textContent='読み上げできませんでした';};ss.speak(u);}pp.addEventListener('click',function(){if(st==='play'){ss.pause();st='pause';ui();}else if(st==='pause'){ss.resume();st='play';ui();}else speak();});r.querySelector('.stp').addEventListener('click',function(){tok++;halt();i=0;st='stop';ui();});r.querySelector('.rw').addEventListener('click',function(){i=Math.max(0,i-1);speak();});r.querySelector('.ff').addEventListener('click',function(){i=Math.min(segs.length-1,i+1);speak();});vol.addEventListener('change',function(){if(st==='play')speak();});spd.addEventListener('change',function(){if(st==='play')speak();});});})();
</script>
