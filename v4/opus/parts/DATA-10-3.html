uccess)}.p-DATA-10-3 .wn{background:var(--color-warning-subtle);border-left-color:var(--color-warning)!important}.p-DATA-10-3 .wn .ic,.p-DATA-10-3 .wn .tm small{color:var(--color-warning)}.p-DATA-10-3 .er{background:var(--color-danger-subtle);border-left-color:var(--color-danger)!important}.p-DATA-10-3 .er .ic,.p-DATA-10-3 .er .tm small{color:var(--color-danger)}.p-DATA-10-3 .nm,.p-DATA-10-3 .tm{display:flex;flex-direction:column;min-width:0}.p-DATA-10-3 .nm small,.p-DATA-10-3 .tm small{font-size:var(--font-size-xs);color:var(--color-text-muted)}.p-DATA-10-3 .wn .tm small,.p-DATA-10-3 .er .tm small{font-weight:var(--font-weight-bold)}.p-DATA-10-3 .tm{align-items:flex-end;text-align:right}.p-DATA-10-3 .tm time{font-weight:var(--font-weight-medium);font-variant-numeric:tabular-nums;white-space:nowrap}.p-DATA-10-3 .rt{height:var(--size-control-sm);padding:0 var(--space-3);border:var(--border-width-thin) solid var(--color-danger-border);border-radius:var(--radius-sm);background:var(--color-bg);color:var(--color-danger);font-weight:var(--font-weight-medium);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-DATA-10-3 .rt:hover{background:var(--color-danger-subtle)}.p-DATA-10-3 .rt:disabled{background:var(--color-disabled-bg);border-color:var(--color-disabled-border);color:var(--color-disabled-text);cursor:progress}

(function(){document.querySelectorAll('.p-DATA-10-3').forEach(function(r){r.addEventListener('click',function(e){var b=e.target.closest('.rt');if(!b||!r.contains(b))return;var li=b.closest('li');b.disabled=true;b.textContent='取得中';setTimeout(function(){li.className='ok';li.querySelector('.ic').innerHTML=r.querySelector('.ok .ic').innerHTML;li.querySelector('.tm time').textContent='10:30';li.querySelector('.tm small').textContent='たった今';b.remove();var sm=r.querySelector('.sm'),c=sm.querySelector('.er');if(c)c.remove();if(!sm.querySelector('.c')){var s=document.createElement('span');s.className='c ok';s.textContent='すべて正常';sm.appendChild(s)}},960)})})})();
