<section class="p-COPY-06-2"><h3 class="ttl">お問い合わせを受け付けました</h3><div class="ref"><div><p class="lbl">受付番号</p><p class="num"><code>A-2611-0815</code></p></div><button class="copy" type="button" aria-live="polite">番号をコピー</button></div><p class="why">この番号は、あなたのお問い合わせを探すための番号です。電話で状況を確かめるときに必要になるので、控えておいてください。確認メールにも同じ番号を記載しています。</p></section>
<script>
(function(){document.querySelectorAll('.p-COPY-06-2').forEach(function(r){var b=r.querySelector('.copy'),n=r.querySelector('.num').textContent;b.addEventListener('click',function(){function ok(){b.textContent='コピーしました';b.setAttribute('data-done','');}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(n).then(ok,ok);}else{ok();}});});})();
</script>
