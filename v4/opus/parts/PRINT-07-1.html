d);color:var(--color-brand)}.p-PRINT-07-1 .sheet[data-side='back'] .lb{background:var(--color-success-subtle);border-color:var(--color-success-border);color:var(--color-success)}.p-PRINT-07-1 .no{position:absolute;top:var(--space-0-5);left:var(--space-1);font-size:var(--font-size-xs);font-weight:var(--font-weight-regular);color:var(--color-text-muted)}.p-PRINT-07-1 .sheet[data-range='half'] .lb:nth-child(n+5){background:transparent;border-style:dashed;border-color:var(--color-border)}.p-PRINT-07-1 .sheet[data-range='half'] .lb:nth-child(n+5) .t{visibility:hidden}.p-PRINT-07-1 .sheet.test{background:var(--color-surface)}.p-PRINT-07-1 .sheet.test .lb{background:var(--color-bg);border-color:var(--color-text);border-style:solid}.p-PRINT-07-1 .sheet.test .t{visibility:hidden}.p-PRINT-07-1 .sheet.test .lb::before,.p-PRINT-07-1 .sheet.test .lb::after{content:'';position:absolute;background:var(--color-danger)}.p-PRINT-07-1 .sheet.test .lb::before{left:50%;top:25%;bottom:25%;width:var(--border-width-thin)}.p-PRINT-07-1 .sheet.test .lb::after{top:50%;left:35%;right:35%;height:var(--border-width-thin)}.p-PRINT-07-1 .sheet.test[data-range='half'] .lb:nth-child(n+5)::before,.p-PRINT-07-1 .sheet.test[data-range='half'] .lb:nth-child(n+5)::after{display:none}.p-PRINT-07-1 .sheet.test[data-range='half'] .lb:nth-child(n+5){border-style:dashed;border-color:var(--color-border)}.p-PRINT-07-1 .sr{position:absolute;width:var(--border-width-thin);height:var(--border-width-thin);overflow:hidden;clip-path:inset(50%);white-space:nowrap}

<div class='p-PRINT-07-1'><div class='cfg'><label class='f act'><span class='fl'>表面の文字</span><input type='text' class='tx' data-side='front' value='山田商店' maxlength='10'></label><label class='f'><span class='fl'>裏面の文字</span><input type='text' class='tx' data-side='back' value='ありがとう' maxlength='10'></label><fieldset class='seg'><legend>印刷範囲</legend><label><input type='radio' name='r0701' value='all' checked>全面</label><label><input type='radio' name='r0701' value='half'>上半分</label></fieldset><fieldset class='seg'><legend>印刷する面</legend><label><input type='radio' name='s0701' value='front' checked>表面</label><label><input type='radio' name='s0701' value='back'>裏面</label></fieldset><div class='adj'><span class='fl'>位置の調整</span><div class='pad'><button type='button' class='u' data-d='0,-1' aria-label='上へ0.5mm'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M6 15l6-6 6 6'/></svg></button><button type='button' class='l' data-d='-1,0' aria-label='左へ0.5mm'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M6 15l6-6 6 6'/></svg></button><button type='button' class='c' data-d='0,0' aria-label='位置を戻す'>0</button><button type='button' class='rr' data-d='1,0' aria-label='右へ0.5mm'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M6 15l6-6 6 6'/></svg></button><button type='button' class='dn' data-d='0,1' aria-label='下へ0.5mm'><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M6 15l6-6 6 6'/></svg></button></div><output class='ofs' aria-live='polite'>上下 0mm・左右 0mm</output></div><button type='button' class='btn tst' aria-pressed='false'>テスト用紙で確認</button></div><div class='sheet' data-side='front' data-range='all'><span class='tag'>表面</span><div class='grid'><div class='lb'><span class='no'>1</span><span class='t'>山田商店</span></div><div class='lb'><span class='no'>2</span><span class='t'>山田商店</span></div><div class='lb'><span class='no'>3</span><span class='t'>山田商店</span></div><div class='lb'><span class='no'>4</span><span class='t'>山田商店</span></div><div class='lb'><span class='no'>5</span><span class='t'>山田商店</span></div><div class='lb'><span class='no'>6</span><span class='t'>山田商店</span></div><div class='lb'><span class='no'>7</span><span class='t'>山田商店</span></div><div class='lb'><span class='no'>8</span><span class='t'>山田商店</span></div></div></div><p class='sr' role='status' aria-live='polite'></p></div>
<script>
(function(){var r=document.querySelector('.p-PRINT-07-1');if(!r)return;var sh=r.querySelector('.sheet'),g=r.querySelector('.grid'),tag=r.querySelector('.tag'),ofs=r.querySelector('.ofs'),st=r.querySelector('.sr'),tst=r.querySelector('.tst'),x=0,y=0;function side(){return r.querySelector('[name=s0701]:checked').value}function render(){var s=side(),t=r.querySelector('.tx[data-side='+s+']').value;sh.dataset.side=s;sh.dataset.range=r.querySelector('[name=r0701]:checked').value;tag.textContent=(sh.classList.contains('test')?'テスト用紙・':'')+(s==='front'?'表面':'裏面（左右反転）');g.querySelectorAll('.t').forEach(function(e){e.textContent=t});r.querySelectorAll('.tx').forEach(function(i){i.closest('.f').classList.toggle('act',i.dataset.side===s)})}function mm(v){return(v>0?'+':'')+v*0.5+'mm'}r.addEventListener('input',render);r.addEventListener('change',function(e){render();if(e.target.name==='s0701')st.textContent=side()==='front'?'表面を表示しています':'裏面を表示しています。面の並びは左右が反転します';if(e.target.name==='r0701')st.textContent=e.target.value==='all'?'全8面に複写します':'上半分の4面だけに複写します'});r.querySelectorAll('.pad button').forEach(function(b){b.addEventListener('click',function(){var d=b.dataset.d.split(',').map(Number);if(!d[0]&&!d[1]){x=0;y=0}else{x=Math.max(-4,Math.min(4,x+d[0]));y=Math.max(-4,Math.min(4,y+d[1]))}g.style.setProperty('--x',x);g.style.setProperty('--y',y);ofs.textContent='上下 '+mm(y)+'・左右 '+mm(x)})});tst.addEventListener('click',function(){var on=tst.getAttribute('aria-pressed')!=='true';tst.setAttribute('aria-pressed',String(on));sh.classList.toggle('test',on);render();st.textContent=on?'テスト用紙の見本：枠と中心線だけを表示しています':'デザインの表示に戻しました'});render()})();
</script>
