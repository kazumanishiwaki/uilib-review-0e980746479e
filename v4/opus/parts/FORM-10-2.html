<script>
(function(){var C={JP:['日本','+81','090-1234-5678'],US:['アメリカ','+1','(201) 555-0123'],GB:['イギリス','+44','07400 123456'],FR:['フランス','+33','06 12 34 56 78'],DE:['ドイツ','+49','01512 3456789']},P=[['+44','GB'],['+49','DE'],['+33','FR'],['+81','JP'],['+1','US']];document.querySelectorAll('.p-FORM-10-2').forEach(function(r){var num=r.querySelector('.num'),fl=r.querySelector('.det .flag'),cd=r.querySelector('.code'),tx=r.querySelector('.tx'),sel=r.querySelector('.sel'),det=r.querySelector('.det');function set(c,msg,fx){var x=C[c];fl.innerHTML=r.querySelector('.src [data-c='+c+']').innerHTML;cd.textContent=x[1];num.placeholder=x[2];sel.value=c;tx.textContent=msg;det.classList.remove('is-flash');if(fx){void det.offsetWidth;det.classList.add('is-flash')}}var lg=(navigator.language||'ja-JP').split('-'),rg=lg[1]?lg[1].toUpperCase():'',c0=C[rg]?rg:(({ja:'JP',en:'US',fr:'FR',de:'DE'})[lg[0]]||'JP');set(c0,'お使いの環境から'+C[c0][0]+'と判定しました',false);num.addEventListener('input',function(){var v=num.value.replace(/^＋/,'+');if(v.charAt(0)!=='+')return;for(var i=0;i<P.length;i++){if(v.indexOf(P[i][0])===0&&v.length>P[i][0].length){num.value=v.slice(P[i][0].length).replace(/^[ -]+/,'');set(P[i][1],'国番号 '+P[i][0]+' から'+C[P[i][1]][0]+'と判定しました',true);return}}});sel.addEventListener('change',function(){set(sel.value,C[sel.value][0]+'に変更しました',true);num.focus()})})})();
