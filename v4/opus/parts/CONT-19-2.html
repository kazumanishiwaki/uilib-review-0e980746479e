<div class="p-CONT-19-2"><article class="doc"><h3 class="h">在宅勤務の広がり</h3><p class="p">週1日以上在宅で働く人は、2025年に全体の28%となった<sup class="ref"><a href="#p-CONT-19-2-n1" id="p-CONT-19-2-r1" aria-label="出典1へ">1</a></sup>。情報通信業では半数を超える<sup class="ref"><a href="#p-CONT-19-2-n2" id="p-CONT-19-2-r2" aria-label="出典2へ">2</a></sup>。</p><p class="p">一方、従業員100人未満の企業では導入が2割にとどまる<sup class="ref"><a href="#p-CONT-19-2-n1" aria-label="出典1へ">1</a></sup><sup class="ref"><a href="#p-CONT-19-2-n3" id="p-CONT-19-2-r3" aria-label="出典3へ">3</a></sup>。</p><section class="notes" aria-labelledby="p-CONT-19-2-nh"><h4 class="nh" id="p-CONT-19-2-nh">出典</h4><ol class="list"><li id="p-CONT-19-2-n1"><span class="tx">国土交通省「テレワーク人口実態調査」2025年3月</span><a class="back" href="#p-CONT-19-2-r1" aria-label="本文の注1へ戻る">↩</a></li><li id="p-CONT-19-2-n2"><span class="tx">総務省「情報通信白書」2025年版 第2章</span><a class="back" href="#p-CONT-19-2-r2" aria-label="本文の注2へ戻る">↩</a></li><li id="p-CONT-19-2-n3"><span class="tx">日本商工会議所「中小企業の働き方調査」2025年</span><a class="back" href="#p-CONT-19-2-r3" aria-label="本文の注3へ戻る">↩</a></li></ol></section></article></div>
