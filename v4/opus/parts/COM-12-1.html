<!-- COM-12-1 -->
<style>
.p-COM-12-1 .card{max-width:calc(var(--space-16) * 8);overflow:hidden;border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-bg)}.p-COM-12-1 .next{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-1) var(--space-3);padding:var(--space-4) var(--space-5);border-bottom:var(--border-width-thin) solid var(--color-brand-border);background:var(--color-brand-subtle)}.p-COM-12-1 .nlabel{width:100%;margin:0;font-size:var(--font-size-xs);font-weight:var(--font-weight-bold);letter-spacing:var(--letter-spacing-wide);color:var(--color-brand)}.p-COM-12-1 .ndate{margin:0;font-size:var(--font-size-3xl);font-weight:var(--font-weight-bold);line-height:var(--line-height-tight);letter-spacing:var(--letter-spacing-tight)}.p-COM-12-1 .nstate{margin:0;padding:0 var(--space-2);border-radius:var(--radius-xs);background:var(--color-surface-strong);font-size:var(--font-size-xs);font-weight:var(--font-weight-bold);color:var(--color-text-muted)}.p-COM-12-1 .card.is-paused .next{border-color:var(--color-border);background:var(--color-surface)}.p-COM-12-1 .card.is-paused .nlabel{color:var(--color-text-muted)}.p-COM-12-1 .card.is-paused .ndate{color:var(--color-disabled-text);text-decoration:line-through}.p-COM-12-1 .body{padding:var(--space-4) var(--space-5) 0}.p-COM-12-1 .name{margin:0 0 var(--space-2);font-size:var(--font-size-md);font-weight:var(--font-weight-bold);line-height:var(--line-height-snug)}.p-COM-12-1 .meta{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-6);margin:0;font-size:var(--font-size-sm)}.p-COM-12-1 .meta div{display:flex;gap:var(--space-2)}.p-COM-12-1 .meta dt{color:var(--color-text-muted)}.p-COM-12-1 .meta dd{margin:0;font-weight:var(--font-weight-medium)}.p-COM-12-1 .acts,.p-COM-12-1 .erow{display:flex;flex-wrap:wrap;gap:var(--space-2)}.p-COM-12-1 .acts,.p-COM-12-1 .resume{padding:var(--space-4) var(--space-5)}.p-COM-12-1 .btn{min-height:var(--size-control-md);padding:0 var(--space-4);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-bg);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-COM-12-1 .btn:hover{background:var(--color-surface-strong)}.p-COM-12-1 .danger{border-color:var(--color-danger-border);color:var(--color-danger)}.p-COM-12-1 .danger:hover{background:var(--color-danger-subtle)}.p-COM-12-1 .fill{border-color:var(--color-brand);background:var(--color-brand);color:var(--color-on-brand)}.p-COM-12-1 .fill:hover{background:var(--color-brand-hover)}.p-COM-12-1 .dfill{border-color:var(--color-danger);background:var(--color-danger);color:var(--color-on-status)}.p-COM-12-1 .dfill:hover{background:var(--color-danger-hover)}.p-COM-12-1 .box{display:grid;gap:var(--space-3);margin:0 var(--space-5) var(--space-4);padding:var(--space-4);border-radius:var(--radius-md);background:var(--color-surface)}.p-COM-12-1 .warn{background:var(--color-danger-subtle)}.p-COM-12-1 .f{display:grid;gap:var(--space-1)}.p-COM-12-1 .f label{font-size:var(--font-size-xs);font-weight:var(--font-weight-bold)}.p-COM-12-1 .input{width:100%;min-height:var(--size-control-md);padding:0 var(--space-3);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-bg)}.p-COM-12-1 .ctext{margin:0;font-size:var(--font-size-sm);font-weight:var(--font-weight-medium)}.p-COM-12-1 .vh{position:absolute;width:var(--border-width-thin);height:var(--border-width-thin);overflow:hidden;clip-path:inset(50%);white-space:nowrap}.p-COM-12-1 [hidden]{display:none !important}
</style>
<div class='p-COM-12-1'><article class='card' aria-labelledby='c1201-t'><div class='next'><p class='nlabel'>次回お届け</p><p class='ndate' data-date>11月20日（金）</p><p class='nstate' data-state hidden>停止中</p></div><div class='body'><h3 id='c1201-t' class='name'>コーヒー豆 200g（中煎り）</h3><dl class='meta'><div><dt>頻度</dt><dd data-freq>1か月ごと</dd></div><div><dt>数量</dt><dd data-qty>2袋</dd></div><div><dt>1回あたり</dt><dd data-price>¥3,240</dd></div></dl></div><div class='acts' data-acts><button type='button' class='btn' data-edit aria-expanded='false' aria-controls='c1201-edit'>変更</button><button type='button' class='btn' data-skip>次回をスキップ</button><button type='button' class='btn danger' data-stop>停止</button></div><form class='box' id='c1201-edit' data-form hidden><div class='f'><label for='c1201-freq'>お届けの頻度</label><select id='c1201-freq' name='freq' class='input'><option value='2w'>2週間ごと</option><option value='1m' selected>1か月ごと</option><option value='2m'>2か月ごと</option></select></div><div class='f'><label for='c1201-qty'>数量</label><select id='c1201-qty' name='qty' class='input'><option value='1'>1袋</option><option value='2' selected>2袋</option><option value='3'>3袋</option><option value='4'>4袋</option></select></div><div class='erow'><button type='submit' class='btn fill'>保存</button><button type='button' class='btn' data-cancel>キャンセル</button></div></form><div class='box warn' data-confirm hidden><p class='ctext'>定期便を停止しますか？ 再開はいつでもできます。</p><div class='erow'><button type='button' class='btn dfill' data-yes>停止する</button><button type='button' class='btn' data-no>やめる</button></div></div><div class='resume' data-resume hidden><button type='button' class='btn fill'>再開する</button></div><p class='vh' role='status' data-status></p></article></div>
<script>
(function(){var r=document.querySelector('.p-COM-12-1');if(!r)return;var W='日月火水木金土',d=new Date(2026,10,20),freq='1m',qty=2,UNIT=1620,FL={'2w':'2週間ごと','1m':'1か月ごと','2m':'2か月ごと'},q=function(s){return r.querySelector(s);},card=q('.card'),acts=q('[data-acts]'),form=q('[data-form]'),conf=q('[data-confirm]'),res=q('[data-resume]'),resBtn=res.querySelector('button'),edit=q('[data-edit]'),st=q('[data-status]');function fmt(x){return (x.getMonth()+1)+'月'+x.getDate()+'日（'+W[x.getDay()]+'）';}function next(x){var y=new Date(x);if(freq==='2w')y.setDate(y.getDate()+14);else y.setMonth(y.getMonth()+(freq==='2m'?2:1));return y;}function paint(){q('[data-date]').textContent=fmt(d);q('[data-freq]').textContent=FL[freq];q('[data-qty]').textContent=qty+'袋';q('[data-price]').textContent='¥'+(UNIT*qty).toLocaleString('ja-JP');}function closeForm(){form.hidden=true;edit.setAttribute('aria-expanded','false');}edit.addEventListener('click',function(){if(!form.hidden){closeForm();return;}conf.hidden=true;form.hidden=false;edit.setAttribute('aria-expanded','true');form.elements.freq.value=freq;form.elements.qty.value=String(qty);form.elements.freq.focus();});form.addEventListener('submit',function(e){e.preventDefault();freq=form.elements.freq.value;qty=+form.elements.qty.value;paint();closeForm();edit.focus();st.textContent='変更を保存しました。'+FL[freq]+'・'+qty+'袋です';});q('[data-cancel]').addEventListener('click',function(){closeForm();edit.focus();});q('[data-skip]').addEventListener('click',function(){var was=fmt(d);d=next(d);paint();st.textContent=was+'のお届けをスキップしました。次回は'+fmt(d)+'です';});q('[data-stop]').addEventListener('click',function(){closeForm();conf.hidden=false;q('[data-yes]').focus();});q('[data-no]').addEventListener('click',function(){conf.hidden=true;q('[data-stop]').focus();});q('[data-yes]').addEventListener('click',function(){conf.hidden=true;acts.hidden=true;card.classList.add('is-paused');q('[data-state]').hidden=false;res.hidden=false;resBtn.focus();st.textContent='定期便を停止しました';});resBtn.addEventListener('click',function(){card.classList.remove('is-paused');q('[data-state]').hidden=true;res.hidden=true;acts.hidden=false;edit.focus();st.textContent='定期便を再開しました。次回は'+fmt(d)+'です';});paint();})();
</script>
