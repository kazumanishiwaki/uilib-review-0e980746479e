<!-- PRINT-07-2 -->
<style>
.p-PRINT-07-2{display:flex;flex-wrap:wrap;gap:var(--space-5);align-items:flex-start}.p-PRINT-07-2 .cfg{flex:1 1 calc(var(--space-16)*3);display:grid;gap:var(--space-3)}.p-PRINT-07-2 .f{display:grid;gap:var(--space-1);font-size:var(--font-size-sm);color:var(--color-text-muted)}.p-PRINT-07-2 input{width:calc(var(--space-16)*1.5);min-height:var(--size-control-md);padding:0 var(--space-2);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-bg);color:var(--color-text);font-size:var(--font-size-md)}.p-PRINT-07-2 .msg{margin:0;padding:var(--space-2) var(--space-3);border-left:var(--border-width-thick) solid var(--color-brand);background:var(--color-brand-subtle);font-size:var(--font-size-sm)}.p-PRINT-07-2 .msg.warn{border-color:var(--color-warning);background:var(--color-warning-subtle)}.p-PRINT-07-2 .sheet{flex:1 1 calc(var(--space-16)*3.5);max-width:calc(var(--space-16)*4.5);padding:var(--space-3);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:var(--shadow-sm)}.p-PRINT-07-2 .cap{margin:0 0 var(--space-2);font-size:var(--font-size-xs);color:var(--color-text-muted)}.p-PRINT-07-2 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)}.p-PRINT-07-2 .cell{position:relative;display:grid;place-items:center;aspect-ratio:3/2;padding:0;border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-bg);font-size:var(--font-size-xs);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-PRINT-07-2 .cell .n{position:absolute;top:var(--space-0-5);left:var(--space-1);color:var(--color-text-muted)}.p-PRINT-07-2 .cell.used,.p-PRINT-07-2 .k.used{background:repeating-linear-gradient(135deg,var(--color-border-strong) 0 var(--border-width-thin),var(--color-surface-strong) var(--border-width-thin) var(--space-2));border-color:var(--color-border)}.p-PRINT-07-2 .cell.pr,.p-PRINT-07-2 .k.pr{background:var(--color-brand-subtle);border-color:var(--color-brand);color:var(--color-brand);font-weight:var(--font-weight-bold)}.p-PRINT-07-2 .cell.fr:hover{background:var(--color-surface)}.p-PRINT-07-2 .cell[aria-pressed='true']{box-shadow:inset 0 0 0 var(--border-width-medium) var(--color-brand)}.p-PRINT-07-2 .cell:focus-visible{box-shadow:var(--focus-ring)}.p-PRINT-07-2 .lgd{list-style:none;margin:var(--space-3) 0 0;padding:0;display:flex;flex-wrap:wrap;gap:var(--space-3);font-size:var(--font-size-xs);color:var(--color-text-muted)}.p-PRINT-07-2 .lgd li{display:inline-flex;align-items:center;gap:var(--space-1)}.p-PRINT-07-2 .k{width:var(--space-4);height:var(--space-3);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-xs);background:var(--color-bg)}
</style>
<div class='p-PRINT-07-2'><div class='cfg'><label class='f'><span>開始位置（何面目から）</span><input type='number' class='start' min='1' max='12' value='5'></label><label class='f'><span>印刷する面の数</span><input type='number' class='cnt' min='1' max='12' value='3'></label><p class='msg' role='status' aria-live='polite'></p></div><div class='sheet'><p class='cap' id='c0702'>見本の面を選んでも開始位置を指定できます</p><div class='grid' role='group' aria-labelledby='c0702'></div><ul class='lgd'><li><i class='k used'></i>使用済み</li><li><i class='k pr'></i>今回印刷</li><li><i class='k fr'></i>空き</li></ul></div></div>
<script>
(function(){var r=document.querySelector('.p-PRINT-07-2');if(!r)return;var g=r.querySelector('.grid'),si=r.querySelector('.start'),ci=r.querySelector('.cnt'),msg=r.querySelector('.msg'),N=12,cells=[];for(var i=1;i<=N;i++){var b=document.createElement('button');b.type='button';b.className='cell';b.dataset.i=i;b.innerHTML='<span class=n></span><span class=lbl></span>';b.querySelector('.n').textContent=i;g.appendChild(b);cells.push(b)}function render(){var s=Math.max(1,Math.min(N,Math.round(+si.value)||1)),want=Math.max(1,Math.round(+ci.value)||1),c=Math.min(want,N-s+1);cells.forEach(function(b,k){var i=k+1,st=i<s?'used':i<s+c?'pr':'fr';b.className='cell '+st;b.setAttribute('aria-pressed',String(i===s));b.querySelector('.lbl').textContent=st==='pr'?'印刷':'';b.setAttribute('aria-label',i+'面目・'+{used:'使用済み',pr:'今回印刷',fr:'空き'}[st])});var t=s+'面目から'+c+'面を印刷します（使用済み '+(s-1)+'面は飛ばします）';if(c<want)t+='。この用紙の残りは'+c+'面です';msg.textContent=t;msg.classList.toggle('warn',c<want)}g.addEventListener('click',function(e){var b=e.target.closest('.cell');if(!b)return;si.value=b.dataset.i;render()});g.addEventListener('keydown',function(e){var b=e.target.closest('.cell');if(!b)return;var d={ArrowRight:1,ArrowLeft:-1,ArrowDown:3,ArrowUp:-3}[e.key];if(!d)return;var n=cells[+b.dataset.i-1+d];if(n){n.focus();e.preventDefault()}});si.addEventListener('input',render);ci.addEventListener('input',render);render()})();
</script>
