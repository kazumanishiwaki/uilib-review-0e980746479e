<!-- TOOL-01-2 -->
<style>
.p-TOOL-01-2{display:grid;gap:var(--space-2)}.p-TOOL-01-2 [hidden]{display:none}.p-TOOL-01-2 .tb{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--space-2)}.p-TOOL-01-2 .info{display:flex;gap:var(--space-3);margin:0;font-family:var(--font-mono);font-size:var(--font-size-sm)}.p-TOOL-01-2 .sel{color:var(--color-brand)}.p-TOOL-01-2 .acts{display:flex;flex-wrap:wrap;gap:var(--space-1)}.p-TOOL-01-2 .btn{min-height:var(--size-control-sm);padding:0 var(--space-3);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-bg);font-size:var(--font-size-sm);cursor:pointer}.p-TOOL-01-2 .btn:hover:not(:disabled){background:var(--color-surface-strong)}.p-TOOL-01-2 .btn:disabled{background:var(--color-disabled-bg);border-color:var(--color-disabled-border);color:var(--color-disabled-text)}.p-TOOL-01-2 .sil[aria-pressed='true']{border-color:var(--color-warning);background:var(--color-warning-subtle);color:var(--color-warning)}.p-TOOL-01-2 .wv{position:relative;height:calc(var(--space-16)*2.25);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);cursor:text;touch-action:none;user-select:none}.p-TOOL-01-2 .bars{position:absolute;inset:0;display:flex;align-items:center;gap:var(--border-width-thin)}.p-TOOL-01-2 .b{flex:1;min-height:var(--border-width-medium);height:calc(var(--a)*90%);border-radius:var(--radius-xs);background:var(--color-brand)}.p-TOOL-01-2 .wv.qs .b.q{background:var(--color-warning);min-height:var(--space-2)}.p-TOOL-01-2 .rg{position:absolute;top:0;bottom:0;border-left:var(--border-width-medium) solid var(--color-brand);border-right:var(--border-width-medium) solid var(--color-brand);background:var(--color-brand-subtle)}.p-TOOL-01-2 .cur{position:absolute;top:0;bottom:0;width:var(--border-width-medium);background:var(--color-danger);transform:translateX(-50%);pointer-events:none}.p-TOOL-01-2 .help{margin:0 </style>
<div class='p-TOOL-01-2'><div class='tb'><p class='info'><span class='len'>長さ 24.00秒</span><span class='sel'>位置 0.00秒</span></p><div class='acts'><button type='button' class='btn sil' aria-pressed='false'>無音を表示</button><button type='button' class='btn cut' disabled>選択範囲を削除</button><button type='button' class='btn undo' disabled>元に戻す</button></div></div><div class='wv' tabindex='0' role='group' aria-label='音声の波形' aria-describedby='h0102'><div class='rg' hidden></div><div class='bars'></div><div class='cur'></div></div><p class='help' id='h0102'>ドラッグで範囲を選択。キーボードは ←→ で位置、Shift+←→ で範囲選択、Delete で削除</p><p class='sr' role='status' aria-live='polite'></p></div>
<script>
(function(){var r=document.querySelector('.p-TOOL-01-2');if(!r)return;var wv=r.querySelector('.wv'),bars=r.querySelector('.bars'),rg=r.querySelector('.rg'),cu=r.querySelector('.cur'),len=r.querySelector('.len'),sel=r.querySelector('.sel'),cut=r.querySelector('.cut'),undo=r.querySelector('.undo'),sil=r.querySelector('.sil'),st=r.querySelector('.sr'),S=0.25,a=[],hist=[],cur=0,anc=null,lo=0,hi=0,dr=null;(function(){var s=7;for(var i=0;i<96;i++){s=(s*9301+49297)%233280;var q=s/233280,z=(i>=30&&i<38)||(i>=64&&i<71);a.push(z?0.03+q*0.05:0.25+0.65*Math.abs(Math.sin(i*0.45))*(0.6+0.4*q))}})();function f(n){return(n*S).toFixed(2)+'秒'}function render(){bars.textContent='';a.forEach(function(v){var d=document.createElement('div');d.className='b'+(v<0.12?' q':'');d.style.setProperty('--a',v.toFixed(3));bars.appendChild(d)});len.textContent='長さ '+f(a.length);undo.disabled=!hist.length;draw()}function draw(){var N=a.length||1;cu.style.left=cur/N*100+'%';rg.hidden=hi<=lo;rg.style.left=lo/N*100+'%';rg.style.width=(hi-lo)/N*100+'%';cut.disabled=hi<=lo;sel.textContent=hi>lo?'選択 '+f(lo)+'〜'+f(hi)+'（'+f(hi-lo)+'）':'位置 '+f(cur)}function idx(e){var b=wv.getBoundingClientRect();return Math.max(0,Math.min(a.length,Math.round((e.clientX-b.left)/b.width*a.length)))}function span(){lo=Math.min(anc,cur);hi=Math.max(anc,cur)}wv.addEventListener('pointerdown',function(e){dr={lo:lo,hi:hi,cur:cur,anc:anc};wv.setPointerCapture(e.pointerId);anc=cur=idx(e);span();draw()});wv.addEventListener('pointermove',function(e){if(!dr)return;cur=idx(e);span();draw()});wv.addEventListener('pointerup',function(){if(!dr)return;dr=null;if(hi>lo)st.textContent=f(hi-lo)+'を選択しました'});wv.addEventListener('pointercancel',function(){if(!dr)return;lo=dr.lo;hi=dr.hi;cur=dr.cur;anc=dr.anc;dr=null;draw()});function doCut(){if(hi<=lo)return;hist.push(a.slice());var d=hi-lo;a.splice(lo,d);cur=lo;hi=lo;anc=null;render();st.textContent=f(d)+'を削除しました。長さは'+f(a.length)+'です'}wv.addEventListener('keydown',function(e){var d={ArrowRight:1,ArrowLeft:-1}[e.key];if(d){if(e.shiftKey){if(anc===null||hi<=lo)anc=cur;cur=Math.max(0,Math.min(a.length,cur+d));span()}else{cur=Math.max(0,Math.min(a.length,cur+d));anc=null;lo=hi=cur}draw();e.preventDefault()}else if(e.key==='Delete'||e.key==='Backspace'){doCut();e.preventDefault()}});cut.addEventListener('click',doCut);undo.addEventListener('click',function(){if(!hist.length)return;a=hist.pop();lo=hi=cur=Math.min(cur,a.length);anc=null;render();st.textContent='削除を元に戻しました'});sil.addEventListener('click',function(){var on=sil.getAttribute('aria-pressed')!=='true';sil.setAttribute('aria-pressed',String(on));wv.classList.toggle('qs',on);var n=a.filter(function(v){return v<0.12}).length;st.textContent=on?'無音の部分 '+f(n)+'を表示しています':'無音の表示を消しました'});render()})();
</script>
