<style>
.p-LAY-01-5{border-top:var(--border-width-thin) solid var(--color-border)}.p-LAY-01-5 .news{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--space-4) var(--space-8);padding:var(--space-8) var(--space-6)}.p-LAY-01-5 .h{margin:0 0 var(--space-1);font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);line-height:var(--line-height-snug)}.p-LAY-01-5 .sub{margin:0;font-size:var(--font-size-sm);color:var(--color-text-muted)}.p-LAY-01-5 form{flex:1 1 calc(var(--space-16) * 4.5);max-width:calc(var(--space-16) * 6.5)}.p-LAY-01-5 .lbl{display:block;margin-bottom:var(--space-1);font-size:var(--font-size-xs);font-weight:var(--font-weight-bold);color:var(--color-text-muted)}.p-LAY-01-5 .row{display:flex;gap:var(--space-2)}.p-LAY-01-5 input{flex:1;min-width:0;min-height:var(--size-control-lg);padding:0 var(--space-3);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-bg)}.p-LAY-01-5 input[aria-invalid=true]{border-color:var(--color-danger)}.p-LAY-01-5 .btn{flex:none;min-height:var(--size-control-lg);padding:0 var(--space-5);border:0;border-radius:var(--radius-md);background:var(--color-brand);color:var(--color-on-brand);font-weight:var(--font-weight-bold);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-LAY-01-5 .btn:hover{background:var(--color-brand-hover)}.p-LAY-01-5 .btn:active{background:var(--color-brand-active)}.p-LAY-01-5 .msg{min-height:calc(var(--font-size-sm) * 1.5);margin:var(--space-1) 0 0;font-size:var(--font-size-sm);line-height:var(--line-height-snug)}.p-LAY-01-5 .msg.ok{color:var(--color-success)}.p-LAY-01-5 .msg.ng{color:var(--color-danger)}.p-LAY-01-5 .links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--space-2) var(--space-4);padding:var(--space-3) var(--space-6);border-top:var(--border-width-thin) solid var(--color-border);font-size:var(--font-size-xs);line-height:var(--line-height-snug);color:var(--color-text-muted)}.p-LAY-01-5 small{font-size:inherit}.p-LAY-01-5 ul{display:flex;gap:var(--space-4);margin:0;padding:0;list-style:none}.p-LAY-01-5 .links a{color:inherit;text-decoration:none;border-radius:var(--radius-xs)}.p-LAY-01-5 .links a:hover{color:var(--color-text);text-decoration:underline}
</style>
<footer class="p-LAY-01-5"><div class="news"><div class="txt"><p class="h" id="LAY015-h">ニュースレター</p><p class="sub">新しい講座の案内を月1回お届けします。</p></div><form novalidate aria-labelledby="LAY015-h"><label class="lbl" for="LAY015-mail">メールアドレス</label><div class="row"><input id="LAY015-mail" type="email" name="email" autocomplete="email" placeholder="you@example.com" aria-describedby="LAY015-msg" required><button class="btn" type="submit">登録する</button></div><p class="msg" id="LAY015-msg" role="status" aria-live="polite"></p></form></div><div class="links"><small>© 2026 自分軸ワーク</small><ul><li><a href="#">利用規約</a></li><li><a href="#">プライバシー</a></li></ul></div></footer>
<script>
(function(){var r=document.querySelector('.p-LAY-01-5');if(!r)return;var f=r.querySelector('form'),i=f.querySelector('input'),m=r.querySelector('.msg');function bad(t){i.setAttribute('aria-invalid','true');m.className='msg ng';m.textContent=t;i.focus();}f.addEventListener('submit',function(e){e.preventDefault();if(!i.value.trim()){bad('メールアドレスを入力してください。');return;}if(!i.checkValidity()){bad('メールアドレスの形式を確認してください。');return;}i.removeAttribute('aria-invalid');m.className='msg ok';m.textContent='入力を確認しました。確認用のため送信はしていません。';});i.addEventListener('input',function(){if(i.hasAttribute('aria-invalid')){i.removeAttribute('aria-invalid');m.className='msg';m.textContent='';}});})();
</script>
