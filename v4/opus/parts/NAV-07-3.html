<!-- NAV-07-3 -->
<style>
.p-NAV-07-3{display:grid;justify-items:start;gap:var(--space-4)}.p-NAV-07-3 .seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);min-width:calc(var(--space-16) * 4);padding:var(--space-1);border-radius:var(--radius-md);background:var(--color-surface-strong)}.p-NAV-07-3 .thumb{position:absolute;top:var(--space-1);bottom:var(--space-1);left:var(--space-1);width:calc((100% - var(--space-2)) / 3);border-radius:var(--radius-sm);background:var(--color-brand);box-shadow:var(--shadow-sm);transform:translateX(calc(var(--i, 0) * 100%));transition:transform var(--duration-normal) var(--ease-standard)}.p-NAV-07-3 [role='tab']{position:relative;z-index:var(--z-raised);min-height:var(--size-control-md);padding:0 var(--space-4);border:0;border-radius:var(--radius-sm);background:transparent;color:var(--color-text-muted);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);cursor:pointer;transition:color var(--duration-normal) var(--ease-standard)}.p-NAV-07-3 [role='tab']:hover{color:var(--color-text)}.p-NAV-07-3 [role='tab'][aria-selected='true']{color:var(--color-on-brand);font-weight:var(--font-weight-bold)}.p-NAV-07-3 .panel p{margin:0}.p-NAV-07-3 .label{color:var(--color-text-muted);font-size:var(--font-size-sm)}.p-NAV-07-3 .val{font-size:var(--font-size-3xl);font-weight:var(--font-weight-bold);line-height:var(--line-height-tight);letter-spacing:var(--letter-spacing-tight);font-variant-numeric:tabular-nums}
</style>
<div class='p-NAV-07-3'><div class='seg' role='tablist' aria-label='集計期間'><span class='thumb' aria-hidden='true'></span><button type='button' role='tab' id='n73-t1' aria-selected='true' aria-controls='n73-p1'>週</button><button type='button' role='tab' id='n73-t2' aria-selected='false' aria-controls='n73-p2' tabindex='-1'>月</button><button type='button' role='tab' id='n73-t3' aria-selected='false' aria-controls='n73-p3' tabindex='-1'>年</button></div><div class='panel' role='tabpanel' id='n73-p1' aria-labelledby='n73-t1' tabindex='0'><p class='label'>今週の支出</p><p class='val'>8,200円</p></div><div class='panel' role='tabpanel' id='n73-p2' aria-labelledby='n73-t2' tabindex='0' hidden><p class='label'>今月の支出</p><p class='val'>32,400円</p></div><div class='panel' role='tabpanel' id='n73-p3' aria-labelledby='n73-t3' tabindex='0' hidden><p class='label'>今年の支出</p><p class='val'>386,000円</p></div></div>
<script>
(function(){document.querySelectorAll('.p-NAV-07-3').forEach(function(r){var seg=r.querySelector('.seg'),ts=[].slice.call(r.querySelectorAll('[role=tab]'));function sel(t,f){ts.forEach(function(x){var on=x===t;x.setAttribute('aria-selected',String(on));x.tabIndex=on?0:-1;document.getElementById(x.getAttribute('aria-controls')).hidden=!on});seg.style.setProperty('--i',ts.indexOf(t));if(f)t.focus()}ts.forEach(function(t,i){t.addEventListener('click',function(){sel(t)});t.addEventListener('keydown',function(e){var n=ts.length,j=-1;if(e.key==='ArrowRight')j=(i+1)%n;else if(e.key==='ArrowLeft')j=(i-1+n)%n;else if(e.key==='Home')j=0;else if(e.key==='End')j=n-1;if(j>-1){e.preventDefault();sel(ts[j],true)}})})})})();
</script>
