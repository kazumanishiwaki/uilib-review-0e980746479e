-3 .bars span{flex:1;min-width:0;height:var(--h);background:var(--color-border-strong);border-radius:var(--radius-full);transition:background-color var(--duration-fast) var(--ease-standard)}.p-MEDIA-02-3 .bars span.on{background:var(--color-brand)}.p-MEDIA-02-3 .ph{position:absolute;top:var(--space-5);bottom:0;left:var(--p);width:var(--border-width-medium);background:var(--color-text);transform:translateX(-50%);pointer-events:none}.p-MEDIA-02-3 .ph::before{content:'';position:absolute;top:calc(var(--space-1) * -1);left:50%;width:var(--space-2);height:var(--space-2);border-radius:var(--radius-full);background:var(--color-text);transform:translateX(-50%)}.p-MEDIA-02-3 .marks{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-3)}.p-MEDIA-02-3 .jump{display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--size-control-sm);padding:0 var(--space-3);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-full);background:var(--color-bg);font-size:var(--font-size-xs);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-MEDIA-02-3 .jump:hover{background:var(--color-surface-strong)}.p-MEDIA-02-3 .tm{font-weight:var(--font-weight-bold);color:var(--color-brand);font-variant-numeric:tabular-nums}.p-MEDIA-02-3 .jump:first-child .tm{color:var(--color-warning)}

<script>
(function(){document.querySelectorAll('.p-MEDIA-02-3').forEach(function(r){var w=r.querySelector('.wave'),bs=r.querySelector('.bars'),b=r.querySelector('.play'),c=r.querySelector('.cur'),N=60,D=200,v=0,t=null,dn=false,el=[];for(var i=0;i<N;i++){var h=18+Math.abs(Math.sin(i*0.9)*Math.cos(i*0.31))*62;if(i>=23&&i<33)h=Math.min(100,h+30);var sp=document.createElement('span');sp.style.setProperty('--h',Math.round(h)+'%');bs.appendChild(sp);el.push(sp)}function f(n){n=Math.floor(n);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}function set(n){v=Math.max(0,Math.min(D,n));var p=v/D;r.style.setProperty('--p',(p*100)+'%');el.forEach(function(s,k){s.classList.toggle('on',(k+0.5)/N<=p)});c.textContent=f(v);w.setAttribute('aria-valuenow',Math.floor(v));w.setAttribute('aria-valuetext',f(v))}function stop(){clearInterval(t);t=null;b.setAttribute('aria-pressed','false');b.setAttribute('aria-label','再生')}function play(){if(t)return;if(v>=D)set(0);b.setAttribute('aria-pressed','true');b.setAttribute('aria-label','一時停止');t=setInterval(function(){set(v+1);if(v>=D)stop()},1000)}b.addEventListener('click',function(){if(t)stop();else play()});function at(e){var rc=w.getBoundingClientRect();set((e.clientX-rc.left)/rc.width*D)}w.addEventListener('pointerdown',function(e){dn=true;w.setPointerCapture(e.pointerId);at(e)});w.addEventListener('pointermove',function(e){if(dn)at(e)});w.addEventListener('pointerup',function(){dn=false});w.addEventListener('pointercancel',function(){dn=false});w.addEventListener('keydown',function(e){var m={ArrowRight:5,ArrowUp:5,ArrowLeft:-5,ArrowDown:-5}[e.key];if(m){set(v+m);e.preventDefault()}else if(e.key==='Home'){set(0);e.preventDefault()}else if(e.key==='End'){set(D);e.preventDefault()}});r.querySelectorAll('.jump').forEach(function(j){j.addEventListener('click',function(){set(+j.dataset.t);play()})});set(0)})})();
