<!-- PRINT-05-1 -->
<style>
.p-PRINT-05-1{display:grid;gap:var(--space-4)}.p-PRINT-05-1 .presets{margin:0;padding:0;border:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--space-16)*2),1fr));gap:var(--space-2)}.p-PRINT-05-1 .lg{padding:0;margin-bottom:var(--space-2);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold)}.p-PRINT-05-1 .pr{display:grid;grid-template-columns:auto 1fr;column-gap:var(--space-2);align-items:center;padding:var(--space-3);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-md);cursor:pointer;transition:border-color var(--duration-fast) var(--ease-standard),background-color var(--duration-fast) var(--ease-standard)}.p-PRINT-05-1 .pr:hover{border-color:var(--color-border-strong)}.p-PRINT-05-1 .pr input{margin:0;accent-color:var(--color-brand)}.p-PRINT-05-1 .pr:has(input:checked){border-color:var(--color-brand);background:var(--color-brand-subtle)}.p-PRINT-05-1 .nm{font-weight:var(--font-weight-bold)}.p-PRINT-05-1 .ds{grid-column:2;font-size:var(--font-size-xs);line-height:var(--line-height-snug);color:var(--color-text-muted)}.p-PRINT-05-1 .adv{border-top:var(--border-width-thin) solid var(--color-border);padding-top:var(--space-3)}.p-PRINT-05-1 .adv summary{width:max-content;font-size:var(--font-size-sm);color:var(--color-text-link);cursor:pointer}.p-PRINT-05-1 .spec{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-2);margin:var(--space-3) 0 0}.p-PRINT-05-1 .spec div{padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);background:var(--color-surface)}.p-PRINT-05-1 .spec dt{font-size:var(--font-size-xs);color:var(--color-text-muted)}.p-PRINT-05-1 .spec dd{margin:0;font-weight:var(--font-weight-medium)}.p-PRINT-05-1 .foot{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3)}.p-PRINT-05-1 .go{min-height:var(--size-control-md);padding:0 var(--space-5);border:0;border-radius:var(--radius-md);background:var(--color-brand);color:var(--color-on-brand);font-weight:var(--font-weight-bold);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-PRINT-05-1 .go:hover{background:var(--color-brand-hover)}.p-PRINT-05-1 .go:active{background:var(--color-brand-active)}.p-PRINT-05-1 .st{margin:0;font-size:var(--font-size-sm);color:var(--color-success)}
</style>
<div class='p-PRINT-05-1'><fieldset class='presets'><legend class='lg'>書き出しプリセット</legend><label class='pr'><input type='radio' name='p0501' value='print' checked><span class='nm'>印刷用</span><span class='ds'>入稿・印刷所向け</span></label><label class='pr'><input type='radio' name='p0501' value='web'><span class='nm'>Web用</span><span class='ds'>画面表示・メール添付</span></label><label class='pr'><input type='radio' name='p0501' value='proof'><span class='nm'>校正用</span><span class='ds'>社内確認・軽量</span></label></fieldset><details class='adv'><summary>詳細設定（解像度・色など）</summary><dl class='spec'><div><dt>解像度</dt><dd data-k='dpi'>350dpi</dd></div><div><dt>カラー</dt><dd data-k='color'>CMYK</dd></div><div><dt>塗り足し</dt><dd data-k='bleed'>3mm</dd></div><div><dt>トンボ</dt><dd data-k='marks'>あり</dd></div></dl></details><div class='foot'><button type='button' class='go'>PDFを書き出す</button><p class='st' role='status' aria-live='polite'></p></div></div>
<script>
(function(){var r=document.querySelector('.p-PRINT-05-1');if(!r)return;var P={print:{dpi:'350dpi',color:'CMYK',bleed:'3mm',marks:'あり',n:'印刷用'},web:{dpi:'150dpi',color:'RGB',bleed:'なし',marks:'なし',n:'Web用'},proof:{dpi:'200dpi',color:'RGB',bleed:'3mm',marks:'あり',n:'校正用'}};var st=r.querySelector('.st');function cur(){return P[r.querySelector('input:checked').value]}r.addEventListener('change',function(){var p=cur();r.querySelectorAll('[data-k]').forEach(function(d){d.textContent=p[d.dataset.k]});st.textContent=''});r.querySelector('.go').addEventListener('click',function(){st.textContent='「'+cur().n+'」の設定で書き出しを受け付けました'})})();
</script>
