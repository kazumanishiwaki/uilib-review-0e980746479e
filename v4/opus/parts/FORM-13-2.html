<div class="p-FORM-13-2"><div class="grid"><div class="f"><label class="sub" for="f132-b">金融機関</label><input id="f132-b" value="あおば銀行"></div><div class="f"><label class="sub" for="f132-br">支店</label><input id="f132-br" value="中央支店"></div><div class="f"><label class="sub" for="f132-t">種別</label><select id="f132-t"><option>普通</option><option>当座</option></select></div><div class="f"><label class="sub" for="f132-n">口座番号</label><input id="f132-n" class="mono" inputmode="numeric" maxlength="7" value="1234567"></div></div><div class="name"><label class="lab" for="f132-k">口座名義（カナ）<span class="req">必須</span></label><input id="f132-k" class="k" value="やまだ きょうこ" autocomplete="off" aria-describedby="f132-g"><div class="guide" id="f132-g"><p class="gt"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" stroke-width="1.3"/><path d="M8 7v4M8 4.8v.4" stroke-width="1.5" stroke-linecap="round"/></svg>名義の書き方</p><ul><li>通帳と同じ表記を、全角カタカナで</li><li>姓と名の間はスペース1つ</li><li>小さい文字は大きく（ャ→ヤ、ッ→ツ）</li><li>法人は略語を使う（株式会社→カ）</li></ul><p class="pv"><span class="pl">登録される表記</span><output class="o" for="f132-k"></output></p><p class="chg" aria-live="polite"></p></div></div></div>
<script>
(function(){var SM={'ァ':'ア','ィ':'イ','ゥ':'ウ','ェ':'エ','ォ':'オ','ッ':'ツ','ャ':'ヤ','ュ':'ユ','ョ':'ヨ','ヮ':'ワ','ヵ':'カ','ヶ':'ケ'};function nz(v){var n=0,s=v.normalize('NFKC').replace(/[ぁ-ゖ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)+96)}).replace(/[ァィゥェォッャュョヮヵヶ]/g,function(c){n++;return SM[c]}).replace(/\s+/g,' ').trim();return[s,n]}document.querySelectorAll('.p-FORM-13-2').forEach(function(r){var k=r.querySelector('.k'),o=r.querySelector('.o'),c=r.querySelector('.chg');function upd(){var v=k.value,x=nz(v),t=[];if(/[ぁ-ゖ]/.test(v))t.push('ひらがな→カタカナ');if(/[ｦ-ﾟ]/.test(v))t.push('半角→全角');if(x[1])t.push('小さい文字 '+x[1]+'字');o.textContent=x[0]||'―';if(/[^ァ-ヴー ().]/.test(x[0])){c.textContent='カタカナ以外の文字が含まれています。通帳の表記を確かめてください';c.className='chg is-warn'}else{c.textContent=t.length?'自動で整えた点: '+t.join('、'):'入力どおりに登録します';c.className='chg'}}k.addEventListener('input',upd);k.addEventListener('blur',function(){var x=nz(k.value)[0];if(x!==k.value){k.value=x;upd()}});upd()})})();
</script>
