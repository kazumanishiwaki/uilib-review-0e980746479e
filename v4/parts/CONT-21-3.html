<!-- CONT-21-3 行内アクション型 -->
<style>
.p-CONT-21-3{margin:0;padding:0;list-style:none;border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-md)}.p-CONT-21-3 li{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:var(--border-width-thin) solid var(--color-border)}.p-CONT-21-3 li:last-child{border-bottom:0}.p-CONT-21-3 .av{flex:none;display:grid;place-items:center;width:var(--size-control-md);height:var(--size-control-md);border-radius:var(--radius-full);background:var(--color-brand-subtle);color:var(--color-brand);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold);line-height:var(--line-height-none)}.p-CONT-21-3 .av.b{background:var(--color-success-subtle);color:var(--color-success)}.p-CONT-21-3 .av.c{background:var(--color-warning-subtle);color:var(--color-warning)}.p-CONT-21-3 .tx{flex:1;min-width:calc(var(--space-16) * 2.5)}.p-CONT-21-3 p{margin:0;font-size:var(--font-size-sm);line-height:var(--line-height-snug)}.p-CONT-21-3 b{font-weight:var(--font-weight-bold)}.p-CONT-21-3 time{color:var(--color-text-muted);font-size:var(--font-size-xs)}.p-CONT-21-3 .acts,.p-CONT-21-3 .res{flex:none;display:flex;align-items:center;gap:var(--space-2)}.p-CONT-21-3 li[data-done] .acts,.p-CONT-21-3 li:not([data-done]) .res{display:none}.p-CONT-21-3 button{height:var(--size-control-sm);padding:0 var(--space-4);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-bg);color:var(--color-text);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-CONT-21-3 button:hover{background:var(--color-surface-strong)}.p-CONT-21-3 .ok{border-color:var(--color-brand);background:var(--color-brand);color:var(--color-on-brand);font-weight:var(--font-weight-bold)}.p-CONT-21-3 .ok:hover{background:var(--color-brand-hover)}.p-CONT-21-3 .rt{font-size:var(--font-size-sm);font-weight:var(--font-weight-bold)}.p-CONT-21-3 li[data-done='ok'] .rt{color:var(--color-success)}.p-CONT-21-3 li[data-done='ng'] .rt{color:var(--color-text-muted)}.p-CONT-21-3 .undo{padding:0 var(--space-2);border:0;background:transparent;color:var(--color-text-link);text-decoration:underline}
</style>
<ul class="p-CONT-21-3"><li><span class='av' aria-hidden='true'>高</span><div class='tx'><p><b>高橋</b>さんが「営業部」への参加を申請</p><time>10分前</time></div><div class='acts'><button type='button' class='ok'>承認</button><button type='button' class='ng'>却下</button></div><div class='res'><span class='rt' aria-live='polite'></span><button type='button' class='undo'>取り消す</button></div></li><li><span class='av b' aria-hidden='true'>森</span><div class='tx'><p><b>森</b>さんから「企画会議」への招待</p><time>1時間前</time></div><div class='acts'><button type='button' class='ok'>承認</button><button type='button' class='ng'>却下</button></div><div class='res'><span class='rt' aria-live='polite'></span><button type='button' class='undo'>取り消す</button></div></li><li><span class='av c' aria-hidden='true'>中</span><div class='tx'><p><b>中村</b>さんが経費 ¥8,400 を申請</p><time>昨日</time></div><div class='acts'><button type='button' class='ok'>承認</button><button type='button' class='ng'>却下</button></div><div class='res'><span class='rt' aria-live='polite'></span><button type='button' class='undo'>取り消す</button></div></li></ul>
<script>
(function(){document.querySelectorAll('.p-CONT-21-3 li').forEach(function(li){var rt=li.querySelector('.rt'),u=li.querySelector('.undo');function done(k){li.setAttribute('data-done',k);rt.textContent=k==='ok'?'✓ 承認しました':'却下しました';u.focus();}li.querySelector('.ok').addEventListener('click',function(){done('ok');});li.querySelector('.ng').addEventListener('click',function(){done('ng');});u.addEventListener('click',function(){li.removeAttribute('data-done');rt.textContent='';li.querySelector('.ok').focus();});});})();
</script>
