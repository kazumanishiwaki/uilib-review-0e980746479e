<div class="p-COPY-04-4"><div class="stage"><div class="back" data-back inert><button type="button" class="btn" data-open>リポジトリを削除…</button><p class="status" data-status role="status"></p></div><div class="ov" data-ov><div class="dlg" role="alertdialog" aria-labelledby="copy044-t" aria-describedby="copy044-d" tabindex="-1" data-dlg><h3 class="ttl" id="copy044-t">リポジトリ「shop-web」を削除しますか？</h3><p class="txt" id="copy044-d">コード、課題、履歴がすべて削除されます。この操作は元に戻せません。</p><label class="lbl" for="copy044-in">確認のため、リポジトリ名 <code>shop-web</code> を入力してください</label><input class="inp" id="copy044-in" type="text" autocomplete="off" spellcheck="false" aria-describedby="copy044-h" data-in><p class="hint" id="copy044-h" data-hint aria-live="polite">名前が一致すると、削除できるようになります</p><div class="acts"><button type="button" class="btn" data-result="キャンセルしました">キャンセル</button><button type="button" class="btn btn--danger" data-go data-result="リポジトリ「shop-web」を削除しました" disabled>このリポジトリを削除する</button></div></div></div></div></div>
<script>
