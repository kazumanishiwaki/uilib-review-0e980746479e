<!-- COPY-07-1 動詞単独型 -->
<style>
.p-COPY-07-1{font-family:var(--font-sans);font-size:var(--font-size-md);line-height:var(--line-height-normal);letter-spacing:var(--letter-spacing-normal);color:var(--color-text);}.p-COPY-07-1 .card{border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden;}.p-COPY-07-1 .hd{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-3) var(--space-4);background:var(--color-surface);border-bottom:var(--border-width-thin) solid var(--color-border);}.p-COPY-07-1 .ttl{margin:0;font-size:var(--font-size-md);font-weight:var(--font-weight-bold);}.p-COPY-07-1 .list{list-style:none;margin:0;padding:0 var(--space-4);}.p-COPY-07-1 .list li{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) 0;border-bottom:var(--border-width-thin) solid var(--color-border);font-size:var(--font-size-sm);}.p-COPY-07-1 .ft{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:var(--space-2);padding:var(--space-3) var(--space-4);}.p-COPY-07-1 .st{margin-right:auto;font-size:var(--font-size-sm);color:var(--color-text-muted);}.p-COPY-07-1 .btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--size-control-md);padding:0 var(--space-4);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-bg);color:var(--color-text);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);line-height:var(--line-height-snug);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard);}.p-COPY-07-1 .btn:hover{background:var(--color-surface-strong);}.p-COPY-07-1 .btn--sm{min-height:var(--size-control-sm);padding:0 var(--space-3);font-size:var(--font-size-xs);}.p-COPY-07-1 .btn--primary{background:var(--color-brand);border-color:var(--color-brand);color:var(--color-on-brand);}.p-COPY-07-1 .btn--primary:hover{background:var(--color-brand-hover);border-color:var(--color-brand-hover);}.p-COPY-07-1 .btn--primary:active{background:var(--color-brand-active);border-color:var(--color-brand-active);}
</style>
<div class="p-COPY-07-1"><section class="card"><header class="hd"><h3 class="ttl">メンバー</h3><button type="button" class="btn" data-add>追加</button></header><ul class="list" data-list><li><span>佐藤 美咲</span><button type="button" class="btn btn--sm" data-del aria-label="佐藤 美咲を削除">削除</button></li><li><span>田中 蓮</span><button type="button" class="btn btn--sm" data-del aria-label="田中 蓮を削除">削除</button></li></ul><footer class="ft"><span class="st" data-st role="status"></span><button type="button" class="btn" data-cancel>キャンセル</button><button type="button" class="btn btn--primary" data-save>保存</button></footer></section></div>
<script>
(function(){document.querySelectorAll('.p-COPY-07-1').forEach(function(r){var list=r.querySelector('[data-list]'),st=r.querySelector('[data-st]'),names=['鈴木 陽菜','高橋 湊','伊藤 結衣'],n=0;r.querySelector('[data-add]').addEventListener('click',function(){if(list.children.length>=5){st.textContent='追加できるのは5人までです';return;}var name=names[n%names.length];n++;var li=document.createElement('li'),s=document.createElement('span'),b=document.createElement('button');s.textContent=name;b.type='button';b.className='btn btn--sm';b.setAttribute('data-del','');b.setAttribute('aria-label',name+'を削除');b.textContent='削除';li.appendChild(s);li.appendChild(b);list.appendChild(li);st.textContent='';});list.addEventListener('click',function(e){var b=e.target.closest('[data-del]');if(b){b.parentNode.remove();st.textContent='';}});r.querySelector('[data-save]').addEventListener('click',function(){st.textContent='保存しました';});r.querySelector('[data-cancel]').addEventListener('click',function(){st.textContent='変更を取り消しました';});});})();
</script>
