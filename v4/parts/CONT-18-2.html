<!-- CONT-18-2 画像つき選択肢型 -->
<style>
.p-CONT-18-2{min-width:0;margin:0;padding:0;border:0}.p-CONT-18-2 legend{margin-bottom:var(--space-3);padding:0;font-weight:var(--font-weight-bold);line-height:var(--line-height-snug)}.p-CONT-18-2 .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3)}.p-CONT-18-2 .opt{position:relative;display:block;cursor:pointer}.p-CONT-18-2 input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}.p-CONT-18-2 .card{display:block;border:var(--border-width-medium) solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg);overflow:hidden;transition:border-color var(--duration-fast) var(--ease-standard)}.p-CONT-18-2 .opt:hover .card{border-color:var(--color-border-strong)}.p-CONT-18-2 input:checked + .card{border-color:var(--color-brand)}.p-CONT-18-2 input:focus-visible + .card{box-shadow:var(--focus-ring)}.p-CONT-18-2 .pic{display:block;aspect-ratio:4/3;background:linear-gradient(135deg,var(--color-brand-subtle),var(--color-info-subtle));color:var(--color-brand)}.p-CONT-18-2 .pic.k2{background:linear-gradient(135deg,var(--color-success-subtle),var(--color-info-subtle));color:var(--color-success)}.p-CONT-18-2 .pic.k3{background:linear-gradient(135deg,var(--color-warning-subtle),var(--color-danger-subtle));color:var(--color-warning)}.p-CONT-18-2 .pic.k4{background:linear-gradient(135deg,var(--color-surface-strong),var(--color-brand-subtle));color:var(--color-text-muted)}.p-CONT-18-2 .pic svg{display:block;width:100%;height:100%;fill:currentColor}.p-CONT-18-2 .cap{display:flex;justify-content:space-between;padding:var(--space-2) var(--space-3);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold)}.p-CONT-18-2 input:checked + .card .cap{background:var(--color-brand-subtle);color:var(--color-brand)}.p-CONT-18-2 input:checked + .card .cap span:first-child::after{content:'✓';margin-left:var(--space-1)}.p-CONT-18-2 .pc{visibility:hidden;letter-spacing:var(--letter-spacing-tight)}.p-CONT-18-2 .mt{display:block;height:var(--space-1);background:var(--color-surface-strong)}.p-CONT-18-2 .mt i{display:block;width:0;height:100%;background:var(--color-brand);transition:width var(--duration-slow) var(--ease-standard)}.p-CONT-18-2.is-voted .pc{visibility:visible}.p-CONT-18-2.is-voted .w1{width:41%}.p-CONT-18-2.is-voted .w2{width:27%}.p-CONT-18-2.is-voted .w3{width:22%}.p-CONT-18-2.is-voted .w4{width:10%}.p-CONT-18-2.is-voted .opt,.p-CONT-18-2.is-voted input{cursor:default}.p-CONT-18-2 .ft{display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-4)}.p-CONT-18-2 .vote{height:var(--size-control-md);padding:0 var(--space-5);border:var(--border-width-thin) solid var(--color-brand);border-radius:var(--radius-md);background:var(--color-brand);color:var(--color-on-brand);font-size:var(--font-size-sm);font-weight:var(--font-weight-bold);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-CONT-18-2 .vote:hover{background:var(--color-brand-hover)}.p-CONT-18-2 .vote:disabled,.p-CONT-18-2 .vote:disabled:hover{border-color:var(--color-disabled-border);background:var(--color-disabled-bg);color:var(--color-disabled-text);cursor:not-allowed}.p-CONT-18-2 .msg{color:var(--color-text-muted);font-size:var(--font-size-sm)}
</style>
<fieldset class="p-CONT-18-2"><legend>どの表紙案が好きですか？</legend><div class='grid'><label class='opt'><input type='radio' name='p-CONT-18-2-v'><span class='card'><span class='pic' aria-hidden='true'><svg viewBox='0 0 40 30'><circle cx='20' cy='15' r='9'/></svg></span><span class='cap'><span>A案</span><span class='pc'>41%</span></span><span class='mt'><i class='w1'></i></span></span></label><label class='opt'><input type='radio' name='p-CONT-18-2-v'><span class='card'><span class='pic k2' aria-hidden='true'><svg viewBox='0 0 40 30'><rect x='11' y='6' width='18' height='18'/></svg></span><span class='cap'><span>B案</span><span class='pc'>27%</span></span><span class='mt'><i class='w2'></i></span></span></label><label class='opt'><input type='radio' name='p-CONT-18-2-v'><span class='card'><span class='pic k3' aria-hidden='true'><svg viewBox='0 0 40 30'><path d='M20 5l11 20H9z'/></svg></span><span class='cap'><span>C案</span><span class='pc'>22%</span></span><span class='mt'><i class='w3'></i></span></span></label><label class='opt'><input type='radio' name='p-CONT-18-2-v'><span class='card'><span class='pic k4' aria-hidden='true'><svg viewBox='0 0 40 30'><path d='M6 19h28v5H6zm6-13h16v9H12z'/></svg></span><span class='cap'><span>D案</span><span class='pc'>10%</span></span><span class='mt'><i class='w4'></i></span></span></label></div><div class='ft'><button type='button' class='vote' disabled>投票する</button><span class='msg' aria-live='polite'>画像を選んでください</span></div></fieldset>
<script>
(function(){document.querySelectorAll('.p-CONT-18-2').forEach(function(r){var ins=[].slice.call(r.querySelectorAll('input')),b=r.querySelector('.vote'),m=r.querySelector('.msg');ins.forEach(function(i){i.addEventListener('change',function(){b.disabled=false;m.textContent='';});});b.addEventListener('click',function(){r.classList.add('is-voted');ins.forEach(function(i){if(!i.checked){i.disabled=true;}});b.disabled=true;b.textContent='投票しました';m.textContent='合計 312票';});});})();
</script>
