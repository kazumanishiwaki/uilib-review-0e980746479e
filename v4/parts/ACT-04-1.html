<!-- ACT-04-1 インライン型 -->
<style>
.p-ACT-04-1{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3) var(--space-4);padding:var(--space-4) 0;border-top:var(--border-width-thin) solid var(--color-border);border-bottom:var(--border-width-thin) solid var(--color-border)}.p-ACT-04-1 .ttl{font-size:var(--font-size-sm);font-weight:var(--font-weight-bold);color:var(--color-text-muted);line-height:var(--line-height-snug)}.p-ACT-04-1 .list{display:flex;flex-wrap:wrap;gap:var(--space-2);margin:0;padding:0;list-style:none}.p-ACT-04-1 .btn{display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--size-control-md);padding:var(--space-1) var(--space-4) var(--space-1) var(--space-3);background-color:var(--color-bg);color:var(--color-text);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-md);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);line-height:var(--line-height-snug);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard),color var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard)}.p-ACT-04-1 .btn svg{width:var(--size-icon-sm);height:var(--size-icon-sm);fill:none;stroke:currentColor;stroke-width:var(--border-width-medium);stroke-linejoin:round}.p-ACT-04-1 .btn:hover{background-color:var(--color-surface-strong)}.p-ACT-04-1 .btn.is-done{background-color:var(--color-success-subtle);border-color:var(--color-success-border);color:var(--color-success)}
</style>
<div class="p-ACT-04-1"><span class="ttl">この記事を共有</span><ul class="list"><li><button type="button" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>X</button></li><li><button type="button" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5h-1.5A2.5 2.5 0 0 0 11 7.5V19M8 11h6"/></svg>Facebook</button></li><li><button type="button" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v10H10l-4 3v-3H5z"/></svg>LINE</button></li><li><button type="button" class="btn copy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span class="copy-label" aria-live="polite">リンクをコピー</span></button></li></ul></div>
<script>
(function(){document.querySelectorAll('.p-ACT-04-1 .copy').forEach(function(b){var l=b.querySelector('.copy-label'),t=null;b.addEventListener('click',function(){b.classList.add('is-done');l.textContent='コピーしました';clearTimeout(t);t=setTimeout(function(){b.classList.remove('is-done');l.textContent='リンクをコピー';},2000);});});})();
</script>
