<div class="p-COPY-04-2"><div class="stage"><div class="back" data-back inert><button type="button" class="btn" data-open>下書きを削除…</button><p class="status" data-status role="status"></p></div><div class="ov" data-ov><div class="dlg" role="alertdialog" aria-labelledby="copy042-t" aria-describedby="copy042-d" tabindex="-1" data-dlg><h3 class="ttl" id="copy042-t">下書き「11月の企画案」を削除しますか？</h3><div id="copy042-d"><p class="irr"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 6v5M10 14v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>この操作は元に戻せません。</span></p><p class="txt">削除した下書きは、ごみ箱にも残りません。</p></div><div class="acts"><button type="button" class="btn" data-result="キャンセルしました">キャンセル</button><button type="button" class="btn btn--danger" data-result="下書き「11月の企画案」を削除しました">削除する</button></div></div></div></div></div>
<script>
(function(){document.querySelectorAll('.p-COPY-04-2').forEach(function(r){var ov=r.querySelector('[data-ov]'),dlg=r.querySelector('[data-dlg]'),back=r.querySelector('[data-back]'),op=r.querySelector('[data-open]'),st=r.querySelector('[data-status]');function close(m){ov.setAttribute('data-hidden','');back.inert=false;st.textContent=m;op.focus();}function open(){ov.removeAttribute('data-hidden');back.inert=true;st.textContent='';dlg.focus();}op.addEventListener('click',open);r.querySelectorAll('[data-result]').forEach(function(b){b.addEventListener('click',function(){close(b.getAttribute('data-result'));});});dlg.addEventListener('keydown',function(e){if(e.key==='Escape')close('キャンセルしました');});});})();
