<div class="p-CONT-10-2"><div class='lead'><p class='lt'>先にご確認ください</p><ul><li>特典は初めて申し込む方のみ対象です。</li><li>申込期限は12月20日です。</li></ul></div><div class='bar'><span class='ttl'>キャンペーン条件</span><button type='button' class='all' aria-expanded='false'>すべて開く</button></div><div class='list'><details class='it'><summary class='s'><span class='no'>1</span><span class='h'>対象となる方</span><svg class='chev' viewBox='0 0 24 24' aria-hidden='true'><path d='M6 9l6 6 6-6'/></svg></summary><p class='a'>期間中に新規で申し込み、翌月末まで契約を継続した方が対象です。</p></details><details class='it'><summary class='s'><span class='no'>2</span><span class='h'>特典の内容と時期</span><svg class='chev' viewBox='0 0 24 24' aria-hidden='true'><path d='M6 9l6 6 6-6'/></svg></summary><p class='a'>3,000円分のポイントを、申込の翌々月に付与します。</p></details><details class='it'><summary class='s'><span class='no'>3</span><span class='h'>対象外となる場合</span><svg class='chev' viewBox='0 0 24 24' aria-hidden='true'><path d='M6 9l6 6 6-6'/></svg></summary><p class='a'>過去に契約のある方、法人名義の申込、他の特典との併用は対象外です。</p></details><details class='it'><summary class='s'><span class='no'>4</span><span class='h'>変更・終了について</span><svg class='chev' viewBox='0 0 24 24' aria-hidden='true'><path d='M6 9l6 6 6-6'/></svg></summary><p class='a'>予告なく内容を変更、または終了する場合があります。</p></details></div></div>
<script>
(function(){document.querySelectorAll('.p-CONT-10-2').forEach(function(r){var b=r.querySelector('.all'),d=r.querySelectorAll('.it');if(!b||!d.length)return;function allOpen(){return Array.prototype.every.call(d,function(x){return x.open;});}function sync(){var a=allOpen();b.textContent=a?'すべて閉じる':'すべて開く';b.setAttribute('aria-expanded',String(a));}b.addEventListener('click',function(){var a=allOpen();d.forEach(function(x){x.open=!a;});sync();});d.forEach(function(x){x.addEventListener('toggle',sync);});});})();
</script>
