<div class="p-COPY-04-3"><div class="stage"><div class="back" data-back inert><button type="button" class="btn" data-open>書類を閉じる…</button><p class="status" data-status role="status"></p></div><div class="ov" data-ov><div class="dlg" role="alertdialog" aria-labelledby="copy043-t" aria-describedby="copy043-d" tabindex="-1" data-dlg><h3 class="ttl" id="copy043-t">「見積書_11月」への変更を保存しますか？</h3><p class="txt" id="copy043-d">保存していない変更があります。保存しないと、変更した内容は失われます。</p><div class="acts"><button type="button" class="btn btn--quiet" data-result="変更を保存せずに閉じました">保存しない</button><button type="button" class="btn" data-result="キャンセルしました。編集を続けられます">キャンセル</button><button type="button" class="btn btn--primary" data-result="変更を保存して閉じました">保存する</button></div></div></div></div></div>
