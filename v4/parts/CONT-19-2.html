<article class="p-CONT-19-2"><p>国内の利用者は5年で約2倍に増えた<sup><a href='#p-CONT-19-2-n1' aria-label='出典1'>1</a></sup>。とくに60代の伸びが大きく<sup><a href='#p-CONT-19-2-n2' aria-label='出典2'>2</a></sup>、地方での普及も進んでいる<sup><a href='#p-CONT-19-2-n3' aria-label='出典3'>3</a></sup>。</p><footer><h4>出典</h4><ol><li id='p-CONT-19-2-n1'>総務省「通信利用動向調査」2025年</li><li id='p-CONT-19-2-n2'>情報白書編集委員会『情報白書 2025』p.48</li><li id='p-CONT-19-2-n3'>地域ICT研究会「地方の普及状況」2024年</li></ol></footer></article>
