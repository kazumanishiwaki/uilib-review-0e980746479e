<!-- CONT-10-1 スクロールボックス型 -->
<style>
.p-CONT-10-1 .t{margin:0 0 var(--space-2);font-size:var(--font-size-md);font-weight:var(--font-weight-bold);line-height:var(--line-height-snug)}.p-CONT-10-1 .box{height:calc(var(--space-16) * 3);overflow-y:auto;padding:var(--space-4);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-surface);font-size:var(--font-size-sm);line-height:var(--line-height-loose)}.p-CONT-10-1 .box h4{margin:0;font-size:var(--font-size-sm);font-weight:var(--font-weight-bold)}.p-CONT-10-1 .box p{margin:0 0 var(--space-3)}.p-CONT-10-1 .box .end{margin:0;text-align:right;color:var(--color-text-muted)}.p-CONT-10-1 .hint{margin:var(--space-2) 0 0;font-size:var(--font-size-xs);color:var(--color-text-muted)}.p-CONT-10-1 .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3);margin-top:var(--space-3)}.p-CONT-10-1 .agree{display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--size-touch-min);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);cursor:pointer}.p-CONT-10-1 .agree:has(.cb:disabled){color:var(--color-disabled-text);cursor:not-allowed}.p-CONT-10-1 .cb{width:var(--size-icon-md);height:var(--size-icon-md);margin:0;accent-color:var(--color-brand);border-radius:var(--radius-xs)}.p-CONT-10-1 .btn{min-height:var(--size-control-md);padding:0 var(--space-6);border:var(--border-width-thin) solid transparent;border-radius:var(--radius-md);background:var(--color-brand);color:var(--color-on-brand);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-CONT-10-1 .btn:hover{background:var(--color-brand-hover)}.p-CONT-10-1 .btn:active{background:var(--color-brand-active)}.p-CONT-10-1 .btn:disabled{background:var(--color-disabled-bg);border-color:var(--color-disabled-border);color:var(--color-disabled-text);cursor:not-allowed}
</style>
<div class="p-CONT-10-1"><h3 class='t'>利用規約</h3><div class='box' tabindex='0' role='region' aria-label='利用規約の全文'><h4>第1条（適用）</h4><p>本規約は、当社が提供するサービスの利用に関する条件を定めるものです。</p><h4>第2条（登録）</h4><p>利用を希望する方は、当社の定める方法で登録を申し込むものとします。</p><h4>第3条（料金）</h4><p>利用料金は、料金表に定める金額とし、毎月末日に請求します。</p><h4>第4条（禁止事項）</h4><p>法令に違反する行為、および他の利用者の迷惑となる行為を禁止します。</p><h4>第5条（解約）</h4><p>利用者は、所定の手続きによりいつでも解約できます。</p><p class='end'>以上</p></div><p class='hint' aria-live='polite'>最後までスクロールすると同意できます。</p><div class='foot'><label class='agree'><input type='checkbox' class='cb' disabled><span>利用規約に同意する</span></label><button type='button' class='btn' disabled>申し込む</button></div></div>
<script>
(function(){document.querySelectorAll('.p-CONT-10-1').forEach(function(r){var b=r.querySelector('.box'),c=r.querySelector('.cb'),n=r.querySelector('.btn'),h=r.querySelector('.hint');if(!b||!c||!n)return;var done=false;function check(){if(done)return;if(b.clientHeight>0&&b.scrollTop+b.clientHeight>=b.scrollHeight-4){done=true;c.disabled=false;h.textContent='全文を確認しました。同意にチェックしてください。';}}b.addEventListener('scroll',check);c.addEventListener('change',function(){n.disabled=!c.checked;});check();});})();
</script>
