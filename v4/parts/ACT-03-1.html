<!-- ACT-03-1 アイコンのみ標準型 -->
<style>
.p-ACT-03-1{position:relative;height:calc(var(--space-16) * 4);border:var(--border-width-thin) solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden;background-color:var(--color-bg)}.p-ACT-03-1 .scroll{height:100%;overflow-y:auto;padding-bottom:calc(var(--size-control-xl) + var(--space-8))}.p-ACT-03-1 .scroll:focus-visible{box-shadow:inset 0 0 0 var(--focus-ring-width) var(--color-focus)}.p-ACT-03-1 .list{margin:0;padding:0;list-style:none}.p-ACT-03-1 .list li{padding:var(--space-3) var(--space-4);border-bottom:var(--border-width-thin) solid var(--color-border);font-size:var(--font-size-sm);line-height:var(--line-height-snug)}.p-ACT-03-1 .list li.is-new{animation:p-ACT-03-1-new var(--duration-slow) var(--ease-out)}.p-ACT-03-1 .fab{position:absolute;right:var(--space-4);bottom:var(--space-4);z-index:var(--z-raised);display:grid;place-items:center;width:var(--size-control-xl);height:var(--size-control-xl);padding:0;background-color:var(--color-surface-inverse);color:var(--color-text-inverse);border:0;border-radius:var(--radius-full);box-shadow:var(--shadow-lg);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard),transform var(--duration-instant) var(--ease-standard)}.p-ACT-03-1 .fab svg{width:var(--size-icon-lg);height:var(--size-icon-lg);fill:none;stroke:currentColor;stroke-width:var(--border-width-medium)}.p-ACT-03-1 .fab:hover{background-color:var(--color-text)}.p-ACT-03-1 .fab:active{transform:scale(0.94)}.p-ACT-03-1 .fab:focus-visible{box-shadow:var(--focus-ring),var(--shadow-lg)}@keyframes p-ACT-03-1-new{from{opacity:0;background-color:var(--color-brand-subtle)}to{opacity:1;background-color:transparent}}
</style>
<div class="p-ACT-03-1"><div class="scroll" tabindex="0" role="group" aria-label="メモ一覧"><ul class="list"><li>買い物リスト</li><li>会議の議事録</li><li>旅行の計画</li><li>読みたい本</li><li>週末の予定</li><li>アイデア</li></ul></div><button type="button" class="fab" aria-label="新規作成"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
<script>
(function(){document.querySelectorAll('.p-ACT-03-1').forEach(function(root){var sc=root.querySelector('.scroll'),list=root.querySelector('.list');root.querySelector('.fab').addEventListener('click',function(){var li=document.createElement('li');li.className='is-new';li.textContent='新しいメモ';list.insertBefore(li,list.firstChild);sc.scrollTop=0;});});})();
</script>
