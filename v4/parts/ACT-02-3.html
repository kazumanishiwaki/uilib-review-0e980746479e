<!-- ACT-02-3 リアクション型 -->
<style>
.p-ACT-02-3{display:flex;justify-content:center;padding:var(--space-6) var(--space-4)}.p-ACT-02-3 .btn{display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--size-control-md);padding:var(--space-1) var(--space-4) var(--space-1) var(--space-3);background-color:var(--color-bg);color:var(--color-text-muted);border:var(--border-width-thin) solid var(--color-border-strong);border-radius:var(--radius-full);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);line-height:var(--line-height-snug);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard),color var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard)}.p-ACT-02-3 .btn svg{width:var(--size-icon-md);height:var(--size-icon-md);fill:none;stroke:currentColor;stroke-width:var(--border-width-medium);stroke-linejoin:round}.p-ACT-02-3 .count{padding-left:var(--space-2);border-left:var(--border-width-thin) solid var(--color-border);color:var(--color-text);font-weight:var(--font-weight-bold);font-variant-numeric:tabular-nums;letter-spacing:var(--letter-spacing-tight)}.p-ACT-02-3 .btn:hover{background-color:var(--color-surface-strong)}.p-ACT-02-3 .btn[aria-pressed=true]{background-color:var(--color-danger-subtle);border-color:var(--color-danger-border);color:var(--color-danger)}.p-ACT-02-3 .btn[aria-pressed=true] svg{fill:currentColor;animation:p-ACT-02-3-pop var(--duration-slow) var(--ease-standard)}.p-ACT-02-3 .btn[aria-pressed=true] .count{border-left-color:var(--color-danger-border);color:var(--color-danger)}@keyframes p-ACT-02-3-pop{0%{transform:scale(0.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
</style>
<div class="p-ACT-02-3"><button type="button" class="btn" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span class="txt">いいね</span><span class="count">24</span></button></div>
<script>
(function(){document.querySelectorAll('.p-ACT-02-3 .btn').forEach(function(b){var c=b.querySelector('.count');b.addEventListener('click',function(){var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);c.textContent=parseInt(c.textContent,10)+(on?1:-1);});});})();
