<!-- ACT-04-3 画像オーバーレイ型 -->
<style>
.p-ACT-04-3{position:relative;max-width:calc(var(--space-16) * 7);aspect-ratio:3 / 2;margin:0 auto;overflow:hidden;border-radius:var(--radius-md);background-color:var(--color-surface-strong)}.p-ACT-04-3 .img{position:absolute;inset:0;display:block;width:100%;height:100%}.p-ACT-04-3 .sky{fill:var(--color-info-subtle)}.p-ACT-04-3 .sun{fill:var(--color-warning-border)}.p-ACT-04-3 .far{fill:var(--color-info-border)}.p-ACT-04-3 .near{fill:var(--color-border-strong)}.p-ACT-04-3 .tools{position:absolute;top:var(--space-3);right:var(--space-3);z-index:var(--z-raised);display:flex;gap:var(--space-2);transition:opacity var(--duration-normal) var(--ease-standard)}@media (hover:hover){.p-ACT-04-3 .tools{opacity:0}.p-ACT-04-3:hover .tools,.p-ACT-04-3:focus-within .tools,.p-ACT-04-3.is-open .tools{opacity:1}}.p-ACT-04-3 .tool{display:grid;place-items:center;width:var(--size-control-md);height:var(--size-control-md);padding:0;background-color:var(--color-surface-raised);color:var(--color-text);border:0;border-radius:var(--radius-full);box-shadow:var(--shadow-sm);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard),color var(--duration-fast) var(--ease-standard)}.p-ACT-04-3 .tool svg{width:var(--size-icon-md);height:var(--size-icon-md);fill:none;stroke:currentColor;stroke-width:var(--border-width-medium);stroke-linejoin:round}.p-ACT-04-3 .tool:hover{background-color:var(--color-surface-strong)}.p-ACT-04-3 .tool:focus-visible{box-shadow:var(--focus-ring)}.p-ACT-04-3 .save[aria-pressed=true]{color:var(--color-brand)}.p-ACT-04-3 .save[aria-pressed=true] svg{fill:currentColor}.p-ACT-04-3 .menu{position:absolute;top:calc(var(--space-3) + var(--size-control-md) + var(--space-2));right:var(--space-3);z-index:var(--z-dropdown);min-width:calc(var(--space-16) * 2.5);margin:0;padding:var(--space-1);list-style:none;background-color:var(--color-surface-raised);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);animation:p-ACT-04-3-in var(--duration-normal) var(--ease-out)}.p-ACT-04-3 .menu[hidden]{display:none}.p-ACT-04-3 .menu button{display:block;width:100%;padding:var(--space-2) var(--space-3);background-color:transparent;border:0;border-radius:var(--radius-sm);font-size:var(--font-size-sm);line-height:var(--line-height-snug);text-align:left;cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}.p-ACT-04-3 .menu button:hover{background-color:var(--color-surface-strong)}@keyframes p-ACT-04-3-in{from{opacity:0;transform:translateY(calc(var(--space-1) * -1))}to{opacity:1;transform:none}}
</style>
<figure class="p-ACT-04-3"><svg class="img" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="山の写真"><rect class="sky" width="300" height="200"/><circle class="sun" cx="222" cy="58" r="20"/><path class="far" d="M0 200V140L80 70l60 60 50-40 110 80v30z"/><path class="near" d="M0 200v-30l110-50 90 45 100-25v60z"/></svg><div class="tools"><button type="button" class="tool save" aria-pressed="false" aria-label="保存"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16l-5-4-5 4z"/></svg></button><button type="button" class="tool share" aria-expanded="false" aria-controls="p-ACT-04-3-menu" aria-label="この画像を共有"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 12v7h14v-7"/></svg></button></div><ul class="menu" id="p-ACT-04-3-menu" hidden><li><button type="button">Xで共有</button></li><li><button type="button">LINEで送る</button></li><li><button type="button">画像リンクをコピー</button></li></ul></figure>
<script>
(function(){document.querySelectorAll('.p-ACT-04-3').forEach(function(root){var sv=root.querySelector('.save'),sh=root.querySelector('.share'),m=root.querySelector('.menu');function open(o){m.hidden=!o;sh.setAttribute('aria-expanded',o);root.classList.toggle('is-open',o);}sv.addEventListener('click',function(){sv.setAttribute('aria-pressed',sv.getAttribute('aria-pressed')!=='true');});sh.addEventListener('click',function(e){e.stopPropagation();open(m.hidden);});root.addEventListener('click',function(){open(false);});root.addEventListener('keydown',function(e){if(e.key==='Escape'&&!m.hidden){open(false);sh.focus();}});});})();
</script>
